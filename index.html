  // 20원부터: 화면을 벗겨 내고 밖으로 사라졌던 황금새가 왼쪽 위에서 다시 날아와 왼쪽 문주 위에 앉아,
  // 고개를 푹 숙이고 광장을 내려다보며 황당해한다
  function pzPerchBird(c){
    if(plaza.fee < 20) return;   // 20원부터
    const age = time - plaza.t0, T0 = 1.6 + PEEL_IN + PEEL_BITE + PEEL_PULL * 0.55, FLY = 0.95;   // 벗겨 낸 새가 화면 밖으로 사라지는 순간 곧바로 날아든다
    if(age < T0) return;
    const PX = 72, PY = 247.5, sc = 0.72;   // 왼쪽 문주 위 (조금 안쪽)
    const u = clamp((age - T0) / FLY, 0, 1), sitting = u >= 1;
    const st = age - T0 - FLY;
    let x, y, wing, tilt = 0;   // 오른쪽(광장)을 보고 있으므로 +회전이 고개 숙임, -회전이 고개 듦
    if(!sitting){
      // 왼쪽 위 화면 밖에서 비스듬히 내려오다 오른쪽으로 살짝 휘어 들어와, 날개를 활짝 펴고 몸을 세워 내려앉는다
      const e = 1 - Math.pow(1 - u, 1.8), iu = 1 - e;
      const P0 = [-26, 30], P1 = [16, 214], P2 = [PX, PY];   // 화면 가장자리에서 곧바로 모습을 드러낸다
      x = iu * iu * P0[0] + 2 * iu * e * P1[0] + e * e * P2[0];
      y = iu * iu * P0[1] + 2 * iu * e * P1[1] + e * e * P2[1];
      const flap = motionOK ? Math.sin(time * 15) : 0;
      if(u < 0.78){ wing = -0.55 + flap * 0.75; y += flap * 1.6; tilt = 0.12; }
      else{
        const f = (u - 0.78) / 0.22;
        wing = lerp(-0.55 + flap * 0.75, -1.35, f);
        tilt = lerp(0.12, -0.3, f);
      }
    }else{
      const fold = clamp(st / 0.4, 0, 1);
      wing = lerp(-1.35, 0.15, ease(fold));
      x = PX; y = PY + (st < 0.4 ? Math.sin(st / 0.4 * Math.PI) * 2 * (1 - st / 0.4) : 0);
      // 날개를 접고 나면 고개를 푹 숙여 광장을 내려다본다 (가끔 더 깊이 들여다보며 갸웃)
      const bow = ease(clamp((st - 0.35) / 0.45, 0, 1));
      const peer = motionOK ? Math.max(0, Math.sin(st * 1.4)) * 0.12 : 0.05;
      tilt = lerp(-0.3, 0, ease(fold)) + bow * (0.55 + peer);
    }
    if(sfxOnce('birdFly')) Sound.whoosh();
    if(sitting && sfxOnce('birdLand')) Sound.huh();
    const turned = sitting && st > 0.75;
    c.save(); c.translate(x, y); c.rotate(tilt); c.scale(-sc, sc);
    drawMagpie(c, { x:0, y:-5, wing:wing, puzzled:true, lookDown:true, open:2 });   // 날아 들어올 때부터 황당한 표정
    c.restore();
    // 머리 위치
    const h0x = 19.2 * sc, h0y = -57.8 * sc, ct = Math.cos(tilt), sn = Math.sin(tilt);
    const hx = x + h0x * ct - h0y * sn, hy = y + h0x * sn + h0y * ct;
    if(!turned){
      // 날아오는 동안에도 머리 위에 물음표 하나가 따라온다
      const bob = motionOK ? Math.sin(time * 8) * 2 : 0;
      c.save(); c.translate(hx + 4, hy - 16 + bob); c.rotate(0.2);
      c.font = '900 18px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = '#3a1800'; c.strokeText('?', 0, 0);
      c.fillStyle = '#ffd23f'; c.fillText('?', 0, 0);
      c.restore();
      return;
    }
    const t2 = st - 0.75;
    [[30, -2, 16], [12, -16, 22], [-6, -10, 14]].forEach(function(q, j){
      const pop = clamp((t2 - 0.2 - j * 0.3) / 0.25, 0, 1);
      if(pop <= 0) return;
      if(sfxOnce('q' + j)) Sound.huh(true);
      const bob = motionOK ? Math.sin(time * 4 + j * 1.7) * 2 : 0;
      const sz = q[2] * (0.6 + 0.4 * ease(pop)) * (1 + (motionOK ? Math.sin(time * 6 + j) * 0.07 : 0));
      c.save(); c.translate(hx + q[0], hy + q[1] + bob); c.rotate((1 - j) * 0.25);
      c.font = '900 ' + sz + 'px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = '#3a1800'; c.strokeText('?', 0, 0);
      c.fillStyle = '#ffd23f'; c.fillText('?', 0, 0);
      c.restore();
    });
    if(t2 > 0.2){
      const sw = motionOK ? (time * 0.8) % 1 : 0.3;
      c.fillStyle = 'rgba(120,195,255,' + (1 - sw * 0.6) + ')';
      c.beginPath(); c.ellipse(hx - 11, hy - 2 + sw * 9, 2.2, 3.2, 0, 0, TAU); c.fill();
    }
    if(t2 > 0.9){
      const say = ['뭐지…?', '이게 다 뭐야…?', '…??', '어… 뭐야 이게…?'][Math.floor((t2 - 0.9) / 2.4) % 4];
      const ph = ((t2 - 0.9) % 2.4) / 2.4;
      if(ph < 0.8){
        c.save();
        c.globalAlpha = clamp(ph / 0.08, 0, 1) * clamp((0.8 - ph) / 0.1, 0, 1);
        c.font = '800 11px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        const tw = c.measureText(say).width + 14, bx = hx + 30 + tw / 2, by = hy + 14;
        c.fillStyle = 'rgba(255,255,255,0.96)'; rrect(c, bx - tw / 2, by - 10, tw, 20, 10); c.fill();
        c.strokeStyle = '#7a5bd6'; c.lineWidth = 1.2; c.stroke();
        c.beginPath(); c.moveTo(bx - tw / 2 + 4, by - 4); c.lineTo(bx - tw / 2 - 9, by + 6); c.lineTo(bx - tw / 2 + 2, by + 3); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#4a2fa0'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(say, bx, by + 0.5);
        c.restore();
      }
    }
  }

  const PZC = [];

  // '**대책위원회' 현수막: 금액이 높으면 높이 들고 기뻐하고, 낮으면 땅바닥에 내팽개치고 슬퍼한다
  // (20원이 넘으면 현수막을 든 주민들이 양쪽에서 걸어 들어온다)
  const PZC_TEXT = '**대책위원회';
  function pzCommitteeText(c, txt, cx, cy, ang, maxW, s, col, sy){
    c.save(); c.translate(cx, cy); c.rotate(ang); c.scale(1, sy || 1);
    let fs = 10 * s;
    c.font = '900 ' + fs + 'px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const mw = c.measureText(txt).width;
    if(mw > maxW){ fs *= maxW / mw; c.font = '900 ' + fs + 'px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif'; }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = col;
    c.fillText(txt, 0, 0.5 * s);
    c.restore();
  }
  function pzCommittee(c){
    if(!plaza.fee) return;
    pzCommitteeInit();
    const age = time - plaza.t0, walkIn = plaza.fee > 20;
    PZC.forEach(function(G){
      const joy = pzMood(G.a) > 0;
      const I = joy ? pzJoyI() : pzSadI(), fr = plaza.fee >= 20, s = G.a.s;
      let cx = G.tx, walk = 0;
      if(walkIn){
        const u = clamp((age - 2.0 - G.d) / 1.8, 0, 1);
        if(u <= 0) return;
        const e = 1 - Math.pow(1 - u, 2);
        cx = lerp(G.from < 0 ? -G.gap / 2 - 30 : W + G.gap / 2 + 30, G.tx, e);
        walk = u < 1 && motionOK ? Math.abs(Math.sin(time * 10 + G.d)) * 3 * s : 0;
      }
      G.a.x = cx - G.gap / 2; G.b.x = cx + G.gap / 2;
      c.save(); c.translate(0, -walk);
      if(joy){
        pzPerson(c, G.a); pzPerson(c, G.b);
        const ja = pzJump(G.a, I, fr) * s, jb = pzJump(G.b, I, fr) * s;
        const xa = G.a.x + 10 * s, xb = G.b.x - 10 * s;
        const ya = G.a.y - 80 * s - ja, yb = G.b.y - 80 * s - jb, hgt = 17 * s;
        c.strokeStyle = '#8a5a2b'; c.lineWidth = 2.2 * s; c.lineCap = 'round';
        c.beginPath(); c.moveTo(xa, G.a.y - 32 * s - ja); c.lineTo(xa, ya - 3 * s); c.stroke();
        c.beginPath(); c.moveTo(xb, G.b.y - 32 * s - jb); c.lineTo(xb, yb - 3 * s); c.stroke();
        c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(xa, ya - 4 * s, 1.8 * s, 0, TAU); c.fill(); c.beginPath(); c.arc(xb, yb - 4 * s, 1.8 * s, 0, TAU); c.fill();
        const L = xa - 5 * s, R = xb + 5 * s, N = 10;
        c.beginPath();
        for(let q=0;q<=N;q++){ const t = q / N; c.lineTo(lerp(L, R, t), lerp(ya, yb, t) + Math.sin(time * 7 + t * 5 + G.d) * 1.8 * s); }
        for(let q=N;q>=0;q--){ const t = q / N; c.lineTo(lerp(L, R, t), lerp(ya, yb, t) + hgt + Math.sin(time * 7 + t * 5 + G.d + 0.6) * 1.8 * s); }
        c.closePath();
        c.fillStyle = '#fffdf4'; c.fill(); c.strokeStyle = '#d4202c'; c.lineWidth = 1.5 * s; c.stroke();
        pzCommitteeText(c, PZC_TEXT, (L + R) / 2, (ya + yb) / 2 + hgt / 2, Math.atan2(yb - ya, R - L), R - L - 6 * s, s, '#d4202c');
      }else{
        // 슬픔: 기운 없이 축 늘어진 현수막을 비스듬히 기대 놓고, 그 곁에 주저앉아 운다
        const ua = ease(clamp((age - 0.8 - G.d * 0.5) / 0.7, 0, 1));
        const L = G.a.x + 4 * s, R = G.b.x - 4 * s, hgt = 17 * s;
        const yl = lerp(G.a.y - 80 * s, G.a.y - 40 * s, ua), yr = lerp(G.b.y - 80 * s, G.b.y - 26 * s, ua);   // 한쪽이 더 처진다
        const sag = 6 * s * ua, sway = motionOK ? Math.sin(time * 1.5 + G.d) * 1.2 * s : 0;
        c.strokeStyle = '#8a5a2b'; c.lineWidth = 2.2 * s; c.lineCap = 'round';   // 비스듬히 기운 장대
        c.beginPath(); c.moveTo(L - 3 * s, G.a.y + 1 * s); c.lineTo(L + 2 * s * ua, yl - 3 * s); c.stroke();
        c.beginPath(); c.moveTo(R + 5 * s, G.b.y + 1 * s); c.lineTo(R - 1 * s * ua, yr - 3 * s); c.stroke();
        const N = 10;
        c.beginPath();
        for(let q=0;q<=N;q++){ const t = q / N; c.lineTo(lerp(L, R, t), lerp(yl, yr, t) + Math.sin(t * Math.PI) * sag + sway * t); }
        for(let q=N;q>=0;q--){ const t = q / N; c.lineTo(lerp(L, R, t), lerp(yl, yr, t) + hgt + Math.sin(t * Math.PI) * sag * 1.3 + sway * t); }
        c.closePath();
        c.fillStyle = '#e9e3d2'; c.fill(); c.strokeStyle = '#5b6b8c'; c.lineWidth = 1.4 * s; c.stroke();
        pzCommitteeText(c, PZC_TEXT, (L + R) / 2, (yl + yr) / 2 + hgt / 2 + sag, Math.atan2(yr - yl, R - L), R - L - 6 * s, s, '#3b4a6b');
        pzPerson(c, G.a); pzPerson(c, G.b);
      }
      c.lineCap = 'butt';
      c.restore();
    });
  }

  // 5원 이하: 남성과 할아버지, 여성과 할머니가 경찰과 함께 광장에 들어온다.
  function pzLowFeeConflict(c){
    if(plaza.fee > 5 || !plaza.fee) return;
    const age = time - plaza.ts;
    [
      { x:94, y:533, k:4, action:'hit', delay:0.2, walk:0.8, uniform:'#1b2a6b', hair:'#222', female:false },
      { x:268, y:523, k:9, action:'shout', delay:0.2, walk:0.8, uniform:'#4b79ad', hair:'#382b29', female:true }
    ].forEach(function(group){
      const entry = ease(clamp((age - group.delay) / group.walk, 0, 1));
      if(entry <= 0) return;   // 화면 밖 오른쪽에서 걸어오기 전에는 보이지 않는다
      const gx = lerp(W + 35, group.x, entry);
      const stride = motionOK ? Math.sin(time * 11 + group.k) * 2.5 * (1 - entry) : 0;
      const stopped = ease(clamp((age - 1.1) / 1.2, 0, 1));
      c.save();
      c.translate(gx, group.y + stride);
      c.scale(2.25, 2.25);
      threatPair(c, 0, 0, group.k, stopped, 1.7, group.action);
      miniPerson(c, 32, 0, {
        k:group.k + 12, shirt:group.uniform, skin:group.female ? '#e9b990' : '#f0c39b',
        hair:group.hair, f:group.female,
        la:[-17, -17], ra:[5, -18], face:'stern', hat:'police', badge:true
      });
      if(entry > 0.5){
        c.fillStyle = 'rgba(255,255,255,0.96)';
        rrect(c, 9, -41, 27, 11, 5); c.fill();
        c.strokeStyle = '#1b2a6b'; c.lineWidth = 0.8; c.stroke();
        c.fillStyle = '#1b2a6b'; c.font = '900 6px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('그만!', 22.5, -35);
      }
      c.restore();
    });
  }

  function drawPlaza(c){
    if(!plaza.fee) return;
    const age = time - plaza.t0;
    const rv = clamp(age / 0.85, 0, 1), er = 1 - Math.pow(1 - rv, 3);
    const f = plaza.fee;
    const mood = f >= 15 ? 'joy' : f <= 5 ? 'sad' : 'mix';
    const I = mood === 'joy' ? pzJoyI() : pzSadI();
    c.save();
    const shake = (f >= 20 && motionOK && age > 1.2) ? Math.sin(time * 40) * (1.4 + plaza.P * 2.5) : 0;
    c.translate(shake, 0);
    pzBackground(c);
    pzSky(c, mood, I);
    if(plaza.lv >= 1) pzFireBack(c);
    if(mood === 'mix'){
      const share = (f - 5) / 10;
      const g = c.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, 'rgba(255,190,90,' + (0.08 * share) + ')'); g.addColorStop(1, 'rgba(60,90,150,' + (0.08 * (1 - share)) + ')');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    drawFlagBanner(c, mood, I, age);

    // 주민들 (뒤에서 앞으로). 현수막은 들고 있는 사람의 앞쪽 사람 다음에 그린다
    for(let i=0;i<PZ.length;i++){
      const p = PZ[i];
      if(p.type === 'boss'){
        const toss = pzBossToss();
        if(toss > 0){
          c.save(); c.translate(0, -toss);
          c.translate(p.x, p.y); c.rotate(Math.sin(time * 5.4) * 0.3); c.translate(-p.x, -p.y);
          pzPerson(c, p);
          c.restore();
          c.fillStyle = p.skin;
          [-28, -10, 10, 28].forEach(function(dx, j){ c.beginPath(); c.arc(p.x + dx, p.y - 78 + Math.sin(time * 5 + j) * 3, 4, 0, TAU); c.fill(); });
        }else if(!(plaza.jack && time - plaza.t0 > 4)) pzPerson(c, p);   // 기절하면 맨 앞에 따로 그린다
      }else pzPerson(c, p);
      for(let j=0;j<PZB.length;j++) if(PZB[j].i === i) pzBanner(c, PZB[j]);
    }
    pzCommittee(c);
    pzLowFeeConflict(c);
    if(plaza.jack && time - plaza.t0 > 4) pzPerson(c, PZBOSS);   // 기절한 사장님은 주민들에게 가리지 않게 맨 앞에
    // '**대책위원회' 현수막 곁의 주민들: 금액이 높으면 기뻐하고, 낮으면 슬퍼한다

    if(age > 1.3 && f > 5){
      const slot = Math.floor(time / 1.5);
      for(let j=0;j<5 + plaza.lv;j++){
        const idx = (slot * 7 + j * 23) % PZ.length;
        const p = PZ[idx];
        if(p.type === 'boss' || p.y < 410) continue;
        const joy = pzMood(p) > 0;
        const lines = joy ? (plaza.lv ? [feeTier(f).word + '이다!!!'].concat(PZ_JACK_LINES.slice(1)) : PZ_JOY_LINES) : PZ_SAD_LINES;
        pzBubble(c, p, lines[(slot + j) % lines.length], joy);
      }
      const bp = PZBOSS, bj = pzMood(bp) > 0;
      if(Math.floor(time / 2.4) % 2 === 0){
        const fainted = plaza.jack && time - plaza.t0 > 4.2;
        const bt = bj ? (plaza.jack ? (fainted ? '너무 좋아서… 기절… ♡' : f + '원!!! ' + feeTier(f).word + '이다!!!') : plaza.lv ? f + '원 ' + feeTier(f).word + '이다!!! 고마워요!' : f >= 15 ? '여러분 고맙습니다!' : '휴, 살았다!') : (f <= 5 ? '이게 무슨 일이야!!' : '아이고 아이고…');
        pzBubble(c, bp, bt, bj, fainted ? -96 : pzBossToss() + (bj ? 6 : -6));
      }
    }

    // 바람에 흩날리는 가을 낙엽
    for(let k=0;k<16;k++){
      const sp = 22 + (k % 4) * 8;
      const y = ((motionOK ? time * sp : 0) + k * 67) % (H + 30) - 15;
      const x = ((k * 53.3 + (motionOK ? time * 14 : 0)) % (W + 30)) - 15 + Math.sin(time * 1.3 + k) * 12;
      c.save(); c.translate(x, y); c.rotate(time * 2 + k); c.scale(1, Math.abs(Math.cos(time * 2.5 + k)) * 0.8 + 0.2);
      c.fillStyle = ['#f6b52e', '#ec6a2c', '#ffd23f', '#d9452e'][k % 4];
      c.beginPath(); c.ellipse(0, 0, 4, 2.2, 0, 0, TAU); c.fill();
      c.restore();
    }
    if(mood === 'joy') pzConfetti(c, I);
    else if(mood === 'mix' && f >= 10) pzConfetti(c, 0.1);
    if(plaza.lv >= 1) pzFireFront(c);
    pzPerchBird(c);
    c.restore();
  }

  /* ---- 장면 전환: 추첨하던 황금새가 첫 화면의 오른쪽 위 귀퉁이를 부리로 물고
          왼쪽으로 달아나면서 화면을 종이처럼 벗겨 내면, 그 아래에서 광장 장면이 드러난다 ---- */
  const PEEL_IN = 0.0001, PEEL_BITE = 0.0001, PEEL_PULL = 0.72;   // 예비 동작 없이 문 즉시 잡아채되, 조금 천천히 벗겨 낸다   // 황금새는 결과 상자에서 날아와 바로 귀퉁이를 문다
  const PEEL_T = PEEL_IN + PEEL_BITE + PEEL_PULL;
  const PEEL_BIRD = 0.78;   // 화면을 벗길 때 황금새 크기
  const PEEL_DIR = (function(){ const x = -1, y = 0.5, l = Math.hypot(x, y); return [x / l, y / l]; })();
  let sheetCv = null, sheetCx = null, peelChirp = false;
  function peelActive(){ return plaza.fee && time - plaza.ts < PEEL_T; }
  function captureSheet(){
    if(!sheetCv || sheetCv.width !== cv.width || sheetCv.height !== cv.height){
      sheetCv = document.createElement('canvas'); sheetCv.width = cv.width; sheetCv.height = cv.height; sheetCx = sheetCv.getContext('2d');
    }
    sheetCx.setTransform(1, 0, 0, 1, 0, 0); sheetCx.clearRect(0, 0, sheetCv.width, sheetCv.height); sheetCx.drawImage(cv, 0, 0);
  }
  function halfPlane(c, M, n, sign){
    const tx = -n[1], ty = n[0], B = 3000;
    c.beginPath();
    c.moveTo(M[0] + tx * B, M[1] + ty * B); c.lineTo(M[0] - tx * B, M[1] - ty * B);
    c.lineTo(M[0] - tx * B + n[0] * B * sign, M[1] - ty * B + n[1] * B * sign); c.lineTo(M[0] + tx * B + n[0] * B * sign, M[1] + ty * B + n[1] * B * sign);
    c.closePath();
  }
  function drawPeel(c){
    if(!peelActive() || !sheetCv) return;
    const a = time - plaza.ts;
    const P0 = [W, 0];
    let L = 0, beak, tilt = 0;
    if(a < PEEL_IN){
      // 황금새가 오른쪽 위에서 날아와 귀퉁이에 내려앉는다
      const u = ease(a / PEEL_IN);
      beak = [lerp(W + 90, W - 1, u), lerp(-70, 1, u) + Math.sin(u * Math.PI) * 18];
      tilt = -0.2 * (1 - u);
    }else if(a < PEEL_IN + PEEL_BITE){
      // 귀퉁이를 꽉 문다 (살짝 들어 올림)
      const u = (a - PEEL_IN) / PEEL_BITE;
      L = Math.sin(u * Math.PI) * 10 + u * 6;
      if(!peelChirp){ peelChirp = true; try{ Sound.chirp(1); Sound.tear(PEEL_PULL); }catch(e){} }
    }else{
      // 물고 달아난다: 점점 빨라지며 왼쪽 아래로
      const u = (a - PEEL_IN - PEEL_BITE) / PEEL_PULL;
      if(!peelChirp){ peelChirp = true; try{ Sound.chirp(1); Sound.tear(PEEL_PULL); }catch(e){} }
      L = 1350 * (1 - Math.pow(1 - u, 1.6));   // 처음부터 최고 속도로 확 벗겨 낸다
      tilt = 0.25 + Math.sin(time * 18) * 0.06;
    }
    const B = [P0[0] + PEEL_DIR[0] * L, P0[1] + PEEL_DIR[1] * L];
    if(a >= PEEL_IN) beak = B;
    c.save();
    if(L > 0.5){
      const n = PEEL_DIR, M = [(P0[0] + B[0]) / 2, (P0[1] + B[1]) / 2];
      // 1) 아직 붙어 있는 부분
      c.save(); halfPlane(c, M, n, 1); c.clip(); c.drawImage(sheetCv, 0, 0, W, H);
      // 접힌 자리에 드리우는 그림자
      const sg = c.createLinearGradient(M[0], M[1], M[0] + n[0] * 26, M[1] + n[1] * 26);
      sg.addColorStop(0, 'rgba(0,0,0,0.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = sg; c.fillRect(-10, -10, W + 20, H + 20);
      c.restore();
      // 2) 접혀 넘어간 종이의 뒷면 (접는 선을 기준으로 뒤집어 그린다)
      const md = M[0] * n[0] + M[1] * n[1];
      c.save();
      c.transform(1 - 2 * n[0] * n[0], -2 * n[0] * n[1], -2 * n[0] * n[1], 1 - 2 * n[1] * n[1], 2 * md * n[0], 2 * md * n[1]);
      c.beginPath(); c.rect(0, 0, W, H); c.clip();
      halfPlane(c, M, n, -1); c.clip();
      c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 14;
      c.fillStyle = '#f3efe4'; c.fillRect(0, 0, W, H);
      c.shadowBlur = 0;
      c.globalAlpha = 0.16; c.drawImage(sheetCv, 0, 0, W, H); c.globalAlpha = 1;   // 뒷면에 비치는 앞면
      const fg2 = c.createLinearGradient(M[0], M[1], M[0] - n[0] * 70, M[1] - n[1] * 70);
      fg2.addColorStop(0, 'rgba(255,255,255,0.75)'); fg2.addColorStop(0.35, 'rgba(255,255,255,0)'); fg2.addColorStop(1, 'rgba(120,110,90,0.25)');
      c.fillStyle = fg2; c.fillRect(0, 0, W, H);
      c.restore();
      // 접힌 모서리 선
      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 1.2;
      const tx = -n[1], ty = n[0];
      c.beginPath(); c.moveTo(M[0] + tx * 1000, M[1] + ty * 1000); c.lineTo(M[0] - tx * 1000, M[1] - ty * 1000);
      c.save(); c.beginPath(); c.rect(0, 0, W, H); c.clip();
      c.beginPath(); c.moveTo(M[0] + tx * 1000, M[1] + ty * 1000); c.lineTo(M[0] - tx * 1000, M[1] - ty * 1000); c.stroke();
      c.restore();
    }else{
      c.drawImage(sheetCv, 0, 0, W, H);
    }
    // 3) 귀퉁이를 문 황금새
    if(beak && beak[0] > -160 && beak[1] < H + 160){
      const flap = motionOK ? Math.sin(time * 26) : 0;
      c.save();
      c.translate(beak[0], beak[1]); c.rotate(tilt);
      // 날갯짓 바람 선
      if(a > PEEL_IN + PEEL_BITE){
        c.strokeStyle = 'rgba(255,230,120,0.85)'; c.lineWidth = 2;
        for(let q=0;q<3;q++){ c.beginPath(); c.moveTo(6 + q * 4, 20 + q * 7); c.lineTo(22 + q * 6, 20 + q * 7); c.stroke(); }
      }
      c.translate(0, flap * 1.5);
      c.scale(-PEEL_BIRD, PEEL_BIRD);  // 결과 상자 속 모습처럼 오른쪽을 보며 뒤로 잡아당긴다 (작게)
      c.translate(50.4, 52.8);
      drawMagpie(c, { x:0, y:0 });
      c.restore();
    }
    c.restore();
  }

  function render(){
    // 추첨기가 맹렬하게 돌 때 화면이 덜덜 떨린다
    const sk = motionOK ? Math.max(0, jet - 1.1) * 3.2 : 0;

      drawBall(cx, b, b.x, b.y, RR);
    }
    cx.globalAlpha = 1;

    for(let i=0;i<flyers.length;i++){
      const f = flyers[i];
      const col = PALS[palIdx(f.n)][1];
      const gl = cx.createRadialGradient(f.x, f.y, f.r * 0.6, f.x, f.y, f.r * 2.4);
      gl.addColorStop(0, col + 'aa'); gl.addColorStop(1, col + '00');
      cx.fillStyle = gl; cx.beginPath(); cx.arc(f.x, f.y, f.r * 2.4, 0, TAU); cx.fill();
      drawBall(cx, f, f.x, f.y, f.r);
    }

    drawHero(cx);
    drawButton(cx);
    drawMagpie(cx);
    drawResidents(cx);
    drawBoss(cx);
    drawBubble(cx);
    drawWords(cx);
    drawBanner(cx);
    drawConfetti(cx);
    drawHeroText(cx);
    if(peelActive()) captureSheet();
    drawPlaza(cx);
    drawPeel(cx);
  }

  /* ---- 아파트 주민 행렬: 오른쪽 아래에서 출발해 오른쪽 가장자리를 따라 올라가고, 위쪽에서 왼쪽으로 지나간다 ---- */
  let stripCv = null, stripCx = null, stripW = 0, stripH = 0, stripS = 1;
  let colX = 0, pathY = 0, pathYB = 0, pathXEnd = 0;
  function attachStrip(canvas){
    stripCv = canvas; stripCx = canvas.getContext('2d');
    const card = canvas.parentElement, space = document.getElementById('stripSpace');
    function fit(){
      const r = card.getBoundingClientRect(), sp = space.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      stripW = Math.max(60, r.width); stripH = Math.max(60, r.height); stripS = dpr;
      canvas.width = Math.round(stripW * dpr); canvas.height = Math.round(stripH * dpr);
      colX = r.width - 15;                         // 오른쪽 가장자리 길
      pathYB = r.height - 6;                       // 오른쪽 아래에서 출발
      pathY = sp.bottom - r.top - 5;               // 위쪽 띠의 바닥선
      pathXEnd = sp.left - r.left + 14;            // 위쪽 띠 왼쪽 끝에서 사라진다
    }
    fit();
    if(window.ResizeObserver) new ResizeObserver(fit).observe(card); else window.addEventListener('resize', fit);
  }

  // 행렬 구성: 아이부터 할머니·할아버지까지 아파트의 모든 주민, 여러 표정, 현수막을 든 주민들, 사장님, 꼴뚜기, 당근
  const STRIP = [];
  (function(){
    const seq = [
      'ban', 'yell', 'protest', 'dogs', 'res:angry:adult', 'mgr', 'lift', 'police', 'flag', 'moto', 'pong', 'threat', 'dog', 'yoga', 'yell', 'boss:angry', 'remove', 'fight', 'bigdog', 'sq', 'res:angry:old', 'shop', 'bike', 'car', 'yell',
      'protest', 'court', 'res:worry:adult', 'stroll', 'dogs', 'fight', 'yoga', 'res:sleepy:old', 'yell', 'moto', 'scold', 'lift', 'flag', 'res:joy:adult', 'pong', 'remove', 'boss:joy', 'res:love:kid', 'dog', 'yell', 'judge', 'mgr', 'bike', 'fight', 'res:cry:kid', 'carrot',
      'ban', 'bigdog', 'yell', 'threat', 'protest', 'yoga', 'res:angry:kid', 'shop', 'fight', 'police', 'lift', 'boss:sad', 'moto', 'dogs', 'yell', 'remove', 'pong', 'car', 'res:surprise:adult', 'res:angry:adult', 'stroll', 'scold', 'flag', 'sq',
      'protest', 'fight', 'dog', 'yell', 'mgr', 'bike', 'court', 'res:surprise:old', 'yoga', 'dogs', 'yell', 'boss:surprise', 'moto', 'lift', 'fight', 'res:laugh:kid', 'pong', 'remove', 'res:angry:adult', 'judge', 'bigdog', 'shop', 'yell', 'res:laugh:adult'
    ];
    const W0 = { ban:60, sq:24, carrot:20, res:24, boss:30, flag:28, threat:58, yell:26, fight:44, court:70, scold:44, police:24, judge:24, car:62, mgr:34, moto:52, remove:76, protest:90, dog:40, stroll:42, shop:28, dogs:56, bigdog:52, lift:46, bike:34, pong:84, yoga:38 };
    let pos = 0;

      pos += w + 2;   // 빈틈 없이 촘촘하게

  // 작은 주민: 나이(아이·어른·어르신)와 표정을 다양하게
  function miniResident(c, x, y, r, k, mood, age){
    const wave = Math.sin(time * 6 + k), shake = Math.sin(time * 18 + k);
    const kid = age === 'kid', old = age === 'old';
    const hair = old ? (k % 2 ? '#d9d9d9' : '#bfbfbf') : r.hair;
    c.save();
    c.translate(x, y + (mood === 'sad' || mood === 'cry' ? 1.5 : (mood === 'joy' || mood === 'laugh' || mood === 'love') ? -Math.abs(wave) * 2 : 0));
    if(kid) c.scale(0.78, 0.78);
    c.lineCap = 'round';
    // 팔 자세
    let la, ra;
    if(mood === 'joy' || mood === 'love'){ la = [-9, -18 - wave * 2]; ra = [9, -18 + wave * 2]; }
    else if(mood === 'laugh'){ la = [-5, -5]; ra = [5, -5]; }                         // 배를 잡고 웃는다
    else if(mood === 'surprise'){ la = [-5, -15]; ra = [5, -15]; }                    // 두 손으로 볼을 감싼다
    else if(mood === 'sad' || mood === 'sleepy'){ la = [-7, -2]; ra = [7, -2]; }
    else if(mood === 'cry'){ la = [-3, -17]; ra = [3, -17]; }                         // 손으로 눈을 훔친다
    else if(mood === 'worry'){ la = [-7, -2]; ra = [3, -19]; }                        // 머리를 긁적
    else { la = [-9 + shake, -20 + shake * 1.5]; ra = [9 - shake, -20 - shake * 1.5]; }   // 화: 주먹 부들부들
    c.strokeStyle = r.shirt; c.lineWidth = 3.4;
    c.beginPath(); c.moveTo(-5, -9); c.lineTo(la[0], la[1]); c.stroke();
    c.beginPath(); c.moveTo(5, -9); c.lineTo(ra[0], ra[1]); c.stroke();
    c.fillStyle = r.skin;
    c.beginPath(); c.arc(la[0], la[1], 2, 0, TAU); c.fill(); c.beginPath(); c.arc(ra[0], ra[1], 2, 0, TAU); c.fill();
    c.fillStyle = r.shirt; rrect(c, -7, -12, 14, 12, 3); c.fill();
    if(old){ c.strokeStyle = '#7a5230'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(10, -6); c.lineTo(12, 1); c.stroke(); c.beginPath(); c.arc(8.5, -6.5, 1.6, Math.PI, 0); c.stroke(); }   // 지팡이
    // 머리
    c.save(); c.translate(0, -16 - (kid ? 0.5 : 0)); c.rotate(mood === 'sad' ? 0.2 : mood === 'sleepy' ? -0.25 : mood === 'angry' ? shake * 0.05 : 0);
    const hr = kid ? 6.2 : 5.5;
    if(r.f && !old) longHair(c, hair, hr);   // 여성 긴 머리
    c.fillStyle = r.skin; c.beginPath(); c.arc(0, 0, hr, 0, TAU); c.fill();
    if(mood === 'angry'){ c.fillStyle = 'rgba(225,40,30,0.45)'; c.beginPath(); c.arc(0, 0, hr, 0, TAU); c.fill(); }
    if(mood === 'love' || mood === 'laugh' || mood === 'joy'){ c.fillStyle = 'rgba(255,110,130,0.45)'; c.beginPath(); c.arc(-3.3, 1.6, 1.3, 0, TAU); c.fill(); c.beginPath(); c.arc(3.3, 1.6, 1.3, 0, TAU); c.fill(); }
    c.fillStyle = hair;
    if(old && k % 2 === 0){ c.beginPath(); c.arc(0, -hr - 1.5, 2.4, 0, TAU); c.fill(); }   // 할머니 쪽머리
    c.beginPath(); c.ellipse(0, -2.5, hr + 0.3, 3.4, 0, Math.PI, 0); c.fill();
    if(kid && k % 2){ c.beginPath(); c.arc(-hr, -1, 1.8, 0, TAU); c.fill(); c.beginPath(); c.arc(hr, -1, 1.8, 0, TAU); c.fill(); }   // 양갈래
    c.strokeStyle = '#2a1a10'; c.lineWidth = 1; c.fillStyle = '#2a1a10';
    if(old){ c.strokeStyle = '#333'; c.lineWidth = 0.6; c.beginPath(); c.arc(-2, 0, 1.6, 0, TAU); c.stroke(); c.beginPath(); c.arc(2, 0, 1.6, 0, TAU); c.stroke(); c.strokeStyle = '#2a1a10'; c.lineWidth = 1; }
    if(mood === 'joy' || mood === 'laugh'){
      c.beginPath(); c.arc(-2, 0, 1.2, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(2, 0, 1.2, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.fillStyle = '#7a2020'; c.beginPath(); c.moveTo(-2.4, 2); c.quadraticCurveTo(0, mood === 'laugh' ? 6.5 : 5, 2.4, 2); c.closePath(); c.fill();
      if(mood === 'laugh'){ c.fillStyle = 'rgba(110,185,255,0.9)'; c.beginPath(); c.arc(-3.6, 1, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(3.6, 1, 0.8, 0, TAU); c.fill(); }
    }else if(mood === 'love'){
      [-2.1, 2.1].forEach(function(ex){ c.fillStyle = '#ff3d6e'; c.beginPath(); c.moveTo(ex, 1.1); c.bezierCurveTo(ex - 1.8, -0.2, ex - 1.2, -1.8, ex, -0.8); c.bezierCurveTo(ex + 1.2, -1.8, ex + 1.8, -0.2, ex, 1.1); c.fill(); });
      c.strokeStyle = '#7a2020'; c.beginPath(); c.arc(0, 2.2, 1.6, 0.2, Math.PI - 0.2); c.stroke();
    }else if(mood === 'surprise'){
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(-2, -0.3, 1.5, 0, TAU); c.fill(); c.beginPath(); c.arc(2, -0.3, 1.5, 0, TAU); c.fill();
      c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2, -0.3, 0.7, 0, TAU); c.fill(); c.beginPath(); c.arc(2, -0.3, 0.7, 0, TAU); c.fill();
      c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(0, 3, 1.2, 1.7, 0, 0, TAU); c.fill();
    }else if(mood === 'sad' || mood === 'cry'){
      c.beginPath(); c.moveTo(-3.2, -0.3); c.lineTo(-0.8, 0.5); c.stroke();
      c.beginPath(); c.moveTo(3.2, -0.3); c.lineTo(0.8, 0.5); c.stroke();
      if(mood === 'cry'){ c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(0, 3.4, 1.6, 1.2 + Math.abs(Math.sin(time * 9 + k)) * 0.6, 0, 0, TAU); c.fill(); }
      else { c.beginPath(); c.moveTo(-2, 3.5); c.quadraticCurveTo(0, 2, 2, 3.5); c.stroke(); }
      c.fillStyle = 'rgba(110,185,255,0.95)';
      const n = mood === 'cry' ? 3 : 1;
      for(let j=0;j<n;j++){ const ph = (time * 1.6 + j / n + k * 0.3) % 1; c.beginPath(); c.ellipse(-2.4, 1.5 + ph * 6, 0.8, 1.2, 0, 0, TAU); c.fill(); c.beginPath(); c.ellipse(2.4, 1.5 + ((ph + 0.5) % 1) * 6, 0.8, 1.2, 0, 0, TAU); c.fill(); }
    }else if(mood === 'sleepy'){
      c.beginPath(); c.moveTo(-3, 0); c.lineTo(-1, 0); c.stroke(); c.beginPath(); c.moveTo(1, 0); c.lineTo(3, 0); c.stroke();
      c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(0, 3, 1.1, 1.4 + Math.abs(Math.sin(time * 1.5 + k)), 0, 0, TAU); c.fill();
    }else if(mood === 'worry'){
      c.beginPath(); c.arc(-2, 0, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0, 0.8, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(-3.4, -2.6); c.lineTo(-1, -1.6); c.stroke(); c.beginPath(); c.moveTo(3.4, -2.6); c.lineTo(1, -1.6); c.stroke();
      c.beginPath(); c.moveTo(-2, 3.4); c.quadraticCurveTo(-1, 2.6, 0, 3.4); c.quadraticCurveTo(1, 4.2, 2, 3.4); c.stroke();
      c.fillStyle = 'rgba(140,200,255,0.95)'; c.beginPath(); c.ellipse(hr - 0.5, -2.5, 1, 1.6, 0, 0, TAU); c.fill();   // 식은땀
    }else{
      c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-3.8, -2.2); c.lineTo(-0.8, -1); c.stroke();
      c.beginPath(); c.moveTo(3.8, -2.2); c.lineTo(0.8, -1); c.stroke();
      c.beginPath(); c.arc(-2, 0.4, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0.4, 0.8, 0, TAU); c.fill();
      c.fillStyle = '#ffffff'; c.fillRect(-2, 2.2, 4, 1.8);
      c.strokeStyle = '#5a1515'; c.lineWidth = 0.6; c.strokeRect(-2, 2.2, 4, 1.8);
    }
    c.restore();
    if(mood === 'angry'){
      const ph = (time * 1.4 + k * 0.2) % 1;
      c.fillStyle = 'rgba(235,238,245,' + (0.8 * (1 - ph)) + ')';
      c.beginPath(); c.arc(4, -24 - ph * 8, 1.5 + ph * 2, 0, TAU); c.fill();
    }
    if(mood === 'sleepy'){
      const ph = (time * 0.8 + k * 0.2) % 1;
      c.fillStyle = 'rgba(120,140,220,' + (1 - ph) + ')'; c.font = '800 5px sans-serif'; c.fillText('z', 6 + ph * 4, -22 - ph * 6);
    }
    c.lineCap = 'butt';
    c.restore();
  }

  // 깃발(현수막)을 머리 위로 흔드는 주민
  function flagWaver(c, x, y, k){
    const r = RES[1 + (k * 7) % 19];
    const sw = Math.sin(time * 7 + k);
    const hx = 6 + sw * 2, hy = -26 + Math.abs(sw) * 2;
    // 장대와 깃발
    const tx = hx + 3 + sw * 6, ty = hy - 18;
    c.save(); c.translate(x, y);
    c.strokeStyle = '#8a5a2b'; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx, hy + 4); c.lineTo(tx, ty); c.stroke();
    const fw = 22, fh = 10;
    c.beginPath();
    c.moveTo(tx, ty);
    for(let q=0;q<=fw;q+=4) c.lineTo(tx - q, ty + Math.sin(time * 9 + q * 0.4 + k) * 1.6);
    for(let q=fw;q>=0;q-=4) c.lineTo(tx - q, ty + fh + Math.sin(time * 9 + q * 0.4 + k + 0.5) * 1.6);
    c.closePath();
    c.fillStyle = '#fffdf4'; c.fill(); c.strokeStyle = '#d4202c'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(212,32,44,0.35)'; c.filter = 'blur(1px)';
    c.font = '900 5.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('위원회', tx - fw / 2, ty + fh / 2);
    c.filter = 'none';
    c.restore();
    miniResident(c, x, y, r, k, 'joy', 'adult');
  }
  // 어르신을 구박하는 젊은 주민: 두 팔을 위아래로 휘두르고, 어르신은 몸을 움츠린다.
  function threatPair(c, x, y, k, stopped, menace, action){
    const lunge = Math.max(0, Math.sin(time * 6 + k)) * (menace || 1) * (1 - 0.9 * (stopped || 0));
    const striking = action === 'hit', shouting = action === 'shout';
    const strike = (1 - Math.cos(time * (striking ? 9 : 8) + k)) * 0.5 * (1 - (stopped || 0));
    const otherArm = (1 - Math.cos(time * (striking ? 9 : 8) + k + 1.5)) * 0.5 * (1 - (stopped || 0));
    const S = 1.3;
    const granny = k % 2 === 1;
    const elderCoat = granny ? '#796394' : '#8d8d8d';
    const elderHair = granny ? '#f4eee3' : '#e6e6e6';
    const youngCoat = granny ? '#c64c36' : '#2b2b2b';
    c.save(); c.translate(x, y); c.scale(S, S);
    c.lineCap = 'round';
    // ---- 어르신 (왼쪽): 허리가 굽고, 지팡이, 움츠러들며 덜덜
    c.save(); c.translate(-15 - lunge * 2 - strike * 2.5 + Math.sin(time * 34 + k) * 0.5, 0); c.rotate(-0.16 - lunge * 0.1 - strike * 0.18);
    c.strokeStyle = '#7a5230'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-8, -9); c.lineTo(-10, 1); c.stroke();                     // 지팡이
    c.strokeStyle = elderCoat; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(-4, -9); c.lineTo(-8, -9); c.stroke();
    const shieldY = -23;
    c.beginPath(); c.moveTo(4, -9); c.lineTo(5, shieldY); c.stroke();                    // 손으로 얼굴을 막는다
    c.fillStyle = '#f2cfa8'; c.beginPath(); c.arc(-8, -9, 1.9, 0, TAU); c.fill(); c.beginPath(); c.arc(5, shieldY, 1.9, 0, TAU); c.fill();
    c.fillStyle = elderCoat; rrect(c, -6, -12, 12, 12, 3); c.fill();                     // 어르신 겉옷
    if(granny){ c.beginPath(); c.moveTo(-5, -5); c.lineTo(5, -5); c.lineTo(8, 2); c.lineTo(-8, 2); c.closePath(); c.fill(); }   // 긴 치마
    c.save(); c.translate(-1, -16);
    c.fillStyle = '#f2cfa8'; c.beginPath(); c.arc(0, 0, 5.2, 0, TAU); c.fill();
    c.fillStyle = elderHair; c.beginPath(); c.ellipse(-4.4, -1, 1.6, 2.6, 0.3, 0, TAU); c.fill(); c.beginPath(); c.ellipse(4.4, -1, 1.6, 2.6, -0.3, 0, TAU); c.fill();   // 흰 옆머리
    if(granny){ c.beginPath(); c.arc(0, -6.6, 3.2, 0, TAU); c.fill(); }                 // 할머니 쪽머리
    else { c.fillStyle = '#eeeeeb'; c.beginPath(); c.ellipse(0, 2.4, 3.2, 0.9, 0, 0, TAU); c.fill(); } // 할아버지 흰 콧수염
    c.strokeStyle = '#555'; c.lineWidth = 0.6; c.beginPath(); c.arc(-2, 0, 1.5, 0, TAU); c.stroke(); c.beginPath(); c.arc(2, 0, 1.5, 0, TAU); c.stroke();
    c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2, 0.2, 0.6, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0.2, 0.6, 0, TAU); c.fill();
    c.strokeStyle = '#2a1a10'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-3.4, -2.6); c.lineTo(-1, -1.6); c.stroke(); c.beginPath(); c.moveTo(3.4, -2.6); c.lineTo(1, -1.6); c.stroke();
    c.beginPath(); c.moveTo(-1.6, 3.2); c.quadraticCurveTo(0, 2.2, 1.6, 3.2); c.stroke();
    c.fillStyle = 'rgba(140,200,255,0.95)'; c.beginPath(); c.ellipse(5, -2.5, 1, 1.6, 0, 0, TAU); c.fill(); c.beginPath(); c.ellipse(-5.2, 1, 0.8, 1.3, 0, 0, TAU); c.fill();
    c.restore();
    // 떨림 표시
    c.strokeStyle = 'rgba(65,45,65,0.8)'; c.lineWidth = 0.8;
    [[-9, -22], [9, -22]].forEach(function(q){ c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q[0] + (q[0] < 0 ? -2 : 2), q[1] - 2); c.stroke(); c.beginPath(); c.moveTo(q[0] + (q[0] < 0 ? -1 : 1), q[1] + 2); c.lineTo(q[0] + (q[0] < 0 ? -3 : 3), q[1]); c.stroke(); });
    c.restore();

    // ---- 괴롭히는 주민 (오른쪽): 할아버지 쪽은 남성, 할머니 쪽은 긴 머리의 여성
    c.save(); c.translate(11 - lunge * 3.5, 0); c.rotate(-0.16 - lunge * 0.08);
    if(granny) c.scale(0.92, 1.1);
    c.strokeStyle = youngCoat; c.lineWidth = 3.4;
    const px = lerp(-10, striking ? -22 : -18, strike);
    const py = lerp(-29, striking ? -17 : -18, strike);
    const qx = lerp(10, 6, otherArm);
    const qy = lerp(-29, -16, otherArm);
    c.beginPath(); c.moveTo(-5, -9); c.lineTo(-11, -21); c.lineTo(px, py); c.stroke(); // 첫 팔: 들어 올렸다 어르신 쪽으로 내림
    c.beginPath(); c.moveTo(5, -9); c.lineTo(12, -21); c.lineTo(qx, qy); c.stroke();   // 다른 팔도 위아래로 움직임
    c.fillStyle = '#f0c39b'; c.beginPath(); c.arc(qx, qy, 2.5, 0, TAU); c.fill(); c.beginPath(); c.arc(px, py, striking ? 3.1 : 2.5, 0, TAU); c.fill();
    if(shouting){ c.strokeStyle = '#f0c39b'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(px, py); c.lineTo(px - 4, py - 1); c.stroke(); }
    c.fillStyle = youngCoat; rrect(c, -7, -12, 14, 12, 3); c.fill();
    if(granny){ c.beginPath(); c.moveTo(-6, -5); c.lineTo(6, -5); c.lineTo(9, 2); c.lineTo(-9, 2); c.closePath(); c.fill(); }
    c.fillStyle = granny ? '#f2c45a' : '#ff3b6b'; c.fillRect(-1, -11, 2, 7);
    c.save(); c.translate(0, -16);
    if(granny){ c.fillStyle = '#3b261e'; c.beginPath(); c.ellipse(0, 1, 7.2, 10, 0, 0, TAU); c.fill(); }
    c.fillStyle = '#f0c39b'; c.beginPath(); c.arc(0, 0, 5.4, 0, TAU); c.fill();
    c.fillStyle = 'rgba(225,40,30,0.5)'; c.beginPath(); c.arc(0, 0, 5.4, 0, TAU); c.fill();
    if(granny){
      c.fillStyle = '#3b261e'; c.beginPath(); c.moveTo(-5.8, -2); c.lineTo(-5, -6.8); c.lineTo(-2.5, -5.2);
      c.lineTo(0, -8); c.lineTo(2.3, -5.1); c.lineTo(5, -6.4); c.lineTo(5.8, -2); c.closePath(); c.fill();
      c.beginPath(); c.ellipse(6.2, 3, 2.1, 6, -0.2, 0, TAU); c.fill();
    }else{
      c.fillStyle = '#1e5cff'; c.beginPath(); c.ellipse(0, -3, 5.8, 3.2, 0, Math.PI, 0); c.fill(); c.fillRect(3, -3.4, 4.5, 1.6);   // 거꾸로 쓴 모자
    }
    c.strokeStyle = '#2a1a10'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(-3.8, -2.2); c.lineTo(-0.8, -0.9); c.stroke(); c.beginPath(); c.moveTo(3.8, -2.2); c.lineTo(0.8, -0.9); c.stroke();
    c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2, 0.4, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0.4, 0.8, 0, TAU); c.fill();
    const mo = 1.6 + lunge * 1.6;
    c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(-0.6, 3, 2.2, mo, 0, 0, TAU); c.fill();
    c.restore();
    c.restore();
    if(striking && strike > 0.68){
      star(c, -15, -19, 3.2 + strike * 2.4, '#ffd23f');
      c.fillStyle = '#d92d2d'; c.font = '900 7px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.textAlign = 'center'; c.fillText('퍽!', -17, -30);
    }
    // ---- 고함 (젊은이 → 어르신 쪽으로)
    c.strokeStyle = 'rgba(255,70,50,0.95)'; c.lineWidth = 1.3;
    const rays = shouting ? 3 : 2;
    for(let q=0;q<rays;q++){
      const a = Math.PI + (q - (rays - 1) / 2) * 0.4, ox = 3 - lunge * 3.5, oy = -19;
      c.beginPath(); c.moveTo(ox + Math.cos(a) * 4, oy + Math.sin(a) * 4); c.lineTo(ox + Math.cos(a) * (8 + lunge * 3), oy + Math.sin(a) * (8 + lunge * 3)); c.stroke();
    }
    if(striking){ c.fillStyle = '#ff3b30'; c.font = '900 7px sans-serif'; c.textAlign = 'center'; c.fillText('!', -2 - lunge * 2, -32); }
    c.lineCap = 'butt';
    c.restore();

  // 잭팟: 늘 소리 지르던 여성 주민이 펄쩍펄쩍 뛰며 환호

  // ===== 다툼·법정·경찰 장면들 (행렬용 작은 그림) =====
  function miniPerson(c, x, y, o){

      c.fillStyle = o.hair; c.beginPath(); c.ellipse(0, -2.5, 5.8, 3.4, 0, Math.PI, 0); c.fill();
    }
    c.strokeStyle = '#2a1a10'; c.fillStyle = '#2a1a10'; c.lineWidth = 1.2;
    if(o.face === 'angry' || o.face === 'yell' || o.face === 'stern'){
      c.beginPath(); c.moveTo(-3.8, -2.2); c.lineTo(-0.8, -1); c.stroke(); c.beginPath(); c.moveTo(3.8, -2.2); c.lineTo(0.8, -1); c.stroke();
      c.beginPath(); c.arc(-2, 0.4, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0.4, 0.8, 0, TAU); c.fill();
    }else if(o.face === 'happy'){
      c.beginPath(); c.arc(-2, 0.6, 1.3, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(2, 0.6, 1.3, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.fillStyle = 'rgba(255,110,130,0.55)'; c.beginPath(); c.arc(-3.6, 2, 1.2, 0, TAU); c.fill(); c.beginPath(); c.arc(3.6, 2, 1.2, 0, TAU); c.fill();
    }else if(o.face === 'scared'){

      c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2, -0.2, 0.6, 0, TAU); c.fill(); c.beginPath(); c.arc(2, -0.2, 0.6, 0, TAU); c.fill();
      c.fillStyle = 'rgba(140,200,255,0.95)'; c.beginPath(); c.ellipse(5, -2, 0.9, 1.5, 0, 0, TAU); c.fill();
    }else{
      c.beginPath(); c.moveTo(-3, -0.4); c.lineTo(-0.8, 0.4); c.stroke(); c.beginPath(); c.moveTo(3, -0.4); c.lineTo(0.8, 0.4); c.stroke();
    }
    if(o.face === 'happy'){

    }else if(o.face === 'yell'){

      c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(0, 3, 2.3, mo, 0, 0, TAU); c.fill();
    }else if(o.face === 'angry'){

    }
    c.restore();
    c.lineCap = 'butt';
    c.restore();
  }

  // 사이렌을 울리며 달리는 경찰차 (화가 난 얼굴)
  function policeCar(c, x, y, k, fast){
    const bounce = Math.abs(Math.sin(time * (fast ? 22 : 10) + k)) * (fast ? 2.4 : 1.2);
    c.save(); c.translate(x, y - bounce);
    c.fillStyle = '#ffffff'; rrect(c, -24, -13, 48, 10, 3); c.fill();

    c.fillStyle = '#1b2a6b'; c.fillRect(-24, -9, 48, 3);

    // 사이렌
    const sp = fast ? 16 : 9, blink = Math.floor(time * sp) % 2, strobe = Math.floor(time * sp * 2) % 5 === 0;
    c.save(); c.globalCompositeOperation = 'lighter';
    // 빙글빙글 도는 경광 빛줄기
    [[-2.7, '255,40,40', 0], [2.7, '40,120,255', Math.PI]].forEach(function(L){
      const ang = time * (fast ? 14 : 8) + L[2], R = fast ? 36 : 24;
      c.save(); c.translate(L[0], -22.5); c.scale(1, 0.5);
      const g = c.createRadialGradient(0, 0, 1, 0, 0, R);
      g.addColorStop(0, 'rgba(' + L[1] + ',0.85)'); g.addColorStop(1, 'rgba(' + L[1] + ',0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, ang - 0.35, ang + 0.35); c.closePath(); c.fill();
      c.restore();
    });
    // 번쩍이는 불빛
    [[-2.7, '255,50,50'], [2.7, '50,130,255']].forEach(function(L, j){
      if(j !== blink && !strobe) return;
      const R = fast ? 22 : 14;
      const g = c.createRadialGradient(L[0], -22.5, 0, L[0], -22.5, R);
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.25, 'rgba(' + L[1] + ',0.75)'); g.addColorStop(1, 'rgba(' + L[1] + ',0)');
      c.fillStyle = g; c.beginPath(); c.arc(L[0], -22.5, R, 0, TAU); c.fill();
    });
    c.restore();
    c.fillStyle = blink === 0 ? '#ff2a2a' : '#7a1010'; c.fillRect(-5.5, -24.5, 5, 3.4);
    c.fillStyle = blink === 1 ? '#2a6bff' : '#10307a'; c.fillRect(0.5, -24.5, 5, 3.4);
    if(fast && Math.floor(time * 2.5) % 2 === 0){ c.fillStyle = '#ff2a2a'; c.font = '900 5px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.fillText('삐뽀삐뽀!', 0, -30); }
    // 화난 헤드라이트 눈
    c.fillStyle = '#fff6b0'; c.beginPath(); c.arc(-20, -8.5, 2.4, 0, TAU); c.fill();
    c.strokeStyle = '#2a1a10'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-23, -12); c.lineTo(-18, -10.5); c.stroke();

  // 현수막을 든 주민 두 사람

    for(let xx=w/2; xx>=-w/2; xx-=6) c.lineTo(x + xx, by + h / 2 + Math.sin(time * 5 + xx * 0.15 + k + 0.6) * 1);

    [[x - w / 2 + 6, rA, 'joy'], [x + w / 2 - 6, rB, k % 2 ? 'joy' : 'love']].forEach(function(q, j){
      miniResident(c, q[0], y + (j ? Math.sin(time * 6 + k) : -Math.sin(time * 6 + k)) * 1.2, q[1], k + j * 3, q[2], 'adult');

  // 작은 사장님: joy(만세) · sad(울음) · angry(화남)
  function miniBoss(c, x, y, mood, k){
    const wave = Math.sin(time * 6 + k), shake = Math.sin(time * 18 + k);
    const skin = '#f6c9a0';
    c.save(); c.translate(x, y + (mood === 'joy' ? -Math.abs(wave) * 2 : 0)); c.scale(1.1, 1.1);
    c.lineCap = 'round';
    let la, ra;
    if(mood === 'joy'){ la = [-9, -20 - wave * 2]; ra = [9, -20 + wave * 2]; }
    else if(mood === 'sad'){ la = [-3, -19]; ra = [8, -2]; }
    else { la = [-9 + shake, -19 + shake * 1.5]; ra = [9 - shake, -19 - shake * 1.5]; }
    c.strokeStyle = '#26324f'; c.lineWidth = 3.6;
    c.beginPath(); c.moveTo(-5, -9); c.lineTo(la[0], la[1]); c.stroke();
    c.beginPath(); c.moveTo(5, -9); c.lineTo(ra[0], ra[1]); c.stroke();
    c.fillStyle = skin; c.beginPath(); c.arc(la[0], la[1], 2.2, 0, TAU); c.fill(); c.beginPath(); c.arc(ra[0], ra[1], 2.2, 0, TAU); c.fill();
    c.fillStyle = '#26324f'; rrect(c, -7.5, -12, 15, 12, 3); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(-2.5, -12); c.lineTo(2.5, -12); c.lineTo(0, -6); c.closePath(); c.fill();
    c.fillStyle = '#d4202c'; c.fillRect(-0.9, -11, 1.8, 6);
    c.save(); c.translate(0, -17);
    c.fillStyle = skin; c.beginPath(); c.ellipse(0, 0, 5.4, 6, 0, 0, TAU); c.fill();
    if(mood === 'angry'){ c.fillStyle = 'rgba(225,40,30,0.5)'; c.beginPath(); c.ellipse(0, 0, 5.4, 6, 0, 0, TAU); c.fill(); }
    c.fillStyle = '#5b5f6b'; c.beginPath(); c.ellipse(-4.6, -1.5, 1.6, 2.8, 0.3, 0, TAU); c.fill(); c.beginPath(); c.ellipse(4.6, -1.5, 1.6, 2.8, -0.3, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.ellipse(-1.5, -4.2, 1.8, 0.8, -0.3, 0, TAU); c.fill();
    c.strokeStyle = '#2a1a10'; c.lineWidth = 1;

      c.beginPath(); c.moveTo(3, -0.5); c.lineTo(0.8, 0.2); c.stroke();
      const ph = (time * 1.5 + k * 0.3) % 1;
      c.fillStyle = 'rgba(110,185,255,0.95)'; c.beginPath(); c.ellipse(2.4, 1.2 + ph * 5, 0.8, 1.2, 0, 0, TAU); c.fill();
    }else{
      c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-3.6, -2.4); c.lineTo(-0.8, -1.2); c.stroke();
      c.beginPath(); c.moveTo(3.6, -2.4); c.lineTo(0.8, -1.2); c.stroke();
      c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2, 0.2, 0.8, 0, TAU); c.fill(); c.beginPath(); c.arc(2, 0.2, 0.8, 0, TAU); c.fill();
    }
    c.fillStyle = '#4a4d56'; c.beginPath(); c.ellipse(-1.4, 2.6, 1.6, 0.8, 0.15, 0, TAU); c.fill(); c.beginPath(); c.ellipse(1.4, 2.6, 1.6, 0.8, -0.15, 0, TAU); c.fill();
    c.fillStyle = '#6b1a1a';
    if(mood === 'joy'){ c.beginPath(); c.moveTo(-2.4, 3.6); c.quadraticCurveTo(0, 7, 2.4, 3.6); c.closePath(); c.fill(); }
    else if(mood === 'sad'){ c.beginPath(); c.ellipse(0, 4.4, 1.4, 1.2 + Math.abs(Math.sin(time * 9)) * 0.6, 0, 0, TAU); c.fill(); }
    else { c.strokeStyle = '#6b1a1a'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-2, 4.6); c.quadraticCurveTo(0, 3.4, 2, 4.6); c.stroke(); }
    c.restore();
    if(mood === 'angry'){
      const ph = (time * 1.4 + k * 0.2) % 1;

      c.beginPath(); c.arc(-4, -26 - ph * 8, 1.5 + ph * 2, 0, TAU); c.fill();

  // ===== 새 행렬 캐릭터들 =====

  function managerWalk(c, x, y, k){

    c.beginPath(); c.moveTo(-9, -16); c.lineTo(-13, -8 + step * 2); c.stroke();

    c.fillStyle = '#5f7a3a'; c.beginPath(); c.ellipse(-7, -12, 5, 9.5, 0.1, 0, TAU); c.fill(); c.beginPath(); c.ellipse(7, -12, 5, 9.5, -0.1, 0, TAU); c.fill();

    // 클립보드
    c.fillStyle = '#8a5a2b'; c.fillRect(10, -17, 7, 9); c.fillStyle = '#fff'; c.fillRect(11, -16, 5, 7);
    c.strokeStyle = '#999'; c.lineWidth = 0.5; for(let q=0;q<3;q++){ c.beginPath(); c.moveTo(11.6, -14.5 + q * 2); c.lineTo(15.4, -14.5 + q * 2); c.stroke(); }
    c.fillStyle = '#f0c39b'; c.beginPath(); c.arc(12, -11, 2.2, 0, TAU); c.fill();

    c.fillStyle = '#1e1e1e'; c.beginPath(); c.ellipse(0, -3, 6.8, 3.6, 0, Math.PI, 0); c.fill();
    c.strokeStyle = '#333'; c.lineWidth = 0.7; c.beginPath(); c.arc(-2.4, 0, 1.9, 0, TAU); c.stroke(); c.beginPath(); c.arc(2.4, 0, 1.9, 0, TAU); c.stroke();
    c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-2.4, 0, 0.7, 0, TAU); c.fill(); c.beginPath(); c.arc(2.4, 0, 0.7, 0, TAU); c.fill();
    c.strokeStyle = '#5a1515'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-2, 3.8); c.lineTo(2, 3.8); c.stroke();
    c.restore();
    c.fillStyle = '#1b2a6b'; c.font = '900 3.6px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.fillText('관리소장', 0, -38);

    c.fillStyle = '#bbb'; c.beginPath(); c.arc(-13, -4, 1.6, 0, TAU); c.fill(); c.beginPath(); c.arc(13, -4, 1.6, 0, TAU); c.fill();
    // 차체

    c.fillStyle = '#333'; rrect(c, 0, -12, 12, 4, 2); c.fill();   // 안장

    c.strokeStyle = '#2f3b55'; c.beginPath(); c.moveTo(4, -12); c.lineTo(-3, -9); c.stroke();
    c.fillStyle = r.shirt; rrect(c, -1, -28, 10, 15, 3); c.fill();

    c.fillStyle = 'rgba(80,140,200,0.7)'; c.fillRect(-6.2, -1, 4, 2.6);

  // 게시된 현수막을 떼어내는 주민들: 사다리 위 한 명은 끈을 풀고, 아래 한 명은 잡아당긴다
  function bannerRemoval(c, x, y, k){
    const rA = RES[1 + (k * 5 + 3) % 19], rB = RES[1 + (k * 5 + 9) % 19];
    const tug = Math.sin(time * 5 + k);
    c.save(); c.lineCap = 'round';
    // 두 기둥
    c.strokeStyle = '#7d8590'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x - 30, y); c.lineTo(x - 30, y - 40); c.stroke();
    c.beginPath(); c.moveTo(x + 30, y); c.lineTo(x + 30, y - 40); c.stroke();
    // 현수막: 왼쪽 끝은 아직 묶여 있고, 오른쪽은 떼어져 축 늘어진다
    const drop = 0.55 + tug * 0.12;
    c.save(); c.translate(x - 30, y - 38); c.rotate(drop * 0.6);
    c.beginPath(); c.moveTo(0, 0);
    for(let q=0;q<=56;q+=7) c.lineTo(q, Math.sin(time * 6 + q * 0.2 + k) * 1.4 + q * 0.05);
    for(let q=56;q>=0;q-=7) c.lineTo(q, 11 + Math.sin(time * 6 + q * 0.2 + k + 0.5) * 1.4 + q * 0.08);
    c.closePath();
    c.fillStyle = '#fffdf4'; c.fill(); c.strokeStyle = '#d4202c'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(212,32,44,0.35)'; c.filter = 'blur(1px)';
    c.font = '900 6.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('*** 위원회', 28, 6); c.filter = 'none';
    c.restore();
    c.strokeStyle = '#555'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(x - 30, y - 38); c.lineTo(x - 28, y - 36); c.stroke();
    // 사다리 (오른쪽)
    c.strokeStyle = '#c9a26a'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(x + 18, y); c.lineTo(x + 23, y - 22); c.lineTo(x + 28, y); c.stroke();
    for(let q=1;q<4;q++){ const yy = y - q * 5.5; c.beginPath(); c.moveTo(x + 18 + q * 1.2, yy); c.lineTo(x + 28 - q * 1.2, yy); c.stroke(); }
    // 사다리 위 주민: 위로 손을 뻗어 끈을 푼다
    miniPerson(c, x + 23, y - 20, { k:k, shirt:rA.shirt, skin:rA.skin, hair:rA.hair, f:k % 2 === 0, la:[2, -21 + tug], ra:[8, -20 - tug], face:'stern' });
    // 아래 주민: 현수막 끝을 잡고 뒤로 당긴다
    const hx = x + 4 + tug * 2;
    miniPerson(c, x + 6 + tug * 1.5, y, { k:k + 2, shirt:rB.shirt, skin:rB.skin, hair:rB.hair, f:k % 2 === 1, la:[-8, -12], ra:[-6, -14], face:'angry', lean:0.25 });
    c.strokeStyle = '#d4202c'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx - 4, y - 13); c.lineTo(x + 14, y - 18); c.stroke();
    // 힘쓰는 표시
    c.fillStyle = '#ff3b30'; c.font = '900 6px sans-serif'; c.textAlign = 'center'; c.fillText('영차!', x + 6, y - 30);
    c.lineCap = 'butt';
    c.restore();
  }

  // 단체로 항의하며 지나가는 주민 그룹: 머리띠, 주먹 흔들기, 피켓
  function protestGroup(c, x, y, k){
    const xs = [-34, -18, -2, 14, 30];
    xs.forEach(function(dx, j){
      const r = RES[1 + (k * 3 + j * 4) % 19];
      const pump = Math.sin(time * 7 + j * 1.3 + k);
      const up = [-9, -24 - pump * 3];
      const stepY = Math.abs(Math.sin(time * 6 + j)) * -1.2;
      const isLead = j === 2;
      const la = isLead ? [-6, -20] : up, ra = isLead ? [6, -20] : [8, -4];
      miniPerson(c, x + dx, y + stepY, { k:k + j, shirt:r.shirt, skin:r.skin, hair:r.hair, f:(k + j) % 2 === 0, la:la, ra:ra, face:'yell' });
      // 붉은 머리띠
      c.fillStyle = '#e21d26'; c.fillRect(x + dx - 5.8, y + stepY - 20, 11.6, 2.2);
      c.beginPath(); c.moveTo(x + dx + 5.6, y + stepY - 19.5); c.lineTo(x + dx + 9, y + stepY - 21 + Math.sin(time * 12 + j) * 1.2); c.lineTo(x + dx + 8.4, y + stepY - 17.6); c.closePath(); c.fill();
    });
    // 맨 앞 사람이 든 피켓
    const bob = Math.sin(time * 6 + k) * 1.5;
    c.strokeStyle = '#8a5a2b'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 2, y - 20); c.lineTo(x - 2, y - 30 + bob); c.stroke();
    c.fillStyle = '#ffe14a'; rrect(c, x - 14, y - 42 + bob, 24, 12, 2); c.fill();
    c.strokeStyle = '#d4202c'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#d4202c'; c.font = '900 7px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('반대!', x - 2, y - 36 + bob);

    c.fillStyle = '#d4202c'; rrect(c, -21, by - 3.5, 3, 7, 1); c.fill(); rrect(c, 18, by - 3.5, 3, 7, 1); c.fill();

  // 피트니스: 실내 자전거를 타는 주민

  // 탁구 치는 두 사람: 공이 탁구대 위를 오간다
  function pingPong(c, x, y, k){
    const rA = RES[1 + (k * 5 + 2) % 19], rB = RES[1 + (k * 5 + 13) % 19];
    const T = motionOK ? (time * 1.3 + k) : 0.25;
    const ph = T % 1, toRight = Math.floor(T) % 2 === 0;
    const u = toRight ? ph : 1 - ph;
    // 탁구대
    c.fillStyle = '#1f6f4a'; c.fillRect(x - 20, y - 14, 40, 4);
    c.strokeStyle = '#fff'; c.lineWidth = 0.6; c.strokeRect(x - 20, y - 14, 40, 4); c.beginPath(); c.moveTo(x, y - 14); c.lineTo(x, y - 10); c.stroke();

    // 공: 한 번 바운드
    const bx = lerp(x - 22, x + 22, u);
    const hop = u < 0.5 ? Math.sin(u / 0.5 * Math.PI) * 10 : Math.sin((u - 0.5) / 0.5 * Math.PI) * 9;
    const byy = y - 16 - hop;
    c.fillStyle = '#ff8a1a'; c.beginPath(); c.arc(bx, byy, 1.6, 0, TAU); c.fill();
    // 선수: 공이 오면 라켓을 휘두른다
    const swA = !toRight && ph > 0.8 ? 1 : toRight && ph < 0.15 ? 1 : 0;
    const swB = toRight && ph > 0.8 ? 1 : !toRight && ph < 0.15 ? 1 : 0;
    miniPerson(c, x - 30, y, { k:k, shirt:rA.shirt, skin:rA.skin, hair:rA.hair, f:k % 2 === 0, la:[-7, -6], ra:[8 + swA * 3, -14 - swA * 4], face:'stern', lean:0.08 });
    miniPerson(c, x + 30, y, { k:k + 3, shirt:rB.shirt, skin:rB.skin, hair:rB.hair, f:k % 2 === 1, la:[-8 - swB * 3, -14 - swB * 4], ra:[7, -6], face:'stern', lean:-0.08 });
    c.fillStyle = '#d4202c';
    c.beginPath(); c.ellipse(x - 20 + swA * 3, y - 16 - swA * 4, 2.6, 3.2, 0.4, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(x + 20 - swB * 3, y - 16 - swB * 4, 2.6, 3.2, -0.4, 0, TAU); c.fill();
    if(swA || swB){ c.fillStyle = '#333'; c.font = '800 5px sans-serif'; c.textAlign = 'center'; c.fillText('똑!', swA ? x - 22 : x + 22, y - 28); }
  }
  // 요가: 매트 위에서 자세를 바꿔 가며 (나무 자세 → 전사 자세 → 다운독)
  function yogaPose(c, x, y, k){
    const r = RES[1 + (k * 11 + 7) % 19];
    const pose = motionOK ? Math.floor(time / 2.2 + k) % 3 : 0;
    const br = motionOK ? Math.sin(time * 1.6 + k) * 0.6 : 0;
    c.fillStyle = k % 2 ? '#a66cd8' : '#4fc1a6'; rrect(c, x - 16, y - 1.5, 32, 3, 1.5); c.fill();
    c.save(); c.translate(x, y); c.lineCap = 'round';
    const legs = '#2f3b55', top = r.shirt;
    function head(hx, hy){
      c.fillStyle = r.skin; c.beginPath(); c.arc(hx, hy, 5, 0, TAU); c.fill();
      c.fillStyle = r.hair; c.beginPath(); c.ellipse(hx, hy - 2.2, 5.2, 3, 0, Math.PI, 0); c.fill(); c.beginPath(); c.arc(hx, hy - 6, 2, 0, TAU); c.fill();   // 똥머리
      c.strokeStyle = '#2a1a10'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx - 2.8, hy); c.lineTo(hx - 1, hy); c.stroke(); c.beginPath(); c.moveTo(hx + 1, hy); c.lineTo(hx + 2.8, hy); c.stroke();
      c.beginPath(); c.arc(hx, hy + 2.2, 1.2, 0.2, Math.PI - 0.2); c.stroke();
    }
    if(pose === 0){        // 나무 자세: 한 발로 서서 두 손 모아 위로
      c.strokeStyle = legs; c.lineWidth = 3.2;
      c.beginPath(); c.moveTo(0, -12); c.lineTo(0, 0); c.stroke();
      c.beginPath(); c.moveTo(0, -12); c.lineTo(6, -8); c.lineTo(1, -6); c.stroke();
      c.fillStyle = top; rrect(c, -4.5, -23, 9, 12, 3); c.fill();
      c.strokeStyle = top; c.lineWidth = 3; c.beginPath(); c.moveTo(-3, -21); c.lineTo(-1, -38 + br); c.stroke(); c.beginPath(); c.moveTo(3, -21); c.lineTo(1, -38 + br); c.stroke();
      c.fillStyle = r.skin; c.beginPath(); c.arc(0, -39 + br, 2, 0, TAU); c.fill();
      head(0, -28);
    }else if(pose === 1){  // 전사 자세: 다리를 넓게, 팔을 양옆으로
      c.strokeStyle = legs; c.lineWidth = 3.2;
      c.beginPath(); c.moveTo(0, -12); c.lineTo(-8, -6); c.lineTo(-9, 0); c.stroke();
      c.beginPath(); c.moveTo(0, -12); c.lineTo(12, 0); c.stroke();
      c.fillStyle = top; rrect(c, -4.5, -24, 9, 13, 3); c.fill();
      c.strokeStyle = top; c.lineWidth = 3; c.beginPath(); c.moveTo(-14, -21 + br); c.lineTo(14, -21 - br); c.stroke();
      c.fillStyle = r.skin; c.beginPath(); c.arc(-15, -21 + br, 2, 0, TAU); c.fill(); c.beginPath(); c.arc(15, -21 - br, 2, 0, TAU); c.fill();
      head(-1, -29);
    }else{                 // 다운독: 손발을 바닥에 짚고 엉덩이를 하늘로
      c.strokeStyle = legs; c.lineWidth = 3.4; c.beginPath(); c.moveTo(2, -18 + br); c.lineTo(10, 0); c.stroke();
      c.strokeStyle = top; c.lineWidth = 6; c.beginPath(); c.moveTo(2, -18 + br); c.lineTo(-7, -7); c.stroke();
      c.lineWidth = 3; c.beginPath(); c.moveTo(-6, -8); c.lineTo(-12, 0); c.stroke();
      c.fillStyle = r.skin; c.beginPath(); c.arc(-12, 0, 1.8, 0, TAU); c.fill();
      head(-9, -4);
    }
    c.restore();
    const ph = (time * 0.6 + k) % 1;
    c.fillStyle = 'rgba(120,90,200,' + (1 - ph) + ')'; c.font = '800 5.5px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center';
    c.fillText(pose === 2 ? '후~' : '옴~', x + 12, y - 34 - ph * 6);
  }


  // ===== 순찰 중인 경찰관: 카드 둘레를 시계 방향으로 돌며 두리번거린다 =====
  function patrolCop(c, x, y, dir, k, gait){
    const step = motionOK ? Math.sin(gait != null ? gait * 0.18 : time * 16) * (k ? 1.4 : 1) : 0;   // 걷는 거리에 맞춰 발을 놀린다
    const look = motionOK ? Math.sin(time * 4.4) * 1.1 + Math.sin(time * 9.3) * 0.45 : 0;   // 쉴 새 없이 두리번두리번   // 걸으며 두리번, 멈추면 더 크게 두리번
    const lk = clamp(look, -1, 1);
    c.save(); c.translate(x, y - Math.abs(step) * 0.8); c.scale(dir * 1.1, 1.1); c.lineCap = 'round';
    // 다리
    c.strokeStyle = '#1b2448'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-2.5, -8); c.lineTo(-3 + step * 2.5, 0); c.stroke();
    c.beginPath(); c.moveTo(2.5, -8); c.lineTo(3 - step * 2.5, 0); c.stroke();
    // 팔: 한 손은 손전등, 한 손은 앞뒤로
    c.strokeStyle = '#1b2a6b'; c.lineWidth = 3;

      let ns;
      const forced = Q.match(/[?&]nums=([0-9,]+)/);   // 시험용: ?nums=3,7 처럼 번호 지정
      if(forced) ns = forced[1].split(',').map(Number).filter(function(n){ return n >= 1 && n <= 20; }).slice(0, 3);
      if(forced && ns.length){}
      else if(/[?&]max/.test(Q)) ns = [20, 19, 18];
      else if(/[?&]jackpot/.test(Q)){ do{ ns = drawNums(3); }while(sumOf(ns) < 41 || sumOf(ns) > 56); }
      else{
        const r = Math.random();
        const cnt = /[?&]triple/.test(Q) ? 3 : /[?&]double/.test(Q) ? 2 : r < TRIPLE_CHANCE ? 3 : r < TRIPLE_CHANCE + DOUBLE_CHANCE ? 2 : 1;
        ns = drawNums(cnt);
      }
      const fee = sumOf(ns), tier = feeTier(fee), lv = tier.lv, multi = ns.length > 1, jackpot = lv >= 3;
      const sumText = ns.join('+');
      statusEl.textContent = ns.length === 3 ? '어? 세 마리가 한꺼번에 엉켜서 튀어 나와요!!' : multi ? '어? 두 마리가 엉켜서 함께 튀어 나와요!' : '한 마리가 튀어 나와요!';
      Sound.pick();
      const picks = [];
      for(let i=0;i<ns.length;i++){
        if(i){ await sleep(160); Sound.pick(); }
        picks.push(Machine.pick(ns[i], i, function(){ Sound.land(5 - i); }));
      }
      await Promise.all(picks);
      await Machine.waitIdle();
      air(0.4);
      if(multi){
        // 오류 발생! 삐삐삐
        Sound.glitch();
        if(ns.length === 3) setTimeout(function(){ Sound.glitch(); }, 450);
        Machine.showBanner(ns.length === 3 ? '세 마리 합산!!' : '두 마리 합산!!', 1100);
        statusEl.textContent = '꼴뚜기 ' + ns.length + '마리 합산! ' + ns.map(function(n){ return n + '원'; }).join(' + ') + ' = ' + fee + '원으로 합산!';
        await sleep(1100);
      }

      // 결정!
      Sound.rockHit();
      for(let j=0;j<lv;j++) setTimeout(function(){ Sound.jackpot(); }, j * 650);   // 금액이 클수록 종소리가 여러 번
      Machine.showHero(ns);
      Machine.setParty(true); Sound.setParty(true);
      Machine.burst(lv ? 110 + lv * 30 : 90, lv ? 15 + lv * 22 : 0);
      Sound.cheer(true, false);
      Machine.birdLeave();
      // 결과가 확인되면 바로 오른쪽에서 업체 사장님 등장, 금액에 따라 표정이 달라진다
      setTimeout(function(){ Machine.showBoss(fee); }, 900);
      setTimeout(function(){ Sound.reaction((fee - 1) / 19); }, 1400);
      // 10원 미만: 아무도 안 나옴 / 10원 이상: 금액만큼 위원회 주민이 나와 박수 치고 춤춘다 (20원이면 광란)
      if(fee <= 14){
        // 1원~14원: 위원회 주민들이 나와 땅을 치며 화를 낸다. 1원이 가장 격하고 절망적, 14원으로 갈수록 누그러진다
        const D = (14 - fee) / 13;
        const people = 2 + Math.round(D * 3), banners = 0;   // 1원: 5명 ~ 14원: 2명
        setTimeout(function(){ Machine.showResidents(people, 0, banners, D); Sound.groan(people, D); }, 1700);
      }else{
        const joy = Math.min(1, (fee - 15) / 5);
        // 현수막: 15원 1개, 16원 2개, 17원 3개, 18원 4개, 19원 5개, 20원 6개
        const banners = Math.min(6, fee - 14);
        setTimeout(function(){ Machine.showResidents(fee, joy, banners); Sound.crowdClap(Math.min(fee, 20), 6 + joy * 2); if(joy > 0.6) Sound.cheer(true, true); }, 1700);
      }
      // 잠시 뒤 추첨기 안의 꼴뚜기들이 모두 줄줄이 나와 함께 춤춘다
      setTimeout(function(){
        Machine.releaseAll();
        for(let k=0;k<5;k++) setTimeout(function(){ Sound.pick(); }, k * 260);
      }, 700);
      statusEl.textContent = lv ? '💥 ' + tier.word + '!!! 위탁 수수료 ' + fee + '원' + (multi ? ' (' + sumText + ')' : '') : '🎉 위탁 수수료 ' + fee + '원 결정!';
      feeValue.textContent = multi ? sumText + ' = ' + fee + '원' : fee + '원';
      if(multi || lv) feeLabel.textContent = (multi ? '꼴뚜기 ' + ns.length + '마리 합산' : '결정된 위탁 수수료') + (lv ? ' · ' + tier.word + '!' : '');
      void feeCard.offsetWidth; feeCard.classList.add('pop');

      await sleep(1100);
      // 결과 상자 속 황금새가 날아올라 추첨기 화면 오른쪽 위 귀퉁이를 문다
      await flyBirdToCorner();

      // ---- 장면 전환: 아파트 단지 정문 앞 광장에 주민들이 모두 모인다 ----
      Machine.showPlaza(fee);
      Sound.crowdChant(fee);
      Sound.pick();
      if(fee >= 15){
        const joy = Math.min(1, (fee - 15) / 5);
        for(let j=0;j<lv;j++) setTimeout(function(){ Sound.jackpot(); Sound.cheer(true, true); }, 600 + j * 1800);
        statusEl.textContent = lv >= 3 ? '🎆 ' + fee + '원 ' + tier.word + '! 불꽃놀이와 축포가 쏟아지고, 사장님은 너무 좋아서 기절했어요!' : lv ? '🎆 ' + fee + '원 ' + tier.word + '! 주민들이 사장님을 헹가래 치며 열광해요!' : '🎉 ' + fee + '원! 주민들이 사장님과 함께 춤추고 노래해요';
        setTimeout(function(){ Sound.crowdClap(20, 6 + joy * 4); Sound.cheer(true, true); }, 700);
        const waves = Math.min(3, 1 + Math.round(joy * 2) + Math.min(lv, 1));
        for(let w=1; w<=waves; w++) setTimeout(function(){ Sound.cheer(false, false); }, 700 + w * 2400);
      }else if(fee <= 5){
        const D = 0.6 + (5 - fee) / 4 * 0.4;
        statusEl.textContent = '😭 ' + fee + '원… 주민들이 사장님과 함께 주저앉아 울분을 터뜨려요';
        Machine.setParty(false); Sound.setParty(false); Sound.stopMusic(1.2);
        setTimeout(function(){ Sound.groan(8, D); }, 700);
        setTimeout(function(){ Sound.groan(6, D); }, 3600);
        setTimeout(function(){ Sound.groan(6, D); }, 6800);
      }else{
        const share = (fee - 5) / 10;
        statusEl.textContent = fee + '원! 기뻐하는 주민과 슬퍼하는 주민이 엇갈려요';
        if(share < 0.5){ Machine.setParty(false); Sound.setParty(false); }
        setTimeout(function(){ Sound.crowdClap(Math.round(20 * share) + 2, 3 + share * 4); Sound.groan(Math.round(6 * (1 - share)) + 1, 1 - share); }, 700);
        setTimeout(function(){ if(share >= 0.5) Sound.cheer(true, true); else Sound.groan(4, 1 - share); }, 3600);
      }
      await sleep(9500 + lv * 1000);
      done = true;
      genBtn.textContent = '🎰 다시 추첨';
    } finally {
      Machine.setParty(false); Sound.setParty(false);
      air(0);
      Sound.stopMusic(2.0);
      Machine.birdHide();   // 추첨이 끝나면 버튼 꼴뚜기는 아래로 내려가 사라진다
      running = false; genBtn.disabled = false;
    }
  }

  genBtn.addEventListener('click', runDraw);
})();
</script>

</body></html>
