  function resize(){
    const rect = cv.parentElement.getBoundingClientRect();
    const cssW = Math.max(240, Math.floor(rect.width));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const pw = Math.round(cssW * dpr), ph = Math.round(pw * H / W);
    cv.width = pw; cv.height = ph;
    scale = pw / W;
    bg = document.createElement('canvas'); bg.width = pw; bg.height = ph; paintBg(bg.getContext('2d'), scale);
    fg = document.createElement('canvas'); fg.width = pw; fg.height = ph; paintFg(fg.getContext('2d'), scale);
  }

  /* ---- 물리: 바닥 송풍구에서 올라오는 바람 기둥 + 난류. 기계가 돌지 않는다 ---- */
  function stepPhysics(dt){
    const y0 = CY + RW;
    for(let i=0;i<balls.length;i++){
      const b = balls[i];
      if(b.seek){
        const ddx = HWX - b.x, ddy = HWY - b.y, dd = Math.hypot(ddx, ddy) || 1;
        const spd = Math.min(900, 320 + dd * 8);
        const k = Math.min(1, 20 * dt);
        b.vx += (ddx / dd * spd - b.vx) * k;
        b.vy += (ddy / dd * spd - b.vy) * k;
      }else{
        b.vy += 900 * dt;   // 중력
        if(jet > 0.01){
          const dx = b.x - CX, h = y0 - b.y;
          const w = 24 + h * 0.32;                                  // 위로 갈수록 넓어지는 바람 기둥
          const col = Math.exp(-(dx*dx) / (2*w*w));
          const fall = 1 - clamp(h / (RW * 2), 0, 1) * 0.8;          // 위로 갈수록 약해진다
          b.vy -= jet * 3000 * col * fall * dt;                      // 송풍구 위의 공을 불어 올린다
          b.vx += jet * col * (dx / w) * 520 * fall * dt;            // 퍼지는 바람이 공을 옆으로 밀어낸다
          const lowK = clamp((b.y - (CY + 70)) / 80, 0, 1);
          b.vx -= jet * dx * 2.4 * lowK * dt;                        // 바닥 공기는 송풍구로 빨려 든다
          const tx = Math.sin(b.y * 0.052 + time * 6.3 + b.n * 1.7) + Math.sin(b.x * 0.031 - time * 4.1 + b.n);
          const ty = Math.cos(b.x * 0.047 + time * 5.4 + b.n * 0.9);
          b.vx += jet * tx * 240 * dt; b.vy += jet * ty * 200 * dt;  // 난류
          if(Math.random() < 0.05 * jet){ b.vx += rand(-170, 170); b.vy -= rand(-40, 220) * col; }
          // 바람에 불려 공이 여러 방향으로 굴러 돈다
          b.wx += rand(-1, 1) * jet * 120 * dt;
          b.wy += rand(-1, 1) * jet * 120 * dt;
          b.wz += rand(-1, 1) * jet * 60 * dt;
        }
      }
      const sp = Math.hypot(b.vx, b.vy);
      if(sp > 700){ b.vx *= 700 / sp; b.vy *= 700 / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      const damp = Math.pow(0.72, dt);
      b.vx *= damp; b.vy *= damp;
      const sd = Math.pow(0.5, dt);
      b.wx *= sd; b.wy *= sd; b.wz *= sd;

      const ddx = b.x - CX, ddy = b.y - CY;
      const dist = Math.hypot(ddx, ddy), maxd = RW - b.r;
      if(dist > maxd){
        const nx = ddx / dist, ny = ddy / dist;
        b.x = CX + nx * maxd; b.y = CY + ny * maxd;
        const vn = b.vx * nx + b.vy * ny;
        if(vn > 0){ b.vx -= 1.75 * vn * nx; b.vy -= 1.75 * vn * ny; }
        b.wz += ((ny * b.vx - nx * b.vy) / b.r - b.wz) * 0.3;     // 벽에 닿으면 굴러간다
      }
      const wm = Math.hypot(b.wx, b.wy, b.wz);
      if(wm > 28){ const f = 28 / wm; b.wx *= f; b.wy *= f; b.wz *= f; }
      spin(b, dt);
    }
    for(let i=0;i<balls.length;i++){
      const a = balls[i];
      for(let j=i+1;j<balls.length;j++){
        const b = balls[j];
        if(a.seek || b.seek) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        const d2 = dx*dx + dy*dy;
        if(d2 < rr*rr){
          let d = Math.sqrt(d2); if(d < 0.001) d = 0.001;
          const nx = dx / d, ny = dy / d, ov = rr - d;
          const ma = a.m || 1, mb = b.m || 1, wa = mb / (ma + mb), wb = ma / (ma + mb);
          a.x -= nx * ov * wa; a.y -= ny * ov * wa; b.x += nx * ov * wb; b.y += ny * ov * wb;
          const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if(vn < 0){
            const imp = -(1 + 0.88) * vn / (1 / ma + 1 / mb);
            a.vx -= imp / ma * nx; a.vy -= imp / ma * ny; b.vx += imp / mb * nx; b.vy += imp / mb * ny;
            const tk = Math.min(8, imp * 0.01);   // 부딪히면 공이 뒤집힌다
            a.wx += rand(-tk, tk); a.wy += rand(-tk, tk);
            b.wx += rand(-tk, tk); b.wy += rand(-tk, tk);
          }
        }
      }
    }
  }

  /* ---- 송풍구에서 올라오는 공기 줄기 (보이는 바람) ---- */
  function updateAir(dt){
    if(motionOK && jet > 0.05){
      let n = jet * dt * 110;
      while(n > 0){
        if(n >= 1 || Math.random() < n){
          airs.push({ x:CX + rand(-16, 16), y:NOZY - 4, vx:rand(-30, 30), vy:-rand(420, 650) * jet, life:rand(0.5, 0.9) });
        }
        n -= 1;
      }
    }
    for(let i=airs.length-1;i>=0;i--){
      const a = airs[i];
      a.vx += (Math.sin(a.y * 0.04 + time * 6) * 240 + (a.x - CX) * 1.4) * dt;
      a.vy *= Math.pow(0.5, dt);
      a.x += a.vx * dt; a.y += a.vy * dt;
      a.life -= dt;
      if(a.life <= 0 || Math.hypot(a.x - CX, a.y - CY) > RW - 6) airs.splice(i, 1);
    }
  }
  function drawAir(c){
    if(jet < 0.02 && !airs.length) return;
    c.save();
    c.beginPath(); c.arc(CX, CY, RW, 0, TAU); c.clip();
    const pg = c.createRadialGradient(CX, NOZY, 4, CX, NOZY - 60, 150);
    pg.addColorStop(0, 'rgba(180,215,255,' + (0.22 * jet) + ')'); pg.addColorStop(1, 'rgba(180,215,255,0)');
    c.fillStyle = pg; c.fillRect(CX - 150, CY - RW, 300, RW * 2);
    c.lineCap = 'round'; c.lineWidth = 1.6;
    for(let i=0;i<airs.length;i++){
      const a = airs[i];
      c.strokeStyle = 'rgba(210,235,255,' + (clamp(a.life * 1.6, 0, 1) * 0.3) + ')';
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(a.x - a.vx * 0.035, a.y - a.vy * 0.035); c.stroke();
    }
    c.lineCap = 'butt';
    c.restore();
  }

  function load(excl){
    balls.length = 0; flyers.length = 0;
    for(let n=1;n<=20;n++){
      if(excl && excl.has(n)) continue;
      const b = { n:n, x:CX + rand(-100, 100), y:CY + rand(-70, 90), vx:rand(-60, 60), vy:rand(-60, 60), r:BR };
      randomOrient(b);
      balls.push(b);
    }
  }
  function settle(){
    const keep = jet; jet = 0;
    for(let k=0;k<180;k++) stepPhysics(1/60);
    jet = keep;
  }
  function setJet(v){ jetTarget = v; }

  function pick(n, i, onLand){
    return new Promise(function(resolve){
      const b = balls.find(function(q){ return q.n === n; });
      if(!b){ resolve(); return; }
      b.m = 4;
      b.seek = { i:i, onLand:onLand, resolve:resolve, age:0 };
    });
  }
  function waitIdle(){
    return new Promise(function(res){
      (function chk(){
        if(flyers.length === 0 && !balls.some(function(b){ return b.seek; })) res();
        else setTimeout(chk, 40);
      })();
    });
  }

  function clearRail(){ if(rail.length) railClearing = true; }

  // 꽃가루(색종이)와 만원권 지폐가 함께 떨어진다
  function burst(count, bills){
    if(!motionOK) return;
    for(let k=0;k<count;k++){
      confetti.push({
        x: rand(10, W - 10), y: rand(-50, -6),
        vx: rand(-40, 40), vy: rand(70, 210),
        rot: rand(0, TAU), vr: rand(-6, 6),
        w: rand(5, 9), h: rand(8, 13),
        color: confettiColors[k % confettiColors.length], life: rand(2.2, 3.4)
      });
    }
    const coins = Math.round((bills || 0) * 0.85);   // 지폐 대신 동전이 우수수
    for(let k=0;k<coins;k++){
      const type = Math.floor(Math.random() * coinSprites.length);
      confetti.push({
        coin:true, type:type, x: rand(16, W - 16), y: -20 - k * rand(10, 18),
        vx: rand(-40, 40), vy: rand(60, 160), rot: rand(0, TAU), vr: rand(-3, 3),
        flip: rand(0, TAU), vf: rand(6, 14) * (Math.random() < 0.5 ? -1 : 1),
        bounces: 0, life: 7
      });
    }
  }

  /* ---- 공이 구멍으로 나와 관을 타고 내려와 레일에 놓인다 ---- */
  function checkSeekers(dt){
    for(let i=balls.length-1;i>=0;i--){
      const b = balls[i];
      if(!b.seek) continue;
      b.seek.age += dt;
      const d = Math.hypot(HWX - b.x, HWY - b.y);
      if(d < 24 || b.seek.age > 1.4){
        balls.splice(i, 1);
        const path = makePath([[b.x, b.y]].concat(CHUTE));
        flyers.push(copyOrient(b, { n:b.n, i:b.seek.i, t:0, stage:0, path:path, x:b.x, y:b.y, r:b.r, onLand:b.seek.onLand, rollD:0, landed:false }));
        holeFlash = 1;
        b.seek.resolve();
      }
    }
  }

  const dChute = 0.3, dDrop = 0.06;
  function updateFlyer(f, dt){
    f.t += dt;
    const t = f.t, px = f.x;
    let done = false;
    if(f.stage === 0){
      const u = clamp(t / dChute, 0, 1);
      const p = pathAt(f.path, f.path.L * (0.2 * u + 0.8 * u * u));
      f.x = p[0]; f.y = p[1]; f.r = lerp(BR, 17, u);
      if(u >= 1){ f.stage = 1; f.t = 0; }
    }else if(f.stage === 1){
      const u = clamp(t / dDrop, 0, 1);
      f.x = DROPX; f.y = lerp(374, RAILY, u * u); f.r = lerp(17, 19, u);
      if(u >= 1){ f.stage = 2; f.t = 0; f.rollD = 0.12 + Math.abs(DROPX - SLOTX[f.i]) / 1500; }
    }else{
      const u = clamp(t / f.rollD, 0, 1);
      const e = 1 - Math.pow(1 - u, 2.2);
      f.x = lerp(DROPX, SLOTX[f.i], e); f.y = RAILY; f.r = lerp(19, RR, u);
      if(u >= 1){
        if(!f.landed){ f.landed = true; if(f.onLand) f.onLand(); bird.hop = 1; }
        done = true;
      }
    }
    // 관과 레일을 굴러가며 회전한다
    const vx = (f.x - px) / Math.max(dt, 1e-3);
    f.wz += (vx / f.r - f.wz) * Math.min(1, dt * 14);
    const sd = Math.pow(0.2, dt); f.wx *= sd; f.wy *= sd;
    spin(f, dt);
    return done;
  }

  // 레일에 놓인 공은 굴러가다 멈추며 번호가 앞을 향하도록 자리 잡는다
  function settleRailBall(b, dt){
    if(b.dz < 0){ b.dx = -b.dx; b.dy = -b.dy; b.dz = -b.dz; }
    const k = 1 - Math.pow(0.02, dt);
    b.dx += (0 - b.dx) * k; b.dy += (0 - b.dy) * k; b.dz += (1 - b.dz) * k;
    b.ux += (0.02 - b.ux) * k; b.uy += (-1 - b.uy) * k; b.uz += (0 - b.uz) * k;
    orthonorm(b);
  }

  /* ---- 결정된 꼴뚜기: 레일에서 화면 가운데로 크게 튀어 올라 춤춘다 + 축하 글자 ---- */
  const hero = { n:0, ns:[], t0:0 };
  function heroTotal(){ return hero.ns.reduce(function(a, b){ return a + b; }, 0); }
  let partyOn = false, partyAmt = 0, lastBeat = -1;
  const BEAT = 60 / 152;
  function showHero(ns){ sfxSeen.clear(); hero.ns = ns.slice(); hero.n = ns[0]; hero.t0 = time; rail.length = 0; }
  function hideHero(){ hero.n = 0; hero.ns = []; dancers.length = 0; }

  /* ---- 추첨기 안의 꼴뚜기들이 모두 배출구로 줄줄이 나와 무대에 늘어서서 함께 춤춘다 ---- */
  const dancers = [];
  // 춤출 자리: 위 줄 8마리, 가운데 줄 7마리, 레일 위 4마리 (가운데는 결정된 꼴뚜기, 글자 자리는 비움)
  const SPOTS = [];
  for(let k=0;k<9;k++) SPOTS.push([22 + k * 39.5, 140, 0]);
  [30, 80, 128, 232, 280, 330].forEach(function(x){ SPOTS.push([x, 280, 1]); });
  [40, 96, 264, 320].forEach(function(x){ SPOTS.push([x, RAILY - 6, 2]); });
  function releaseAll(){
    const list = balls.slice();
    balls.length = 0; airs.length = 0;
    list.sort(function(a, b){ return Math.hypot(a.x - HWX, a.y - HWY) - Math.hypot(b.x - HWX, b.y - HWY); });
    list.forEach(function(b, k){
      const sp = SPOTS[k % SPOTS.length];
      dancers.push({ n:b.n, x0:b.x, y0:b.y, tx:sp[0], ty:sp[1], row:sp[2], col:k, t0:time + k * 0.07, ang0:Math.atan2(b.ux, -b.uy) });
    });
  }
  function drawDancers(c){
    const d = partyAmt;
    for(let i=0;i<dancers.length;i++){
      const q = dancers[i];
      const u = clamp((time - q.t0) / 0.85, 0, 1);
      if(time < q.t0){
        // 아직 차례를 기다리는 꼴뚜기는 추첨기 안에 그대로
        drawSprite(c, q.n, q.x0, q.y0, BR / 50, q.ang0, 0);
        continue;
      }
      const e = ease(u), iu = 1 - e;
      // 시작점 → 배출구 → 춤출 자리 (곡선)
      const x = iu * iu * q.x0 + 2 * iu * e * (HPX + 30) + e * e * q.tx;
      const y = iu * iu * q.y0 + 2 * iu * e * (HPY - 40) + e * e * q.ty;
      const ph = (q.row % 2 ? Math.PI : 0) + q.col * 0.35;                 // 줄마다 엇갈리는 물결 춤
      const beat = Math.sin(time * Math.PI / BEAT + ph);
      const bob = u >= 1 ? -Math.abs(beat) * 11 * d : 0;
      const sway = u >= 1 ? beat * 6 * d : 0;
      const ang = u < 1 ? q.ang0 * iu + iu * TAU * 1.5 : beat * 0.34 * d;
      const k = lerp(BR / 50, 0.46, e);
      drawSprite(c, q.n, x + sway, y + bob, k, ang, u >= 1 ? 1 : 0);
    }
  }
  function drawSprite(c, n, x, y, k, ang, dance){
    const frame = Math.floor(time * 8 + n * 0.5) % 2;
    const sq = dance ? Math.abs(Math.sin(time * Math.PI / BEAT + n)) * 0.07 * partyAmt : 0;
    c.save();
    c.translate(x, y); c.rotate(ang); c.scale(1 - sq, 1 + sq);
    c.drawImage(fronts[n][frame], -SQX * k, -SQY * k, SQW * k, SQH * k);
    c.restore();
  }
  function setParty(on){ partyOn = on; }

  const TFONT = '"ParkrioTitle", "Noto Serif KR", "Nanum Myeongjo", serif';
  // 금박 예술 글씨: 글자마다 기울기와 물결, hot 글자는 붉은 금빛
  function fancyText(c, text, x, y, size, alpha, hot, wave){
    const chars = Array.from(text);
    c.save();
    c.translate(x, y);
    c.globalAlpha = alpha;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const sizes = chars.map(function(ch){ return ch === ' ' ? size * 0.35 : (hot && hot.indexOf(ch) >= 0 ? size * 1.12 : size); });
    const widths = chars.map(function(ch, k){ if(ch === ' ') return sizes[k]; c.font = sizes[k] + 'px ' + TFONT; return c.measureText(ch).width + 0.5; });
    const total = widths.reduce(function(a, b){ return a + b; }, 0);
    let px = -total / 2;
    const tilts = [-0.1, 0.07, -0.05, 0.09, -0.07, 0.1, -0.04, 0.08, -0.09, 0.06, 0.12, -0.06];
    chars.forEach(function(ch, k){
      const w = widths[k];
      if(ch !== ' '){
        const isHot = hot && hot.indexOf(ch) >= 0;
        const cx0 = px + w / 2, yy = Math.sin(time * (wave || 4) + k * 0.8) * size * 0.09;
        c.save();
        c.translate(cx0, yy);
        c.rotate(tilts[k % tilts.length] + Math.sin(time * 3 + k) * 0.04);
        c.font = sizes[k] + 'px ' + TFONT;
        c.lineJoin = 'round';
        c.shadowColor = isHot ? 'rgba(255,80,40,0.9)' : 'rgba(255,200,60,0.9)'; c.shadowBlur = size * 0.5;
        c.lineWidth = size * 0.26; c.strokeStyle = '#3a1800'; c.strokeText(ch, 0, 0);
        c.shadowBlur = 0;
        c.lineWidth = size * 0.1; c.strokeStyle = isHot ? '#ffb38a' : '#fff0b0'; c.strokeText(ch, 0, 0);
        const h = sizes[k] / 2;
        const g = c.createLinearGradient(0, -h, 0, h);
        if(isHot){ g.addColorStop(0, '#fff3c8'); g.addColorStop(0.4, '#ffb21f'); g.addColorStop(0.75, '#ff5a1f'); g.addColorStop(1, '#c4200e'); }
        else { g.addColorStop(0, '#fffde6'); g.addColorStop(0.42, '#ffd84a'); g.addColorStop(0.7, '#e09a10'); g.addColorStop(1, '#a8650a'); }
        c.fillStyle = g; c.fillText(ch, 0, 0);
        c.save(); c.beginPath(); c.rect(-w, -h, w * 2, h * 0.75); c.clip();
        c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillText(ch, 0, 0);
        c.restore();
        c.restore();
        const tw = Math.max(0, Math.sin(time * 4.5 + k * 1.7));
        if(tw > 0.7) star(c, cx0 + w * 0.3, yy - h * 0.8, 1.5 + (tw - 0.7) * 10, 'rgba(255,255,255,' + tw + ')');
      }
      px += w;
    });
    c.restore();
  }

  function drawHero(c){
    if(!hero.n) return;
    const age = time - hero.t0;
    const u = clamp(age / 0.75, 0, 1), e = 1 - Math.pow(1 - u, 3);
    const d = partyAmt;
    // 무대를 어둡게 깔고 스포트라이트
    const dim = c.createLinearGradient(0, 0, 0, 440);
    dim.addColorStop(0, 'rgba(60,20,110,' + (0.32 * e) + ')'); dim.addColorStop(0.85, 'rgba(60,20,110,' + (0.22 * e) + ')'); dim.addColorStop(1, 'rgba(60,20,110,0)');   // 밝은 무대는 살짝만 어둡게
    c.fillStyle = dim; c.fillRect(0, 0, W, 440);
    const HX = SLOTX[0], HY = RAILY - 40;   // 레일 위 결정 자리 (크게 서 있도록 조금 위로)
    c.save();
    c.translate(HX, HY); c.rotate(time * 0.6);
    for(let k=0;k<14;k++){
      c.rotate(TAU / 14);
      c.fillStyle = k % 2 ? 'rgba(255,215,90,' + (0.13 * e) + ')' : 'rgba(255,140,200,' + (0.09 * e) + ')';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(-22, -260); c.lineTo(22, -260); c.closePath(); c.fill();
    }
    c.restore();
    const gl = c.createRadialGradient(HX, HY, 10, HX, HY, 80);
    gl.addColorStop(0, 'rgba(255,230,140,' + (0.45 * e) + ')'); gl.addColorStop(1, 'rgba(255,230,140,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(HX, HY, 80, 0, TAU); c.fill();

    // 대박 이상이면 금액에 비례해 무대 위로 불꽃놀이와 축포
    const hlv = feeTier(heroTotal()).lv, stTag = plaza.fee ? '' : 'st';   // 광장으로 바뀌면 무대 쪽 소리는 끈다
    if(hlv >= 1){
      c.save(); c.globalAlpha = e;
      const ha = time - hero.t0;
      if(hlv >= 4){   // 초잭팟: 무대 전체가 금빛으로 번쩍
        c.fillStyle = 'rgba(255,215,80,' + (0.14 + 0.1 * Math.sin(time * 7)) + ')'; c.fillRect(0, 0, W, 440);
      }
      fireworkShow(c, ha, 1 + hlv * 2 + (hlv >= 4 ? 3 : 0), 26, 170, 300, 3, stTag);
      popper(c, 10, 432, 1, 0, ha, stTag); popper(c, W - 10, 432, -1, 1, ha, stTag);
      if(hlv >= 3){ popper(c, 10, 300, 1, 2, ha, stTag); popper(c, W - 10, 300, -1, 3, ha, stTag); }
      c.restore();
    }
    drawDancers(c);

    // 춤추는 꼴뚜기
    const x = HX + Math.sin(time * Math.PI / BEAT) * 9 * d;
    const y = lerp(RAILY, HY, e) - Math.abs(Math.sin(time * Math.PI / BEAT)) * 12 * d;
    const ang = Math.sin(time * Math.PI / BEAT) * 0.32 * d;
    const k = lerp(0.48, 0.88, e) * (1 + Math.sin(time * 14) * 0.04 * d);
    const frame = Math.floor(time * 8) % 2;
    if(hero.ns.length > 1){
      // 오류: 여러 마리가 다리가 엉킨 채로 함께 춤춘다
      const three = hero.ns.length > 2, k2 = k * (three ? 0.68 : 0.8);
      const lay = three ? [[hero.ns[0], -38, 0.36], [hero.ns[2], 0, 0], [hero.ns[1], 38, -0.36]] : [[hero.ns[0], -24, 0.3], [hero.ns[1], 24, -0.3]];
      lay.forEach(function(q, j){
        c.save();
        c.translate(x + q[1], y + (three && j === 1 ? -8 : j ? 4 : 0));
        c.rotate(ang + q[2] + (j ? -1 : 1) * Math.sin(time * 9) * 0.1);
        c.drawImage(fronts[q[0]][(frame + j) % 2], -SQX * k2, -SQY * k2, SQW * k2, SQH * k2);
        c.restore();
      });
      c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2;
      spiralEye(c, x, y + 34 * k2, 8, time * 6);   // 엉킨 다리
    }else{
      c.save();
      c.translate(x, y); c.rotate(ang); c.scale(1 - Math.abs(Math.sin(time * 7)) * 0.08 * d, 1 + Math.abs(Math.sin(time * 7)) * 0.06 * d);
      c.drawImage(fronts[hero.n][frame], -SQX * k, -SQY * k, SQW * k, SQH * k);
      c.restore();
    }

  }
  // 축하 글자는 꽃가루와 지폐 위에 그려서 항상 잘 보이게
  function drawHeroText(c){
    if(!hero.n) return;
    const age = time - hero.t0, d = partyAmt;
    if(age > 0.35){
      const a = clamp((age - 0.35) / 0.3, 0, 1);
      const pop = age < 0.8 ? 0.5 + (age - 0.35) / 0.45 * 0.6 : 1.1 - Math.min(0.1, (age - 0.8) * 0.4);
      const total = heroTotal(), tier = feeTier(total), multi = hero.ns.length > 1;
      // 오류 화면처럼 글자가 지직거린다
      const gx = multi && motionOK && Math.random() < 0.18 ? rand(-4, 4) : 0;
      const title = multi ? (tier.lv ? '꼴뚜기 합산! ' + tier.word + '!!!' : '꼴뚜기 합산!!!') : (tier.lv ? '위탁 수수료 ' + tier.word + '!!!' : '위탁 수수료 결정!!!');
      c.save(); c.translate(CX + gx, 52); c.scale(pop, pop);
      fancyText(c, title, 0, 0, title.length > 11 ? 22 : 24, a, tier.lv ? tier.word + '!' : multi ? '합산!' : '결정!');
      c.restore();
      if(multi){
        c.save(); c.translate(CX, 158);
        fancyText(c, hero.ns.map(function(n){ return n + '원'; }).join(' + '), 0, 0, hero.ns.length > 2 ? 19 : 22, a, '+', 5);
        c.restore();
      }
      c.save(); c.translate(CX, 205); c.scale(1 + Math.sin(time * Math.PI / BEAT) * 0.05 * d, 1 + Math.sin(time * Math.PI / BEAT) * 0.05 * d);
      fancyText(c, total + '원', 0, 0, 54 + tier.lv * 3, a, String(total) + '원', 3);
      c.restore();
    }
  }

  /* ---- 주민들: 사장님이 기뻐할수록 더 많이 나와 박수 치며 함께 기뻐한다 ---- */
  const crowd = { n:0, t0:0 };
  // 주민 20명: 앞줄 7명, 가운데 줄 7명, 뒷줄 6명 (사장님 가까운 쪽부터 채운다)
  const RES = [];
  (function(){
    const shirts = ['#e8574a','#3fa7d6','#7bc950','#f2a541','#a66cd8','#ef6fa8','#4fc1a6','#f7d046','#5b7be0','#ff8c5a','#9ccf3c','#d65db1','#36b5c9','#e0a03a','#8d6be8','#f06a6a','#4cc38a','#c98bdb','#6aa6f8','#ffb84d'];
    const hairs = ['#2b1d14','#5a3a22','#d8d8d8','#1e1e1e','#7a4a1e','#2a1a10','#c9c9c9','#3b2a1a','#a0522d','#111111'];
    const skins = ['#f3c7a1','#f6d2b0','#eec39a','#e9b48a','#f6cfaa','#f1c49c','#f4cba5','#dca27a'];
    // 주민 대표: 맨 앞, 사장님 바로 옆에 크게
    RES.push({ x:238, y:548, s:1.12, rep:true, shirt:'#e23c3c', hair:'#1e1e1e', style:0, skin:'#f0c39b' });
    const rows = [[548, 0.74, 6, 198, 36], [534, 0.67, 7, 240, 36], [521, 0.6, 6, 258, 38]];
    let k = 1;
    rows.forEach(function(rw){
      for(let q=0;q<rw[2];q++){
        RES.push({ x:rw[3] - q * rw[4], y:rw[0], s:rw[1], shirt:shirts[k % shirts.length], hair:hairs[(k * 3) % hairs.length], style:(k * 7) % 5, skin:skins[(k * 5) % skins.length], f:k % 2 === 1 });   // 남녀 섞어서
        k++;
      }
    });
  })();
  function showResidents(n, j, banners, despair){ crowd.n = clamp(n, 0, RES.length); crowd.t0 = time; crowd.j = clamp(j || 0, 0, 1); crowd.banners = banners || 0; crowd.d = despair == null ? -1 : clamp(despair, 0, 1); }
  // 절망하는 주민 (D: 0 = 10원 ~ 1 = 1원). 무릎 꿇고 땅을 치며 운다
  // 여성 긴 머리: 정수리와 양옆으로만 늘어뜨린다 (턱 아래는 비움)
  function longHair(c, col, R){
    c.fillStyle = col;
    c.beginPath(); c.ellipse(0, 0, R * 1.18, R * 1.12, 0, Math.PI, 0); c.fill();
    rrect(c, -R * 1.18, -1, R * 0.5, R * 1.35, R * 0.25); c.fill();
    rrect(c, R * 0.68, -1, R * 0.5, R * 1.35, R * 0.25); c.fill();
  }
  // 당근: 주황색 몸통 + 초록 잎. (x, y) 손에서 ang 방향으로 뻗는다
  function carrot(c, x, y, ang, sz){
    c.save(); c.translate(x, y); c.rotate(ang); c.scale(sz, sz);
    c.fillStyle = '#3fae3a';
    c.beginPath(); c.ellipse(-2, 3, 1.6, 4.5, -0.5, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(0, 4, 1.6, 5, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(2, 3, 1.6, 4.5, 0.5, 0, TAU); c.fill();
    const g = c.createLinearGradient(-3, 0, 3, 0);
    g.addColorStop(0, '#ffa64d'); g.addColorStop(0.6, '#ff7b17'); g.addColorStop(1, '#d9560a');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-3.2, 0); c.quadraticCurveTo(-2.4, -10, 0, -17); c.quadraticCurveTo(2.4, -10, 3.2, 0); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(150,60,0,0.6)'; c.lineWidth = 0.6;
    [-4, -8, -12].forEach(function(yy){ c.beginPath(); c.moveTo(-1.8, yy); c.lineTo(0.6, yy - 0.8); c.stroke(); });
    c.restore();
  }
  // 당근을 든 주민 (몇 명만)
  function hasCarrot(r, i){ return !r.rep && i % 3 === 2; }

  function drawDespairResident(c, r, i, D, u, pop){
    // 사람마다 다른 몸짓: 0 땅 치기(대표) · 1 두 주먹 흔들며 발 구르기 · 2 팔짱 끼고 고개 홱 · 3 머리 쥐어뜯기 · 4 삿대질
    const g = r.rep ? 0 : [1, 3, 4, 2, 0][(i - 1) % 5];
    const rate = (1.4 + D * 2.6) * (0.85 + (i % 3) * 0.15);       // 낮을수록 더 세게, 더 빨리. 사람마다 박자도 다르게
    const pound = Math.abs(Math.sin(time * Math.PI * rate + i * 0.7));
    const kneel = g === 0 ? 1 + D * 3 : 0;
    const stomp = g === 1 ? -Math.abs(Math.sin(time * Math.PI * rate)) * (2 + D * 5) : 0;
    const bodyRot = g === 3 ? Math.sin(time * (3 + D * 3) + i) * (0.08 + D * 0.12)
                  : g === 2 ? -0.08 : g === 4 ? -0.1 - Math.abs(Math.sin(time * 6 + i)) * 0.06 : 0;
    c.save();
    c.translate(r.x + Math.sin(time * 9 + i) * D * 1.2, r.y - 16 + (1 - pop) * 80 + kneel + stomp);   // 몇 명 안 되니 잘 보이게 조금 위로, 조금 크게
    c.rotate(bodyRot);
    c.scale(r.s * 1.02, r.s * 1.02 * (1 - (g === 0 ? D * 0.12 : 0)));
    c.lineCap = 'round';
    // 축 처진 몸
    c.fillStyle = r.shirt;
    c.beginPath(); c.moveTo(-16, 0); c.lineTo(-14, -22); c.quadraticCurveTo(-12, -28, -5, -29); c.lineTo(5, -29); c.quadraticCurveTo(12, -28, 14, -22); c.lineTo(16, 0); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(-16, -6, 32, 6);
    c.fillStyle = 'rgba(0,0,0,0.18)'; rrect(c, -12.5, -19, 25, 13, 3); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.3)'; c.filter = 'blur(1.1px)';
    c.font = '900 6px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(i % 2 ? '$$$' : '***', 0, -15.5);
    c.font = '900 5.6px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    c.fillText('위원회', 0, -9);
    c.filter = 'none';
    if(r.rep){
      c.save(); c.rotate(-0.62);
      c.fillStyle = '#c99212'; c.fillRect(-4, -24, 30, 7);
      c.fillStyle = '#5a2000'; c.font = '900 5.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.fillText('대  표', 11, -20.4);
      c.restore();
    }
    // 팔
    const hy = lerp(-30, 4, pound), hx = 12 + (1 - pound) * 3;
    const shake = Math.sin(time * (14 + D * 8) + i);
    const headY = -40 + (g === 0 ? D * 7 : 0);
    let lx, ly, rx, ry, lFist = false, rFist = false, point = false;
    if(g === 0){ lx = -hx; ly = hy; rx = hx; ry = hy; }                                                 // 땅을 쾅쾅
    else if(g === 1){ lx = -13 + shake * 2; ly = -52 + shake * 4; rx = 13 - shake * 2; ry = -52 - shake * 4; lFist = rFist = true; }   // 두 주먹 불끈
    else if(g === 2){ lx = 9; ly = -17; rx = -9; ry = -19; }                                            // 팔짱
    else if(g === 3){ lx = -11 + shake * 1.2; ly = headY - 4 + shake * 2; rx = 11 - shake * 1.2; ry = headY - 4 - shake * 2; }   // 머리를 쥐어뜯는다
    else { lx = -14; ly = -12; rx = -26 + Math.sin(time * 12 + i) * 3; ry = -40 + Math.sin(time * 12 + i) * 2; point = true; lFist = true; }   // 허리에 손, 삿대질
    c.strokeStyle = r.shirt; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-11, -24); c.lineTo(lx, ly); c.stroke();
    c.beginPath(); c.moveTo(11, -24); c.lineTo(rx, ry); c.stroke();
    c.fillStyle = r.skin;
    c.beginPath(); c.arc(lx, ly, lFist ? 4.5 : 3.8, 0, TAU); c.fill(); c.beginPath(); c.arc(rx, ry, rFist ? 4.5 : 3.8, 0, TAU); c.fill();
    if(hasCarrot(r, i)) carrot(c, rx, ry, 0.5 + Math.sin(time * (10 + D * 8) + i) * 0.5, 1.45);   // 당근을 휘두르며 항의
    if(point){ c.strokeStyle = r.skin; c.lineWidth = 2.2; c.beginPath(); c.moveTo(rx, ry); c.lineTo(rx - 6, ry - 3); c.stroke(); }
    if(g === 1 && D > 0.3){                                       // 부들부들 떨림 표시
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1;
      [[-20, -54], [20, -54]].forEach(function(q){ c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q[0] + (q[0] < 0 ? -3 : 3), q[1] - 3); c.stroke(); });
    }
    if(g === 0 && pound > 0.93){                                  // 쿵! 흙먼지
      c.fillStyle = 'rgba(190,175,150,0.7)';
      [-1, 1].forEach(function(sd){
        for(let k=0;k<3;k++){ c.beginPath(); c.arc(sd * hx + (k - 1) * 4 * sd, 5 - k * 1.5, 2.2 + D * 1.5, 0, TAU); c.fill(); }
      });
    }
    // 머리: 땅 치는 사람은 고개를 숙이고, 팔짱 낀 사람은 홱 고개를 돌리고, 나머지는 씩씩댄다
    const headRot = g === 2 ? 0.25 + Math.sin(time * 5 + i) * 0.12 * (0.5 + D)
                  : g === 3 ? Math.sin(time * 7 + i) * (0.15 + D * 0.15)
                  : Math.sin(time * 3 + i) * 0.08 + Math.sin(time * 14 + i) * 0.03 * D;
    c.save(); c.translate(0, headY); c.rotate(headRot);
    if(r.style === 1){ c.fillStyle = r.hair; c.beginPath(); c.ellipse(10, 3, 4, 8, 0.2, 0, TAU); c.fill(); }
    if(r.style === 2){ c.fillStyle = r.hair; c.beginPath(); c.arc(0, -11, 5, 0, TAU); c.fill(); }
    if(r.f) longHair(c, r.style === 2 ? r.hair : '#3a2416', 10);   // 여성: 긴 머리
    c.fillStyle = r.skin; c.beginPath(); c.arc(0, 0, 10, 0, TAU); c.fill();
    c.fillStyle = 'rgba(225,40,30,' + (0.1 + D * 0.38) + ')'; c.beginPath(); c.arc(0, 1, 10, 0, TAU); c.fill();                    // 화가 나 붉어진 얼굴
    if(D > 0.8){ c.fillStyle = 'rgba(80,100,190,0.45)'; c.beginPath(); c.ellipse(0, -4, 9, 5, 0, Math.PI, 0); c.fill(); }      // 1원: 절망으로 창백해진 이마
    c.fillStyle = r.hair;
    if(r.style === 3){ c.fillStyle = '#2f5fd0'; c.beginPath(); c.ellipse(0, -6, 11, 6, 0, Math.PI, 0); c.fill(); c.fillRect(-13, -7, 15, 3); }
    else if(r.style === 4){ for(let k=0;k<6;k++){ c.beginPath(); c.arc(-8 + k * 3.2, -7 - (k % 2) * 2, 3.4, 0, TAU); c.fill(); } }
    else { c.beginPath(); c.ellipse(0, -5, 10.5, 6, 0, Math.PI, 0); c.fill(); }
    if(D > 0.8){ c.strokeStyle = 'rgba(60,80,170,0.6)'; c.lineWidth = 1; for(let k=0;k<3;k++){ c.beginPath(); c.moveTo(-5 + k * 5, -9); c.lineTo(-5 + k * 5, -4); c.stroke(); } }
    // 화난 V자 눈썹 (분노가 클수록 더 가파르게)
    const bv = 1 + D * 2.6;
    c.strokeStyle = '#2a1a10'; c.lineWidth = 1.9;
    c.beginPath(); c.moveTo(-7.5, -4.5 - bv * 0.4); c.lineTo(-1.8, -3.2 + bv * 0.5); c.stroke();
    c.beginPath(); c.moveTo(7.5, -4.5 - bv * 0.4); c.lineTo(1.8, -3.2 + bv * 0.5); c.stroke();
    // 눈: 째려보는 눈 → 1원 근처는 질끈 감고 운다
    c.lineWidth = 1.6;
    if(D > 0.7){
      c.beginPath(); c.moveTo(-6.5, -0.5); c.lineTo(-1.8, 0.8); c.stroke();
      c.beginPath(); c.moveTo(6.5, -0.5); c.lineTo(1.8, 0.8); c.stroke();
    }else{
      c.fillStyle = '#2a1a10';
      c.beginPath(); c.ellipse(-4, 0.3, 1.8, 1.1, 0.2, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(4, 0.3, 1.8, 1.1, -0.2, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(110,185,255,0.9)';
    if(D > 0.6) [-4, 4].forEach(function(ex, k){
      const n = 1 + Math.round((D - 0.6) * 5);
      for(let j=0;j<n;j++){
        const ph = (time * (1.2 + D) + j / n + k * 0.3 + i * 0.11) % 1;
        c.beginPath(); c.ellipse(ex + (k ? 1 : -1) * ph * 2, 2 + ph * (10 + D * 8), 1.2 + D * 0.5, 1.8 + D * 0.6, 0, 0, TAU); c.fill();
      }
    });
    // 입: 14원 근처는 뾰로통 → 이를 악물고 → 1원 근처는 고함치며 엉엉
    if(D > 0.7){
      const w = 2.5 + D * 2.5 + Math.abs(Math.sin(time * 10 + i)) * 1.5;
      c.fillStyle = '#5a1515'; c.beginPath(); c.ellipse(0, 6, 3.4 + D, w * 0.6, 0, 0, TAU); c.fill();
    }else if(D > 0.3){
      c.fillStyle = '#ffffff'; c.fillRect(-4.5, 4.5, 9, 4);
      c.strokeStyle = '#5a1515'; c.lineWidth = 1; c.strokeRect(-4.5, 4.5, 9, 4);
      c.beginPath(); c.moveTo(-4.5, 6.5); c.lineTo(4.5, 6.5); c.moveTo(-1.5, 4.5); c.lineTo(-1.5, 8.5); c.moveTo(1.5, 4.5); c.lineTo(1.5, 8.5); c.stroke();
    }else{
      c.strokeStyle = '#5a1515'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(-3.5, 7); c.quadraticCurveTo(0, 3.5, 3.5, 7); c.stroke();
    }
    if(r.rep){
      c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.2;
      c.beginPath(); c.arc(-4, -0.5, 3.4, 0, TAU); c.stroke(); c.beginPath(); c.arc(4, -0.5, 3.4, 0, TAU); c.stroke();
    }
    if(D > 0.25){   // 머리끝까지 화가 나서 김이 폴폴
      for(let k=0;k<2;k++){
        const ph = (time * (0.9 + D) + k / 2 + i * 0.2) % 1;
        c.fillStyle = 'rgba(235,238,245,' + (0.7 * (1 - ph) * D) + ')';
        c.beginPath(); c.arc((k ? 6 : -6) + Math.sin(time * 4 + k) * 2, -12 - ph * 16, 2.5 + ph * 3.5, 0, TAU); c.fill();
      }
    }
    c.restore();
    c.lineCap = 'butt';
    c.restore();
  }

  // 아주 낮으면 머리 위로 먹구름과 비
  function drawGloom(c, D){
    if(D < 0.75) return;
    const a = clamp((D - 0.75) / 0.25, 0, 1) * clamp((time - crowd.t0 - 0.8) / 0.8, 0, 1);
    if(a <= 0) return;
    c.save(); c.globalAlpha = a;
    [[70, 446], [150, 440], [225, 448]].forEach(function(p, k){
      const x = p[0] + Math.sin(time * 0.8 + k) * 6;
      c.fillStyle = '#4a5068';
      [[-16, 2, 11], [0, -4, 14], [16, 2, 11], [6, 6, 10], [-8, 6, 10]].forEach(function(q){ c.beginPath(); c.arc(x + q[0], p[1] + q[1], q[2], 0, TAU); c.fill(); });
      c.strokeStyle = 'rgba(140,190,255,0.75)'; c.lineWidth = 1.4;
      for(let j=0;j<6;j++){
        const ph = (time * 1.8 + j / 6 + k * 0.3) % 1, rx = x - 20 + j * 8;
        c.beginPath(); c.moveTo(rx, p[1] + 12 + ph * 55); c.lineTo(rx - 2, p[1] + 18 + ph * 55); c.stroke();
      }
    });
    c.restore();
  }


  // 현수막: 주민들이 장대에 걸어 머리 위로 높이 든다 (16원 1개 → 17원 2개 → 19원 3개 → 20원 4개)
  const BANNER_SPOTS = [[128, 452], [50, 434], [206, 434], [300, 428], [88, 414], [258, 412]];
  function drawBanners(c){
    const J = crowd.j || 0, BP = Math.PI / BEAT;
    for(let b=0;b<(crowd.banners || 0);b++){
      const age = time - crowd.t0 - 0.6 - b * 0.35;
      if(age <= 0) continue;
      const u = clamp(age / 0.6, 0, 1), e = 1 - Math.pow(1 - u, 3);
      const sp = BANNER_SPOTS[b];
      const w = 70, h = 14;
      let x = sp[0], y = sp[1] + (1 - e) * 90 - (u >= 1 ? Math.abs(Math.sin(time * BP + b)) * (3 + J * 4) : 0);
      let tilt = u >= 1 ? Math.sin(time * BP * 0.5 + b * 1.3) * 0.05 : 0;
      if(crowd.d >= 0){
        // 절망: 잠깐 들었다가 땅바닥에 내동댕이친다
        const f = clamp((age - 0.7) / (0.45 - crowd.d * 0.15), 0, 1), ff = f * f;
        const side = b % 2 ? 1 : -1;
        y = lerp(y, 524 + (b % 2) * 6, ff) - (f >= 1 ? Math.max(0, Math.sin((age - 1.15) * 14)) * Math.exp(-(age - 1.15) * 6) * 6 : 0);
        x = x + side * 14 * ff;
        tilt = lerp(tilt, side * (0.1 + b * 0.04), ff);
        crowd['flat' + b] = ff;                       // 바닥에 납작하게 눕는다
        if(f >= 1 && !crowd['thud' + b]){ crowd['thud' + b] = 1; Sound.thud(); }
      }
      c.save();
      c.translate(x, y); c.rotate(tilt);
      if(crowd.d >= 0){ const fl = crowd['flat' + b] || 0; c.scale(1, lerp(1, 0.38, fl)); if(fl > 0.9) c.globalAlpha = 0.85; }
      // 장대 두 개
      c.strokeStyle = '#8a5a2b'; c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-w / 2 + 3, -h / 2 - 3); c.lineTo(-w / 2 + 3, h / 2 + 36); c.stroke();
      c.beginPath(); c.moveTo(w / 2 - 3, -h / 2 - 3); c.lineTo(w / 2 - 3, h / 2 + 36); c.stroke();
      c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(-w / 2 + 3, -h / 2 - 4, 2.4, 0, TAU); c.fill(); c.beginPath(); c.arc(w / 2 - 3, -h / 2 - 4, 2.4, 0, TAU); c.fill();
      // 바람에 살랑이는 천
      const wv = function(xx, k){ return Math.sin(time * 5 + xx * 0.08 + b + k) * 1.6; };
      c.beginPath();
      c.moveTo(-w / 2, -h / 2 + wv(-w / 2, 0));
      for(let xx=-w/2; xx<=w/2; xx+=8) c.lineTo(xx, -h / 2 + wv(xx, 0));
      for(let xx=w/2; xx>=-w/2; xx-=8) c.lineTo(xx, h / 2 + wv(xx, 0.6));
      c.closePath();
      c.fillStyle = '#fffdf4'; c.fill();
      c.strokeStyle = '#d4202c'; c.lineWidth = 1.8; c.stroke();
      c.fillStyle = '#d4202c';
      c.font = '900 8px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.globalAlpha *= 0.35; c.filter = 'blur(1.3px)';   // 글씨는 흐릿하게
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('*** 위원회', 0, 1 + wv(0, 0.3));
      c.filter = 'none';
      c.lineCap = 'butt';
      c.restore();
    }
  }
  function hideResidents(){ crowd.n = 0; for(let b=0;b<6;b++) crowd['thud' + b] = 0; }
  // 위원회 주민들: 금액이 높을수록 더 격하게 (j: 0 ~ 1). 박수 → 춤 → 20원이면 광란
  function drawResidents(c){
    if(crowd.n && crowd.d >= 0){
      // 절망하는 주민들: 앞줄이 뒤에 가리지 않도록 뒷줄부터
      for(let i=crowd.n-1;i>=0;i--){
        const age = time - crowd.t0 - i * 0.1;
        if(age <= 0) continue;
        const u = clamp(age / 0.45, 0, 1);
        drawDespairResident(c, RES[i], i, crowd.d, u, 1 - Math.pow(1 - u, 3));
      }
      drawBanners(c);
      drawGloom(c, crowd.d);
      return;
    }
    if(crowd.n) drawBanners(c);
    const J = crowd.j || 0;
    const BP = Math.PI / BEAT;
    for(let i=crowd.n-1;i>=0;i--){
      const r = RES[i];
      const age = time - crowd.t0 - i * 0.1;
      if(age <= 0) continue;
      const u = clamp(age / 0.45, 0, 1);
      const pop = 1 - Math.pow(1 - u, 3);
      const ph = i * 0.9;
      const beat = Math.sin(time * BP + ph);
      // 박수와 춤이 번갈아: 기쁠수록 춤추는 시간이 길어진다
      const cyc = (time / (BEAT * 4) + i * 0.13) % 1;
      const dancing = u >= 1 && cyc < 0.25 + J * 0.6;
      const hop = u >= 1 ? -Math.abs(beat) * (4 + J * 20) : 0;
      const sway = u >= 1 ? beat * (2 + J * 9) : 0;
      let rot = u >= 1 ? Math.sin(time * BP * 0.5 + ph) * (0.05 + J * 0.3) : 0;
      let flipX = 1;
      if(J > 0.75 && u >= 1){                                    // 광란: 빙글빙글 돌고 미친 듯이 뛴다
        const spin = (time * (1.2 + (i % 3) * 0.4) + i * 0.37) % 3;
        if(spin < 0.5) flipX = Math.cos(spin / 0.5 * TAU);
        rot += Math.sin(time * 9 + i) * 0.12 * (J - 0.75) * 4;
      }
      c.save();
      c.translate(r.x + sway, r.y + (1 - pop) * 80 + hop);
      c.rotate(rot);
      c.scale(r.s * flipX, r.s);
      c.lineCap = 'round';
      // 몸 (위원회 단체복)
      c.fillStyle = r.shirt;
      c.beginPath(); c.moveTo(-15, 0); c.lineTo(-13, -26); c.quadraticCurveTo(-11, -32, -5, -33); c.lineTo(5, -33); c.quadraticCurveTo(11, -32, 13, -26); c.lineTo(15, 0); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(-13, -26, 4, 22);
      c.fillStyle = 'rgba(0,0,0,0.18)'; rrect(c, -12.5, -22, 25, 14, 3); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.3)'; c.filter = 'blur(1.1px)';   // 옷의 글씨도 흐릿하게
      c.font = '900 6px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(i % 2 ? '$$$' : '***', 0, -18.3);
      c.font = '900 5.6px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.fillText('위원회', 0, -11.6);
      c.filter = 'none';
      if(r.rep){
        // 대표 어깨띠
        c.save(); c.rotate(-0.62);
        const sg = c.createLinearGradient(0, -4, 0, 4);
        sg.addColorStop(0, '#ffe680'); sg.addColorStop(1, '#d99a12');
        c.fillStyle = sg; c.fillRect(-4, -27, 30, 7);
        c.fillStyle = '#7a2a00'; c.font = '900 5.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        c.fillText('대  표', 11, -23.4);
        c.restore();
      }
      // 팔: 박수(짝짝) 또는 춤(두 팔 번쩍, 흔들기)
      let lx, ly, rx, ry, clapHit = false;
      if(dancing){
        const w = Math.sin(time * BP * 2 + ph);
        lx = -14 - w * 4; ly = -46 - Math.abs(w) * 6 * (0.5 + J);
        rx = 14 - w * 4;  ry = -46 - Math.abs(Math.cos(time * BP * 2 + ph)) * 6 * (0.5 + J);
        if(J > 0.5 && i % 3 === 0){ rx = 16 + w * 6; ry = -38 + w * 8; }   // 한 팔은 휘휘 돌린다
      }else{
        const clap = Math.abs(Math.sin(time * BP * (2 + J * 2) + ph));
        const hx = 3 + (1 - clap) * 9, hy = -30 - clap * 6 - J * 8;
        lx = -hx; ly = hy; rx = hx; ry = hy; clapHit = clap > 0.9;
      }
      c.strokeStyle = r.shirt; c.lineWidth = 6;
      c.beginPath(); c.moveTo(-11, -28); c.lineTo(lx, ly); c.stroke();
      c.beginPath(); c.moveTo(11, -28); c.lineTo(rx, ry); c.stroke();
      c.fillStyle = r.skin;
      c.beginPath(); c.arc(lx, ly, 3.6, 0, TAU); c.fill(); c.beginPath(); c.arc(rx, ry, 3.6, 0, TAU); c.fill();
      if(hasCarrot(r, i)) carrot(c, rx, ry, 0.35 + Math.sin(time * BP * 2 + i) * 0.35, 1.45);   // 당근을 흔들며 신난다
      if(clapHit){
        c.strokeStyle = 'rgba(255,240,170,0.9)'; c.lineWidth = 1.5;
        [[-6, -6], [0, -8], [6, -6]].forEach(function(d){ c.beginPath(); c.moveTo(d[0] * 0.6, ly + d[1] * 0.6); c.lineTo(d[0] * 1.3, ly + d[1] * 1.3); c.stroke(); });
      }
      // 머리
      c.save(); c.translate(0, -44); c.rotate(Math.sin(time * (4 + J * 8) + i) * (0.1 + J * 0.25));
      if(r.style === 1){ c.fillStyle = r.hair; c.beginPath(); c.ellipse(10, 2, 4, 8, 0.4 + Math.sin(time * 10 + i) * J * 0.6, 0, TAU); c.fill(); }
      if(r.style === 2){ c.fillStyle = r.hair; c.beginPath(); c.arc(0, -11, 5, 0, TAU); c.fill(); }
      if(r.f) longHair(c, r.style === 2 ? r.hair : '#3a2416', 10);   // 여성: 어깨까지 오는 긴 머리
      c.fillStyle = r.skin; c.beginPath(); c.arc(0, 0, 10, 0, TAU); c.fill();
      if(r.f){ c.fillStyle = '#e0406a'; c.beginPath(); c.arc(0, 6.2, 1.4, 0, TAU); c.fill(); }
      c.fillStyle = r.hair;
      if(r.style === 3){ c.fillStyle = '#2f5fd0'; c.beginPath(); c.ellipse(0, -6, 11, 6, 0, Math.PI, 0); c.fill(); c.fillRect(-13, -7, 15, 3); }
      else if(r.style === 4){ for(let k=0;k<6;k++){ c.beginPath(); c.arc(-8 + k * 3.2, -7 - (k % 2) * 2, 3.4, 0, TAU); c.fill(); } }
      else { c.beginPath(); c.ellipse(0, -5, 10.5, 6, 0, Math.PI, 0); c.fill(); }
      c.strokeStyle = '#2a1a10'; c.lineWidth = 1.6;
      c.beginPath(); c.arc(-3.8, 0, 2.2, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(3.8, 0, 2.2, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      if(r.rep){   // 대표는 안경
        c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.2;
        c.beginPath(); c.arc(-4, -0.5, 3.4, 0, TAU); c.stroke(); c.beginPath(); c.arc(4, -0.5, 3.4, 0, TAU); c.stroke();
        c.beginPath(); c.moveTo(-0.6, -0.8); c.lineTo(0.6, -0.8); c.stroke();
      }
      const mo = 6 + J * 6 + (J > 0.6 ? Math.abs(Math.sin(time * 14 + i)) * 3 : 0);   // 기쁠수록 입이 크게
      c.fillStyle = '#7a2020'; c.beginPath(); c.moveTo(-4 - J * 1.5, 4); c.quadraticCurveTo(0, 4 + mo, 4 + J * 1.5, 4); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,120,120,' + (0.45 + J * 0.3) + ')'; c.beginPath(); c.arc(-6.5, 4, 2, 0, TAU); c.fill(); c.beginPath(); c.arc(6.5, 4, 2, 0, TAU); c.fill();
      c.restore();
      // 광란: 머리 위로 "!!"와 반짝이
      if(J > 0.75 && u >= 1 && (Math.floor(time * 3 + i) % 4 === 0)){
        c.fillStyle = '#ffe14a'; c.font = '900 11px -apple-system, sans-serif'; c.textAlign = 'center';
        c.fillText(i % 2 ? '!!' : '♪', 0, -62);
      }
      c.lineCap = 'butt';
      c.restore();
    }
  }


  /* ---- 위탁 수수료를 받아 갈 업체 사장님: 결과가 나오면 오른쪽에서 등장, 금액에 따라 표정이 달라진다 ---- */
  const boss = { fee:0, t0:0 };
  function showBoss(fee){ boss.fee = fee; boss.t0 = time; }
  function hideBoss(){ boss.fee = 0; }
  function drawBoss(c){
    if(!boss.fee) return;
    const age = time - boss.t0;
    const m = clamp((boss.fee - 1) / 19, 0, 1);          // 0: 1원(슬픔) ~ 1: 20원(환희)
    const inU = clamp(age / 0.6, 0, 1), inE = 1 - Math.pow(1 - inU, 3);
    let bx = lerp(430, 306, inE), by = 548;
    let tilt = 0, bob = 0;
    if(inU >= 1){
      if(m > 0.65){ bob = -Math.abs(Math.sin(time * Math.PI / BEAT)) * (6 + (m - 0.65) * 30); tilt = Math.sin(time * 5) * 0.06; }   // 신나서 들썩
      else if(m < 0.35){ tilt = Math.sin(time * 2.2) * 0.12; bob = 3 + Math.sin(time * 1.4) * 1.5; }                               // 고개 절레절레, 축 처짐
      else { tilt = Math.sin(time * 1.6) * 0.03; }
    }
    const faint = feeTier(boss.fee).lv >= 3 ? ease(clamp((age - 2.6) / 0.5, 0, 1)) : 0;   // 잭팟: 너무 좋아서 기절
    if(faint > 0){ bob = 0; tilt = 0; }
    c.save();
    c.translate(bx - faint * 6, by + bob - faint * 6); c.rotate(tilt * 0.4 - faint * 1.05);
    // 팔
    const suit = '#26324f', suitL = '#3a4a72', skin = '#f6c9a0', skinD = '#e0a77c';
    c.lineCap = 'round';
    function arm(sx, sy, ex, ey){
      c.strokeStyle = suit; c.lineWidth = 11; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
      c.fillStyle = skin; c.beginPath(); c.arc(ex, ey, 6, 0, TAU); c.fill();
    }
    if(faint > 0.5){
      arm(-20, -42, -44, -26 + Math.sin(time * 20) * 2); arm(20, -42, 42, -30);   // 대자로 뻗음
    }else if(m > 0.65){
      const pump = Math.sin(time * Math.PI / BEAT * 2) * 5;
      arm(-20, -42, -32, -84 + pump); arm(20, -42, 32, -84 - pump);            // 만세!
    }else if(m < 0.12){
      arm(-20, -42, -10, -64); arm(20, -42, 22, -8);                            // 한 손으로 얼굴을 감싸 쥔다
    }else if(m < 0.35){
      arm(-20, -42, -26, -6); arm(20, -42, 26, -6);                             // 축 늘어진 팔
    }else{
      arm(-20, -42, -30, -22); arm(20, -42, 30, -22);                           // 허리에 손
    }
    // 몸 (양복, 셔츠, 넥타이, 명찰)
    let g = c.createLinearGradient(-28, -50, 28, 0);
    g.addColorStop(0, suitL); g.addColorStop(1, suit);
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-30, 0); c.lineTo(-27, -40); c.quadraticCurveTo(-24, -50, -12, -51); c.lineTo(12, -51); c.quadraticCurveTo(24, -50, 27, -40); c.lineTo(30, 0); c.closePath(); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(-9, -51); c.lineTo(9, -51); c.lineTo(0, -26); c.closePath(); c.fill();
    c.fillStyle = '#d4202c'; c.beginPath(); c.moveTo(-3, -48); c.lineTo(3, -48); c.lineTo(4.5, -30); c.lineTo(0, -24); c.lineTo(-4.5, -30); c.closePath(); c.fill();
    c.fillStyle = '#ffd84a'; c.fillRect(7, -41, 19, 10);
    c.fillStyle = '#2a1a00'; c.font = '900 7.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('사장', 16.5, -35.6);

    // 머리
    c.save(); c.translate(0, -70); c.rotate(tilt);
    c.fillStyle = skinD; c.beginPath(); c.arc(-19, 2, 4.5, 0, TAU); c.fill(); c.beginPath(); c.arc(19, 2, 4.5, 0, TAU); c.fill();   // 귀
    g = c.createRadialGradient(-6, -8, 3, 0, 0, 24);
    g.addColorStop(0, '#ffe0c2'); g.addColorStop(1, skin);
    c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 19, 21, 0, 0, TAU); c.fill();
    // 화나서 붉어진 얼굴 / 슬퍼서 창백한 이마
    if(m > 0.12 && m < 0.45){ c.fillStyle = 'rgba(230,40,30,' + (0.4 * (1 - (m - 0.12) / 0.33)) + ')'; c.beginPath(); c.ellipse(0, 2, 19, 19, 0, 0, TAU); c.fill(); }
    if(m <= 0.12){
      c.strokeStyle = 'rgba(90,110,200,0.55)'; c.lineWidth = 1.4;
      for(let k=0;k<4;k++){ c.beginPath(); c.moveTo(-9 + k * 6, -18); c.lineTo(-9 + k * 6, -10); c.stroke(); }
    }
    // 머리카락 (옆머리만 남은 사장님) + 정수리 광택
    c.fillStyle = '#5b5f6b';
    c.beginPath(); c.ellipse(-16, -6, 5, 9, 0.3, 0, TAU); c.fill(); c.beginPath(); c.ellipse(16, -6, 5, 9, -0.3, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.ellipse(-5, -15, 6, 2.5, -0.3, 0, TAU); c.fill();

    // 눈썹
    const browL = m > 0.5 ? (m - 0.5) * 7 : 0;
    let inner;                               // 눈썹 안쪽 끝 높이 (+: 올라감)
    if(m <= 0.12) inner = 4;                 // 슬픔: 八자
    else if(m < 0.45) inner = -4 * (1 - (m - 0.12) / 0.33) - 0.5;   // 화남: V자
    else inner = 1;
    c.strokeStyle = '#3c3f48'; c.lineWidth = 2.6;
    c.beginPath(); c.moveTo(-13, -7 - browL); c.lineTo(-4, -7 - browL - inner); c.stroke();
    c.beginPath(); c.moveTo(13, -7 - browL); c.lineTo(4, -7 - browL - inner); c.stroke();

    // 눈
    c.fillStyle = '#1e1a16'; c.strokeStyle = '#1e1a16'; c.lineWidth = 2.2;
    if(faint > 0.6){
      c.lineWidth = 1.8; spiralEye(c, -8, 0, 4.4, time * 9); spiralEye(c, 8, 0, 4.4, -time * 9); c.lineWidth = 2.2;   // 눈이 빙글빙글
    }else if(m >= 0.8){
      c.beginPath(); c.arc(-8, 0, 3.6, Math.PI * 1.1, Math.PI * 1.9); c.stroke();   // 웃는 눈 ^ ^
      c.beginPath(); c.arc(8, 0, 3.6, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    }else if(m <= 0.12){
      c.beginPath(); c.moveTo(-11, 0); c.quadraticCurveTo(-8, 2.5, -5, 0); c.stroke();   // 질끈 감은 눈
      c.beginPath(); c.moveTo(11, 0); c.quadraticCurveTo(8, 2.5, 5, 0); c.stroke();
    }else{
      const ry = m < 0.45 ? 1.8 : 2.6;
      c.beginPath(); c.ellipse(-8, 0, 2.4, ry, 0, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(8, 0, 2.4, ry, 0, 0, TAU); c.fill();
    }
    // 코와 콧수염
    c.fillStyle = skinD; c.beginPath(); c.ellipse(0, 5, 3, 3.6, 0, 0, TAU); c.fill();
    c.fillStyle = '#4a4d56';
    c.beginPath(); c.ellipse(-4.5, 9.5, 5, 2.2, 0.15, 0, TAU); c.fill(); c.beginPath(); c.ellipse(4.5, 9.5, 5, 2.2, -0.15, 0, TAU); c.fill();

    // 입: 1원 엉엉 → 낮으면 시무룩 → 높으면 활짝 → 20원 입이 귀에 걸림
    const my = 14;
    if(m <= 0.12){
      const w = 1 + Math.abs(Math.sin(time * 9)) * 1.5;
      c.fillStyle = '#6b1a1a'; c.beginPath(); c.ellipse(0, my + 2, 5, 3 + w, 0, 0, TAU); c.fill();     // 엉엉 우는 입
    }else if(m < 0.6){
      const sm = (m - 0.35) / 0.25;          // -1(시무룩) ~ +1(미소)
      c.strokeStyle = '#6b1a1a'; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(-7, my); c.quadraticCurveTo(0, my + clamp(sm, -1, 1) * 6, 7, my); c.stroke();
    }else{
      const op = 3 + (m - 0.6) / 0.4 * 7 + (m > 0.9 ? Math.abs(Math.sin(time * 12)) * 2 : 0);
      const mw = 7 + (m - 0.6) * 10;
      c.fillStyle = '#6b1a1a';
      c.beginPath(); c.moveTo(-mw, my - 1); c.quadraticCurveTo(0, my + op * 1.6, mw, my - 1); c.closePath(); c.fill();
      c.fillStyle = '#ff8a9a'; c.beginPath(); c.ellipse(0, my + op * 0.55, mw * 0.45, op * 0.35, 0, 0, TAU); c.fill();
      c.fillStyle = '#ffffff'; c.fillRect(-mw * 0.6, my - 1, mw * 1.2, 2);
    }
    // 볼 터치 (기쁠수록 진하게)
    if(m > 0.55){ c.fillStyle = 'rgba(255,110,120,' + ((m - 0.55) * 1.2) + ')'; c.beginPath(); c.arc(-13, 7, 4, 0, TAU); c.fill(); c.beginPath(); c.arc(13, 7, 4, 0, TAU); c.fill(); }
    // 눈물 (1원 근처): 줄줄 흐른다
    if(m <= 0.12){
      c.fillStyle = 'rgba(120,190,255,0.9)';
      [-8, 8].forEach(function(ex, k){
        for(let j=0;j<3;j++){
          const ph = (time * 1.6 + j / 3 + k * 0.17) % 1;
          c.beginPath(); c.ellipse(ex + (k ? 1 : -1) * ph * 3, 3 + ph * 22, 1.8, 2.6, 0, 0, TAU); c.fill();
        }
      });
    }
    if(faint > 0.6){
      for(let k=0;k<4;k++){ const ang = time * 5 + k * TAU / 4; star(c, Math.cos(ang) * 24, -26 + Math.sin(ang) * 6, 3.4, k % 2 ? '#ffe27a' : '#ffffff'); }
    }
    c.restore();

    // 화가 나면 머리에서 김이 폴폴
    if(m > 0.12 && m < 0.35){
      for(let k=0;k<3;k++){
        const ph = (time * 0.9 + k / 3) % 1;
        c.fillStyle = 'rgba(230,235,245,' + (0.6 * (1 - ph)) + ')';
        c.beginPath(); c.arc(-12 + k * 12 + Math.sin(time * 3 + k) * 3, -96 - ph * 26, 4 + ph * 5, 0, TAU); c.fill();
      }
    }
    // 아주 기쁘면 반짝반짝
    if(m >= 0.8){
      for(let k=0;k<4;k++){
        const ang = time * 3 + k * 1.57;
        star(c, Math.cos(ang) * 34, -72 + Math.sin(ang * 1.3) * 18, 3 + Math.abs(Math.sin(time * 7 + k)) * 3, k % 2 ? '#ffe27a' : '#ffffff');
      }
    }
    c.lineCap = 'butt';
    c.restore();
  }

  /* ---- 황금 문어: 안 보이다가 구멍에서 쏙 나와 다리로 황금 버튼을 꾹, 끝나면 쏙 들어간다 ---- */
  const bird = { up:0, upV:0, target:0, mode:'hidden', act:null, reach:0, press:0, blinkT:0, nextBlink:2.5, hop:0, celT:0, say:'', talk:'', talkT:0, talkUntil:0 };
  let birdTimer = null;

  function sparks(x, y, count){
    for(let k=0;k<count;k++){
      confetti.push({
        x: x + rand(-14, 14), y: y + rand(-4, 4),
        vx: rand(-90, 90), vy: rand(-190, -90),
        rot: rand(0, TAU), vr: rand(-8, 8),
        w: rand(3, 5), h: rand(3, 5),
        color: k % 2 ? '#ffe27a' : '#ffffff', life: rand(0.5, 0.9)
      });
    }
  }

  // 까치가 나와 버튼을 콕 누른다. 눌리는 순간 onPress를 부르고 Promise를 끝낸다.
  function birdPress(onPress, onAppear){
    return new Promise(function(resolve){
      if(birdTimer){ clearTimeout(birdTimer); birdTimer = null; }
      const appear = bird.up < 0.5;
      bird.mode = 'cheer';
      bird.target = 1;
      bird.act = { phase:0, t:0, onPress:onPress, onAppear:appear ? onAppear : null, resolve:resolve };
    });
  }

  function birdCelebrate(ms, after, text){
    if(birdTimer) clearTimeout(birdTimer);
    bird.mode = 'celebrate'; bird.target = 1; bird.say = text || ''; bird.celT = time;
    birdTimer = setTimeout(function(){
      if(after === 'hide'){
        bird.mode = 'wave';
        birdTimer = setTimeout(function(){ birdHide(); }, 1500);
      }else{
        bird.mode = 'cheer'; birdTimer = null;
      }
    }, ms);
  }

  // 공이 나올 때마다 한 글자씩 말하고, 말풍선에 글자가 이어 붙는다
  const words = [];
  function popWord(text, i){
    words.push({ text:text, x:SLOTX[i], t:0 });
  }
  function drawWords(c){
    for(let k=0;k<words.length;k++){
      const w = words[k], u = clamp(w.t / 1.1, 0, 1);
      const sc = w.t < 0.15 ? 0.5 + w.t / 0.15 * 0.8 : 1.3 - Math.min(0.3, (w.t - 0.15) * 1.5);
      c.save();
      c.translate(w.x, RAILY - 30 - u * 34);
      c.scale(sc, sc);
      c.globalAlpha = 1 - Math.max(0, (u - 0.6) / 0.4);
      c.font = '900 26px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 5; c.strokeStyle = '#4a2a00'; c.strokeText(w.text, 0, 0);
      const g = c.createLinearGradient(0, -13, 0, 13);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#ff8a00');
      c.fillStyle = g; c.fillText(w.text, 0, 0);
      c.restore();
    }
    c.globalAlpha = 1;
  }

  const banner = { text:'', t0:0, until:0 };
  function showBanner(text, ms){ banner.text = text; banner.t0 = time; banner.until = time + ms / 1000; }
  // 예술적인 금박 붓글씨 느낌: 글자마다 기울기와 물결, "대박"은 더 크고 붉은 금빛
  try{ document.fonts && document.fonts.load('30px ParkrioTitle', '위탁수수료결정!축하합니다원0123456789'); }catch(e){}
  function drawBanner(c){
    if(!banner.text || time > banner.until) return;
    const age = time - banner.t0, left = banner.until - time;
    const pop = age < 0.35 ? 0.4 + (age / 0.35) * 0.75 : 1.15 - Math.min(0.15, (age - 0.35) * 0.6);
    const chars = Array.from(banner.text);
    const FONT = '"ParkrioTitle", "Noto Serif KR", "Nanum Myeongjo", serif';
    c.save();
    c.translate(CX, 350);
    c.scale(pop, pop);
    c.globalAlpha = clamp(left / 0.5, 0, 1);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    // 글자 폭 계산
    const sizes = chars.map(function(ch, k){ return (ch === '대' || ch === '박') ? 33 : ch === '!' ? 30 : 27; });
    const widths = chars.map(function(ch, k){ c.font = sizes[k] + 'px ' + FONT; return c.measureText(ch).width + 1; });
    const total = widths.reduce(function(a, b){ return a + b; }, 0) + 6;
    let x = -total / 2;
    const tilts = [-0.12, 0.07, -0.05, 0.1, -0.08, 0.12, 0.18];
    chars.forEach(function(ch, k){
      if(ch === '대') x += 6;   // "파크리오"와 "대박" 사이 살짝 띄움
      const w = widths[k], cx0 = x + w / 2;
      const y = Math.sin(time * 4 + k * 0.9) * 2.5 - (k >= 4 ? 2 : 0);
      const big = ch === '대' || ch === '박';
      c.save();
      c.translate(cx0, y);
      c.rotate(tilts[k % tilts.length] + Math.sin(time * 3 + k) * 0.03);
      c.font = sizes[k] + 'px ' + FONT;
      c.lineJoin = 'round';
      // 바깥 빛과 두꺼운 테두리
      c.shadowColor = big ? 'rgba(255,90,40,0.85)' : 'rgba(255,200,60,0.85)'; c.shadowBlur = 14;
      c.lineWidth = 7; c.strokeStyle = '#3a1800'; c.strokeText(ch, 0, 0);
      c.shadowBlur = 0;
      c.lineWidth = 3; c.strokeStyle = big ? '#ffb38a' : '#fff0b0'; c.strokeText(ch, 0, 0);
      // 금박 그라디언트
      const h = sizes[k] / 2;
      const g = c.createLinearGradient(0, -h, 0, h);
      if(big){ g.addColorStop(0, '#fff3c8'); g.addColorStop(0.4, '#ffb21f'); g.addColorStop(0.75, '#ff5a1f'); g.addColorStop(1, '#c4200e'); }
      else { g.addColorStop(0, '#fffde6'); g.addColorStop(0.42, '#ffd84a'); g.addColorStop(0.7, '#e09a10'); g.addColorStop(1, '#a8650a'); }
      c.fillStyle = g; c.fillText(ch, 0, 0);
      // 위쪽 광택
      c.save();
      c.beginPath(); c.rect(-w, -h, w * 2, h * 0.75); c.clip();
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillText(ch, 0, 0);
      c.restore();
      c.restore();
      // 반짝임
      const tw = Math.max(0, Math.sin(time * 4.5 + k * 1.7));
      if(tw > 0.6) star(c, cx0 + w * 0.32, y - h * 0.8, 1.5 + (tw - 0.6) * 9, 'rgba(255,255,255,' + tw + ')');
      x += w;
    });
    c.restore();
  }


  function birdTalk(text, ms){
    bird.talk = text; bird.talkT = time; bird.talkUntil = time + (ms || 1200) / 1000;
  }

  // 결정된 꼴뚜기를 바라보며 손(다리)을 흔들고, 그대로 천천히 내려가 사라진다
  function birdLook(ms){
    if(birdTimer) clearTimeout(birdTimer);
    bird.mode = 'look'; bird.target = 1; bird.say = ''; bird.celT = time; bird.sink = 0;
    birdTimer = setTimeout(function(){
      bird.sink = 1;                                     // 부드럽게 내려가기 시작
      birdTimer = setTimeout(function(){ bird.sink = 0; birdHide(); bird.up = 0; bird.upV = 0; }, 1300);
    }, ms || 1600);
  }

  // 결과 박스에 넣을 황금새 그림
  let birdIconCache = null;
  function birdIconURL(){
    if(birdIconCache) return birdIconCache;
    const c2 = document.createElement('canvas'); c2.width = 280; c2.height = 180;
    const x2 = c2.getContext('2d'); x2.scale(2, 2);
    drawMagpie(x2, { x:62, y:84 });
    birdIconCache = c2.toDataURL();
    return birdIconCache;
  }

  // 꼴뚜기가 결정되면 황금새는 아래로 스르르 내려가 사라진다
  function birdLeave(){
    if(birdTimer) clearTimeout(birdTimer);
    bird.mode = 'cheer'; bird.say = ''; bird.sink = 1;
    birdTimer = setTimeout(function(){ bird.sink = 0; birdHide(); bird.up = 0; bird.upV = 0; }, 1300);
  }

  function birdHide(){
    if(birdTimer){ clearTimeout(birdTimer); birdTimer = null; }
    bird.mode = 'hidden'; bird.target = 0;
    if(bird.act){ const A = bird.act; bird.act = null; bird.reach = 0; bird.press = 0; A.resolve(); }
  }

  function updateBird(dt){
    if(bird.sink){
      bird.up = Math.max(0, bird.up - dt * (0.35 + (1 - bird.up) * 1.1));   // 튕기지 않고 스르르
      bird.upV = 0;
    }else{
      const a = (bird.target - bird.up) * 220 - bird.upV * 17;
      bird.upV += a * dt; bird.up += bird.upV * dt;
    }
    const A = bird.act;
    if(A){
      A.t += dt;
      if(A.phase === 0){
        if(bird.up > 0.92 || A.t > 0.9){ A.phase = 1; A.t = 0; if(A.onAppear) A.onAppear(); }
      }else if(A.phase === 1){
        const u = clamp(A.t / 0.34, 0, 1);       // 고개를 살짝 젖혀 힘을 모은다
        bird.reach = -0.18 * ease(u);
        if(u >= 1){ A.phase = 2; A.t = 0; }
      }else if(A.phase === 2){
        const u = clamp(A.t / 0.09, 0, 1);       // 부리로 콕!
        bird.reach = lerp(-0.18, 1, u * u);
        if(u >= 1){ bird.reach = 1; A.phase = 3; A.t = 0; }
      }else if(A.phase === 3){
        bird.press = clamp(A.t / 0.06, 0, 1);
        if(A.t >= 0.06){
          bird.press = 1; A.phase = 4; A.t = 0;
          sparks(BTNX, BTNY - 10, 18);
          if(A.onPress) A.onPress();
          A.resolve();
        }
      }else if(A.phase === 4){
        if(A.t >= 0.12){ A.phase = 5; A.t = 0; }
      }else if(A.phase === 5){
        const u = clamp(A.t / 0.26, 0, 1);
        bird.reach = 1 - ease(u);
        bird.press = 1 - clamp(u * 2, 0, 1);
        if(u >= 1){ bird.reach = 0; bird.press = 0; bird.act = null; }
      }
    }
    bird.nextBlink -= dt;
    if(bird.nextBlink <= 0){ bird.blinkT = 0.12; bird.nextBlink = rand(2.2, 4); }
    if(bird.blinkT > 0) bird.blinkT -= dt;
    bird.hop = Math.max(0, bird.hop - dt * 4);
  }

  // 기절한 눈 @@
  function spiralEye(c, x, y, r, rot){
    c.beginPath();
    for(let q=0;q<=28;q++){
      const a = q / 28 * TAU * 2.2 + rot, rr = r * q / 28;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if(q) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.stroke();
  }
  function heart(c, x, y, s){
    c.beginPath(); c.moveTo(x, y + s);
    c.bezierCurveTo(x - s * 2, y - s * 0.2, x - s * 1.2, y - s * 1.8, x, y - s * 0.6);
    c.bezierCurveTo(x + s * 1.2, y - s * 1.8, x + s * 2, y - s * 0.2, x, y + s);
    c.fill();
  }

  function star(c, x, y, r, col){
    c.fillStyle = col; c.beginPath();
    for(let k=0;k<8;k++){
      const ang = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? r * 0.35 : r;
      c.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
    }
    c.closePath(); c.fill();
  }

  function drawButton(c){
    const h = 16 - 9 * bird.press;
    const idle = bird.mode === 'hidden' && !bird.act;
    if(idle){
      const gl = 0.22 + 0.12 * Math.sin(time * 3);
      const rg = c.createRadialGradient(BTNX, BTNY - 8, 4, BTNX, BTNY - 8, 46);
      rg.addColorStop(0, 'rgba(255,205,60,' + gl + ')'); rg.addColorStop(1, 'rgba(255,205,60,0)');
      c.fillStyle = rg; c.beginPath(); c.arc(BTNX, BTNY - 8, 46, 0, TAU); c.fill();
    }
    c.fillStyle = '#6b4c08'; c.beginPath(); c.ellipse(BTNX, BTNY, 27, 8, 0, 0, TAU); c.fill();
    const g = c.createLinearGradient(BTNX - 22, 0, BTNX + 22, 0);
    g.addColorStop(0, '#fff2a8'); g.addColorStop(0.4, '#e3a812'); g.addColorStop(1, '#7a5200');
    c.fillStyle = g; c.fillRect(BTNX - 22, BTNY - h, 44, h);
    const tg = c.createRadialGradient(BTNX - 6, BTNY - h - 2, 2, BTNX, BTNY - h, 24);
    tg.addColorStop(0, '#fff7c4'); tg.addColorStop(0.5, '#ffd23f'); tg.addColorStop(1, '#c48a08');
    c.fillStyle = tg; c.beginPath(); c.ellipse(BTNX, BTNY - h, 22, 7, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(BTNX - 7, BTNY - h - 1.5, 7, 2.2, 0, 0, TAU); c.fill();
    // 금빛 반짝임
    const tw = Math.max(0, Math.sin(time * 2.3));
    star(c, BTNX + 12, BTNY - h - 3, 1.5 + tw * 3, 'rgba(255,255,255,' + (0.4 + tw * 0.5) + ')');
  }

  // 문어 다리: 굵기가 점점 가늘어지는 곡선 + 빨판
  function tentacle(c, p0, p1, p2, w0, w1, suck){
    const N = 14; let px = p0[0], py = p0[1];
    for(let k=1;k<=N;k++){
      const u = k / N, iu = 1 - u;
      const x = iu*iu*p0[0] + 2*iu*u*p1[0] + u*u*p2[0];
      const y = iu*iu*p0[1] + 2*iu*u*p1[1] + u*u*p2[1];
      c.lineWidth = lerp(w0, w1, u);
      const gg = 0.5 + 0.5 * Math.sin(u * 3);
      c.strokeStyle = 'rgb(' + Math.round(lerp(196, 240, gg)) + ',' + Math.round(lerp(140, 190, gg)) + ',' + Math.round(lerp(16, 50, gg)) + ')';
      c.beginPath(); c.moveTo(px, py); c.lineTo(x, y); c.stroke();
      if(suck && k % 3 === 0 && k < N){
        c.fillStyle = 'rgba(255,240,190,0.9)';
        c.beginPath(); c.arc(x, y + lerp(w0, w1, u) * 0.25, lerp(w0, w1, u) * 0.22, 0, TAU); c.fill();
      }
      px = x; py = y;
    }
    c.fillStyle = '#f2c230'; c.beginPath(); c.arc(p2[0], p2[1], w1 * 0.55, 0, TAU); c.fill();
  }

  function drawOctopus(c){
    if(bird.target === 0 && bird.up < 0.02 && Math.abs(bird.upV) < 0.1 && !bird.act) return;   // 완전히 숨어 있으면 그리지 않는다
    const t = time, mode = bird.mode;
    const celeb = mode === 'celebrate', cheer = mode === 'cheer' && !bird.act, wave = mode === 'wave';
    const talking = time < bird.talkUntil && time - bird.talkT < 0.5;
    let oy = 125 * (1 - bird.up);
    const lookT = mode === 'look' ? time - bird.celT : -1;
    if(lookT > 0) oy -= Math.sin(lookT * 5) * 1.5;   // 손 흔들며 살랑살랑
    if(celeb) oy -= Math.abs(Math.sin(t * 9)) * 12;
    else if(cheer) oy -= Math.abs(Math.sin(t * 4)) * 3;
    oy -= bird.hop * 8;
    const hx = BX + (celeb ? Math.sin(t * 7) * 9 : 0), hy = 470 + oy;   // 축하 때는 좌우로 신나게 춤   // 머리 중심
    const sq = celeb ? 1 + Math.sin(t * 18) * 0.04 : 1 + Math.sin(t * 3) * 0.02;

    c.save();
    c.beginPath(); c.rect(0, 0, W, HOLEY); c.ellipse(BX, HOLEY, HOLERX, 8, 0, 0, TAU); c.clip();
    c.lineCap = 'round';
    if(lookT >= 0){
      // 몸을 홱 돌려 위쪽의 결정된 꼴뚜기를 쳐다본다 (살짝 흔들흔들)
      const turn = -0.3 * (1 - Math.pow(1 - clamp(lookT / 0.5, 0, 1), 3));   // 몸을 살짝 돌려 바라본다
      c.translate(hx, hy + 30); c.rotate(turn); c.translate(-hx, -(hy + 30));
    }

    // 구멍 아래로 늘어진 다리
    for(let k=0;k<5;k++){
      const sx = hx - 16 + k * 8, sw = Math.sin(t * 4 + k * 1.4) * 6;
      tentacle(c, [sx, hy + 18], [sx + sw, hy + 34], [sx - sw * 0.6 + (k - 2) * 4, hy + 52], 10, 5, false);
    }

    // 버튼을 누르는 왼쪽 다리
    const press = bird.press, A = bird.reach;
    const sh = [hx - 20, hy + 12];
    const rest = [hx - 34, hy + 34];
    const tgt = [BTNX + 2, BTNY - (16 - 9 * press) - 3];
    let tip;
    if(A >= 0) tip = [lerp(rest[0], tgt[0], A), lerp(rest[1], tgt[1], A)];
    else tip = [rest[0] + (A / 0.18) * 6, rest[1] + (A / 0.18) * 34];   // 힘을 모으며 다리를 번쩍 든다
    let lc = [(sh[0] + tip[0]) / 2, Math.min(sh[1], tip[1]) - 14 - 26 * Math.max(0, A)];
    if(lookT >= 0){ tip = [hx - 34 + Math.sin(t * 10) * 9, hy - 46 + Math.abs(Math.cos(t * 10)) * 4]; lc = [hx - 38, hy - 4]; }   // 결정된 꼴뚜기를 향해 바이바이
    else if(celeb){ tip = [hx - 46 + Math.sin(t * 14) * 6, hy - 34 + Math.cos(t * 14) * 8]; lc = [hx - 44, hy + 6]; }
    else if(cheer){ tip = [rest[0] - 4 + Math.sin(t * 5) * 4, rest[1] - 6 + Math.cos(t * 5) * 4]; lc = [hx - 34, hy + 18]; }
    tentacle(c, sh, lc, tip, 11, 5, true);

    // 오른쪽 다리: 환호와 손 흔들기
    let rt, rc;
    if(celeb){ rt = [hx + 46 - Math.sin(t * 14) * 6, hy - 34 + Math.sin(t * 14) * 8]; rc = [hx + 44, hy + 6]; }
    else if(wave){ rt = [hx + 44 + Math.sin(t * 11) * 9, hy - 30]; rc = [hx + 40, hy + 8]; }
    else { rt = [hx + 36 + Math.sin(t * 4.5) * 4, hy + 32 + Math.cos(t * 4.5) * 3]; rc = [hx + 34, hy + 16]; }
    tentacle(c, [hx + 20, hy + 12], rc, rt, 11, 5, true);

    // 몸통 (황금 꼴뚜기: 뾰족한 몸통과 지느러미)
    c.save(); c.translate(hx, hy); c.scale(1 / sq, sq);
    const fin = celeb ? Math.sin(t * 14) * 0.15 : Math.sin(t * 4) * 0.06;
    [-1, 1].forEach(function(sd){
      c.save(); c.translate(sd * 8, -34); c.rotate(sd * fin);
      const fg2 = c.createLinearGradient(0, -8, sd * 28, 10);
      fg2.addColorStop(0, '#f2c230'); fg2.addColorStop(1, '#8a6000');
      c.fillStyle = fg2;
      c.beginPath(); c.moveTo(-sd * 2, -8); c.quadraticCurveTo(sd * 30, -6, sd * 24, 18); c.lineTo(sd * 6, 14); c.closePath(); c.fill();
      c.restore();
    });
    let g = c.createRadialGradient(-8, -24, 3, 0, -10, 42);
    g.addColorStop(0, '#fff6c4'); g.addColorStop(0.35, '#f6cf45'); g.addColorStop(0.75, '#c99212'); g.addColorStop(1, '#7a5400');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(0, -46); c.bezierCurveTo(16, -38, 23, -12, 23, 6); c.quadraticCurveTo(23, 21, 0, 22); c.quadraticCurveTo(-23, 21, -23, 6); c.bezierCurveTo(-23, -12, -16, -38, 0, -46); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(110,70,0,0.45)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(140,90,0,0.25)';
    [[-12, -18, 2.6], [10, -24, 2.2], [15, -6, 1.8], [-16, -4, 1.8], [2, -34, 1.6]].forEach(function(p){ c.beginPath(); c.arc(p[0], p[1], p[2], 0, TAU); c.fill(); });
    c.fillStyle = 'rgba(255,255,255,0.55)'; c.beginPath(); c.ellipse(-8, -24, 5, 11, -0.25, 0, TAU); c.fill();

    // 눈
    const look = mode === 'look' ? -1.4 : (bird.act && A > 0 ? -2.5 : 0);
    const lookY = mode === 'look' ? -2.6 : 0;   // 위쪽의 결정된 꼴뚜기를 올려다본다
    if(celeb || wave){
      c.strokeStyle = '#2a1a04'; c.lineWidth = 2.4;
      c.beginPath(); c.arc(-10, 4, 4.5, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(10, 4, 4.5, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    }else{
      [-10, 10].forEach(function(ex, ei){
        if(lookT >= 0){
          // 반달 눈웃음으로 결정된 꼴뚜기를 바라본다
          c.strokeStyle = '#2a1a04'; c.lineWidth = 2.4;
          c.beginPath(); c.arc(ex - 1, 3, 4.5, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
          return;
        }
        c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(ex, 2, 6, bird.blinkT > 0 ? 1 : 7, 0, 0, TAU); c.fill();
        if(bird.blinkT <= 0){
          c.fillStyle = '#1a1206'; c.beginPath(); c.arc(ex + look, 3 + lookY, 3.6, 0, TAU); c.fill();
          c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + look - 1.3, 1.5 + lookY, 1.3, 0, TAU); c.fill();
        }
      });
    }
    c.fillStyle = 'rgba(255,120,110,0.5)';
    c.beginPath(); c.arc(-17, 11, 3.5, 0, TAU); c.fill(); c.beginPath(); c.arc(17, 11, 3.5, 0, TAU); c.fill();
    // 입 (말할 때와 환호할 때 오물오물)
    const mo = talking ? 2 + Math.abs(Math.sin(t * 18)) * 3 : celeb ? 2 + Math.abs(Math.sin(t * 12)) * 3 : 1.2;
    c.fillStyle = '#7a2a18'; c.beginPath(); c.ellipse(0, 13, 3.2, mo, 0, 0, TAU); c.fill();
    c.restore();

    // 금빛 반짝임
    const tw = Math.abs(Math.sin(t * 3.1));
    star(c, hx - 4 + Math.sin(t * 1.3) * 10, hy - 14 + Math.cos(t * 1.7) * 5, 1.5 + tw * 2.5, 'rgba(255,255,255,' + (0.35 + tw * 0.5) + ')');
    c.lineCap = 'butt';
    c.restore();


    if(celeb && bird.up > 0.6){
      for(let k=0;k<5;k++){
        const ang = t * 3 + k * 1.2566;
        star(c, hx + Math.cos(ang) * 50, hy - 10 + Math.sin(ang * 1.3) * 20, 3.5 + Math.abs(Math.sin(t * 8 + k)) * 3, k % 2 ? '#ffe27a' : '#ffffff');
      }
    }
  }

  // 황금새: 구멍에서 쏙 나와 황금 부리로 버튼을 톡!
  function drawMagpie(c, icon){
    if(!icon && bird.target === 0 && bird.up < 0.02 && Math.abs(bird.upV) < 0.1 && !bird.act) return;   // 완전히 숨어 있으면 그리지 않는다
    const t = time;
    const mode = icon ? 'icon' : bird.mode;
    const celeb = mode === 'celebrate', cheer = mode === 'cheer' && !bird.act, wave = mode === 'wave';
    const pressing = !icon && bird.reach > 0.6;

    let oy = icon ? 0 : 115 * (1 - bird.up);
    if(celeb) oy -= Math.abs(Math.sin(t * 10)) * 12;
    else if(cheer) oy -= Math.abs(Math.sin(t * 5)) * 2.5;
    oy -= bird.hop * 8;
    const baseY = 512 + oy;

    // 콕 찍는 자세: 부리 끝이 황금 버튼 윗면에 정확히 닿도록 몸을 기울이고 앞으로 내민다
    const BS = icon ? 1.2 : 0.98;   // 버튼을 누르는 황금새는 조금 작게
    const pvx = BX, pvy = baseY - 8 * BS;
    const Tx = -42 * BS, Ty = -36 * BS;
    const Gx = BTNX + 3 - pvx, Gy = BTNY - (16 - 9 * bird.press) - 1 - pvy;
    const lenG = Math.hypot(Gx, Gy), lenT = Math.hypot(Tx, Ty);
    const rot = Math.atan2(Gy, Gx) - Math.atan2(Ty, Tx);
    const lunge = lenG - lenT;
    const A = icon ? 0 : bird.reach;

    c.save();
    if(!icon){ c.beginPath(); c.rect(0, 0, W, HOLEY); c.ellipse(BX, HOLEY, HOLERX, 8, 0, 0, TAU); c.clip(); }
    if(icon) c.translate(icon.x, icon.y);
    else c.translate(BX + Gx / lenG * lunge * A, baseY + Gy / lenG * lunge * A);
    const idleTilt = celeb ? Math.sin(t * 10) * 0.08 : cheer ? Math.sin(t * 3) * 0.04 : 0;
    c.translate(0, -8 * BS); c.rotate(rot * A + idleTilt); c.translate(0, 8 * BS);
    c.scale(BS, BS);

    // 꼬리: 길고 층진 깃
    const flick = celeb ? Math.sin(t * 14) * 0.18 : cheer ? Math.sin(t * 6) * 0.08 : 0;
    c.save(); c.translate(12, -18); c.rotate(0.34 + flick);
    let g = c.createLinearGradient(0, 0, 52, 0);
    g.addColorStop(0, '#d9a514'); g.addColorStop(0.6, '#8a6000'); g.addColorStop(1, '#3d2900');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-2, -5); c.lineTo(46, -7); c.quadraticCurveTo(56, -2, 46, 3); c.lineTo(-2, 5); c.closePath(); c.fill();
    c.rotate(0.12);
    c.beginPath(); c.moveTo(-2, -4); c.lineTo(38, -5); c.quadraticCurveTo(46, -1, 38, 3); c.lineTo(-2, 4); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(140,230,200,0.35)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(2, 0); c.lineTo(40, -1); c.stroke();
    c.restore();

    // 다리
    c.strokeStyle = '#3a2a10'; c.lineWidth = 2.2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-5, -8); c.lineTo(-7, 4); c.stroke();
    c.beginPath(); c.moveTo(4, -8); c.lineTo(4, 4); c.stroke();
    c.lineCap = 'butt';

    // 몸통
    g = c.createLinearGradient(-20, -42, 18, -6);
    g.addColorStop(0, '#fff1a6'); g.addColorStop(0.35, '#f2c230'); g.addColorStop(0.75, '#c08b12'); g.addColorStop(1, '#6e4c05');
    c.fillStyle = g; c.beginPath(); c.ellipse(0, -24, 21, 16, -0.35, 0, TAU); c.fill();
    // 배의 하얀 깃 (까치 특유의 흰 배)
    g = c.createLinearGradient(-14, -26, 6, -8);
    g.addColorStop(0, '#fffdf3'); g.addColorStop(1, '#f1dfa6');
    c.fillStyle = g; c.beginPath(); c.ellipse(-5, -17, 12, 9, -0.3, 0, TAU); c.fill();
    // 목
    g = c.createLinearGradient(-20, -46, -2, -28);
    g.addColorStop(0, '#f6cf45'); g.addColorStop(1, '#9a6c06');
    c.fillStyle = g; c.beginPath(); c.ellipse(-10, -36, 10, 9, -0.6, 0, TAU); c.fill();
    // 머리
    g = c.createRadialGradient(-20, -50, 2, -16, -44, 14);
    g.addColorStop(0, '#fff0a0'); g.addColorStop(0.5, '#dba816'); g.addColorStop(1, '#7a5400');
    c.fillStyle = g; c.beginPath(); c.arc(-16, -44, 12.5, 0, TAU); c.fill();
    // 볼
    c.fillStyle = 'rgba(255,130,110,' + (celeb ? 0.55 : 0.35) + ')';
    c.beginPath(); c.arc(-14, -39, 3.2, 0, TAU); c.fill();

    // 황금 부리 (노래할 때 벌어진다)
    const talking = time < bird.talkUntil && time - bird.talkT < 0.5;
    const open = icon && icon.open != null ? icon.open : talking ? 2 + Math.abs(Math.sin(t * 18)) * 4 : celeb ? 1.5 + Math.abs(Math.sin(t * 13)) * 4.5 : 0;
    g = c.createLinearGradient(-43, -46, -24, -41);
    g.addColorStop(0, '#fffbe0'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, '#c48a08');
    c.fillStyle = g; c.strokeStyle = '#7a5000'; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-25, -48.5); c.lineTo(-43, -44.5); c.lineTo(-25, -43.3); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-25, -43); c.lineTo(-40, -42.2 + open); c.lineTo(-25, -40.2); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(-27, -47.3); c.lineTo(-37, -45.4); c.stroke();

    // 눈
    if(icon && icon.puzzled){
      // 황당: 동그랗게 뜬 눈에 콩알만 한 눈동자, 살짝 치켜올린 가는 눈썹
      const look = motionOK ? Math.sin(time * 1.1) * 1.1 : 0;
      if(bird.blinkT > 0){
        c.strokeStyle = '#1a1206'; c.lineWidth = 1.4; c.lineCap = 'round';
        c.beginPath(); c.arc(-19, -47, 3.2, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
      }else{
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(-19, -46.5, 4.3, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(90,60,0,0.6)'; c.lineWidth = 0.6; c.stroke();
        const dy = icon.lookDown ? 2.2 : 0, dx = icon.lookDown ? -1.2 : 0;   // 눈동자를 아래로 내리깔아 광장을 본다
        c.fillStyle = '#1a1206'; c.beginPath(); c.arc(-19.6 + look * 0.5 + dx, -46.2 + dy, 1.35, 0, TAU); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(-20.1 + look * 0.5 + dx, -46.8 + dy, 0.45, 0, TAU); c.fill();
      }
      const br = motionOK ? Math.max(0, Math.sin(time * 1.7)) * 1.2 : 0;
      c.strokeStyle = '#4a3000'; c.lineWidth = 1.3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-23, -52.5 - br * 0.4); c.quadraticCurveTo(-19.5, -55.5 - br, -16, -53.8 - br * 0.5); c.stroke();
      c.lineCap = 'butt';
    }else if(celeb || wave){
      c.strokeStyle = '#1a1206'; c.lineWidth = 1.8; c.lineCap = 'round';
      c.beginPath(); c.arc(-19, -45.5, 2.8, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.lineCap = 'butt';
    }else{
      const ry = bird.blinkT > 0 ? 0.5 : pressing ? 1.4 : 2.7;
      c.fillStyle = '#1a1206'; c.beginPath(); c.ellipse(-19, -46.5, 2.6, ry, 0, 0, TAU); c.fill();
      if(bird.blinkT <= 0 && !pressing){
        c.fillStyle = '#fff'; c.beginPath(); c.arc(-19.9, -47.4, 0.95, 0, TAU); c.fill();
      }
    }

    // 날개 (흰 어깨깃이 있는 까치 날개). 환호할 때는 들어 올려 파닥인다
    let wingA = 0.15;
    if(celeb) wingA = -1.1 + Math.sin(t * 16) * 0.6;
    else if(wave) wingA = -0.9 + Math.sin(t * 10) * 0.5;
    else if(cheer) wingA = 0.15 + Math.max(0, Math.sin(t * 2.2)) * Math.sin(t * 22) * 0.12;
    else if(bird.act) wingA = 0.3;
    if(icon && icon.wing != null) wingA = icon.wing;
    c.save(); c.translate(5, -30); c.rotate(wingA);
    g = c.createLinearGradient(0, -6, 32, 8);
    g.addColorStop(0, '#ffe27a'); g.addColorStop(0.5, '#c99a1a'); g.addColorStop(1, '#5a3d00');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-4, -2); c.quadraticCurveTo(14, -12, 33, 4); c.quadraticCurveTo(14, 10, -4, 6); c.closePath(); c.fill();
    c.fillStyle = '#fffaf0'; c.beginPath(); c.ellipse(5, 1, 6.5, 3.5, 0.2, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(90,60,0,0.55)'; c.lineWidth = 1;
    [[18, 1], [23, 2.5], [28, 3.5]].forEach(function(p){ c.beginPath(); c.moveTo(p[0] - 5, p[1] - 3); c.lineTo(p[0], p[1] + 3); c.stroke(); });
    c.strokeStyle = 'rgba(140,230,200,0.4)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(0, -3); c.quadraticCurveTo(14, -9, 30, 3); c.stroke();
    c.restore();

    // 몸에 흐르는 금빛 반짝임
    const tw = Math.abs(Math.sin(t * 3.1));
    star(c, -6 + Math.sin(t * 1.3) * 9, -30 + Math.cos(t * 1.7) * 5, 1.5 + tw * 2.5, 'rgba(255,255,255,' + (0.35 + tw * 0.5) + ')');

  // 낡은 나무 장대 한 토막
  function pzPole(c, A, B, w){

    c.fillStyle = '#7d5b3a'; c.fillRect(0, -w / 2, len, w);
    c.fillStyle = 'rgba(40,25,10,0.35)'; c.fillRect(0, w / 6, len, w / 3);
    c.fillStyle = 'rgba(255,240,210,0.25)'; c.fillRect(0, -w / 2, len, w / 5);
    c.strokeStyle = 'rgba(40,25,10,0.45)'; c.lineWidth = 0.6;
    for(let q=8;q<len;q+=17){ c.beginPath(); c.moveTo(q, -w / 2); c.lineTo(q + 5, -w / 2 + w * 0.5); c.stroke(); }   // 갈라진 결
    c.restore();
  }
  // 부러진 단면의 나무 가시
  function pzSplinter(c, P, ang, w){
    c.save(); c.translate(P[0], P[1]); c.rotate(ang);
    c.fillStyle = '#c9a26a';
    c.beginPath(); c.moveTo(0, -w / 2); c.lineTo(5, -w / 2 + 1); c.lineTo(2, -w / 6); c.lineTo(7, 0); c.lineTo(2, w / 6); c.lineTo(4, w / 2 - 0.5); c.lineTo(0, w / 2); c.closePath(); c.fill();
    c.restore();
  }
  function drawFlagBanner(c, mood, I, age){
    const tex = pzFlagTexture(plaza.fee, mood);
    const wind = motionOK ? Math.sin(time * 1.7) + Math.sin(time * 4.3) * 0.3 : 0;
    // 왼쪽 장대: 정문 왼쪽 하얀 기둥 위에 꽂혀 있다
    const LB = [17, 254], LT = [22, 24];
    // 오른쪽 장대: 정문 오른쪽 간판 위에 꽂혀 있고, 중간이 부러져 윗부분이 꺾여 매달려 있다
    const RB = [326, 224], RH = [324, 96];
    const phi = ((mood === 'sad' ? 150 : mood === 'joy' ? 132 : 140) + wind * 5) * Math.PI / 180;
    const RT = [RH[0] - Math.sin(phi) * 76, RH[1] - Math.cos(phi) * 76];
    // 장대 받침 (문주에 묶은 철사)
    c.fillStyle = '#6b6f78'; c.fillRect(LB[0] - 5, LB[1] - 8, 10, 6); c.fillRect(RB[0] - 5, RB[1] - 8, 10, 6);
    pzPole(c, LB, LT, 5.5);

    pzPole(c, RB, RH, 5.5);
    pzSplinter(c, RH, Math.atan2(RH[1] - RB[1], RH[0] - RB[0]), 5.5);

    // 현수막: 왼쪽 장대 꼭대기와 부러진 장대 끝 사이에 비스듬히 매달려 펄럭인다
    const L = [LT[0] + 2, LT[1] + 6], R = [RT[0], RT[1] + 2];
    const len = Math.hypot(R[0] - L[0], R[1] - L[1]), ang = Math.atan2(R[1] - L[1], R[0] - L[0]);
    const bh = 72, step = 3;
    const sp = mood === 'joy' ? 5 + I * 4 : mood === 'sad' ? 2.2 : 3.6;
    const amp = mood === 'joy' ? 3.5 + I * 4 : mood === 'sad' ? 2 : 3;
    c.save(); c.translate(L[0], L[1]); c.rotate(ang);
    // 현수막 자체가 찢어져 너덜너덜: 오른쪽 아래는 크게 찢겨 따로 펄럭이고, 왼쪽 아래는 뜯겨 나갔다
    for(let i=0;i<len;i+=step){
      const u = i / len;
      const sag = Math.sin(u * Math.PI) * (mood === 'sad' ? 9 : 5);
      const dy = sag + (motionOK ? Math.sin(time * sp - i * 0.05) * amp * (0.35 + 0.65 * u) : 0);
      const shade = motionOK ? Math.cos(time * sp - i * 0.05) * (0.35 + 0.65 * u) : 0;
      const sx = u * tex.width, sw = step / len * tex.width + 1;
      const shadeCol = shade > 0 ? 'rgba(255,255,255,' + (shade * 0.1) + ')' : 'rgba(0,0,0,' + (-shade * 0.18) + ')';
      if(u >= 0.58){
        // 찢어진 선(들쭉날쭉) 위는 붙어 있고, 아래 조각은 벌어져 따로 나부낀다
        const v = (u - 0.58) / 0.42;
        const ty = bh * (0.44 + 0.08 * Math.sin(u * 47) + 0.05 * Math.sin(u * 113) - 0.12 * (1 - v));
        const sy = ty / bh * tex.height;
        c.drawImage(tex, sx, 0, sw, sy, i, dy, step + 0.6, ty);
        if(shade){ c.fillStyle = shadeCol; c.fillRect(i, dy, step + 0.6, ty); }
        c.fillStyle = 'rgba(150,130,95,0.75)'; c.fillRect(i, dy + ty - 1, step + 0.6, 1.3);   // 해진 올
        const fl = 3 + v * (6 + (motionOK ? Math.sin(time * 10 - u * 9) * 7 + Math.sin(time * 17 + u * 23) * 2.5 : 0));
        const fx = v * (motionOK ? Math.sin(time * 7 + u * 4) * 3 : 0);
        c.save(); c.translate(i + fx, dy + ty + fl); c.rotate(motionOK ? Math.sin(time * 9 - u * 6) * 0.12 * v : 0);
        c.drawImage(tex, sx, sy, sw, tex.height - sy, 0, 0, step + 0.6, bh - ty);
        c.fillStyle = 'rgba(0,0,0,' + (0.08 + v * 0.1) + ')'; c.fillRect(0, 0, step + 0.6, bh - ty);
        c.fillStyle = 'rgba(150,130,95,0.75)'; c.fillRect(0, 0, step + 0.6, 1.2);
        c.restore();
      }else if(u > 0.14 && u < 0.32){
        // 아래쪽이 뜯겨 나간 자리
        const v = Math.sin((u - 0.14) / 0.18 * Math.PI);
        const ty = bh * (1 - v * (0.3 + 0.1 * Math.sin(u * 89)));
        c.drawImage(tex, sx, 0, sw, ty / bh * tex.height, i, dy, step + 0.6, ty);
        if(shade){ c.fillStyle = shadeCol; c.fillRect(i, dy, step + 0.6, ty); }
        c.fillStyle = 'rgba(150,130,95,0.75)'; c.fillRect(i, dy + ty - 1, step + 0.6, 1.3);
      }else{
        c.drawImage(tex, sx, 0, sw, tex.height, i, dy, step + 0.6, bh);
        if(shade){ c.fillStyle = shadeCol; c.fillRect(i, dy, step + 0.6, bh); }
      }
    }
    c.restore();
    // 끈
    c.strokeStyle = '#d8cfb8'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(LT[0], LT[1] + 2); c.lineTo(L[0], L[1]); c.stroke();
    // 부러진 윗토막 (현수막 앞)
    pzPole(c, RH, RT, 5);
    pzSplinter(c, RH, phi - Math.PI / 2 + Math.PI, 5);
    c.strokeStyle = '#d8cfb8'; c.beginPath(); c.moveTo(RT[0], RT[1]); c.lineTo(R[0] - 2, R[1] + 6); c.stroke();
  }

      c.fillStyle = '#a8202a'; c.fillText(plaza.fee + '원 반대!', 0, 0);

      // 발자국
      if(ua > 0.9){ c.fillStyle = 'rgba(60,50,40,0.35)'; c.beginPath(); c.ellipse((x1 + x2) / 2 + 6 * s, y0 - 3 * s, 3 * s, 1.6 * s, 0.3, 0, TAU); c.fill(); }
