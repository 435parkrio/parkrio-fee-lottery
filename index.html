  /* Layout: one card. A dark studio stage (glass sphere blown by air from below, LED ring, clear base with a rail, golden octopus) on top; results rows per game below. */
  :root{
    --bg:#eef1f8;
    --card:#ffffff;
    --card2:#f4f6fb;
    --text:#20263a;
    --muted:#6b7386;
    --border:#dfe3f0;
    --accent:#ff6a2e;
    --accent2:#f0a500;
    --on-accent:#241203;
    --err:#d03b3b;
    --shadow:0 20px 50px rgba(32,38,58,0.14);
    --glow1:rgba(255,122,69,0.18);
    --glow2:rgba(63,150,255,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420;
      --card:#171e2e;
      --card2:#1e2740;
      --text:#f2f4f8;
      --muted:#8b93a7;
      --border:#2a3350;
      --accent:#ff7a45;
      --accent2:#ffd23f;
      --err:#ff7b7b;
      --shadow:0 20px 50px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420;
    --card:#171e2e;
    --card2:#1e2740;
    --text:#f2f4f8;
    --muted:#8b93a7;
    --border:#2a3350;
    --accent:#ff7a45;
    --accent2:#ffd23f;
    --err:#ff7b7b;
    --shadow:0 20px 50px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding-inline:16px;
    padding-block:10px 28px;
    background:
      radial-gradient(circle at 15% 8%, var(--glow1), transparent 40%),
      radial-gradient(circle at 85% 92%, var(--glow2), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:14px;
  }
  .wrap{ width:100%; max-width:560px; margin-inline:auto; }
  h1{
    font-size:20px; text-align:center; margin:0 0 2px; letter-spacing:-0.3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:800; text-wrap:balance;
  }
  .sub{ text-align:center; color:var(--muted); font-size:12px; margin:0 0 8px; }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:10px 12px 16px;
    overflow:hidden;
    position:relative;
  }
  button{ font-family:inherit; }
  button:focus-visible, summary:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .controls{
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;
  }
  .seg{
    display:inline-flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; background:var(--card2);
  }
  .seg-btn{
    min-height:42px; padding:0 18px; border:0; background:transparent; color:var(--muted);
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .seg-btn[aria-pressed="true"]{
    background:linear-gradient(90deg, var(--accent), var(--accent2)); color:var(--on-accent);
  }
  .seg-btn:disabled, .chip:disabled{ opacity:0.55; cursor:default; }
  .chip{
    min-height:42px; padding:0 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:13px; cursor:pointer;
  }
  .chip:active{ transform:scale(0.97); }

  .exclude-wrap{ margin-bottom:0; }
  .exclude-wrap summary{
    font-size:12px; color:var(--muted); cursor:pointer; user-select:none; text-align:center; padding:3px 0;
  }
  .exclude-input{
    width:100%; margin-top:6px; font-size:16px; padding:10px; border-radius:9px;
    border:1px solid var(--border); background:var(--card2); color:var(--text);
  }
  .exclude-hint{ font-size:11px; color:var(--muted); margin-top:5px; text-align:center; }
  .err{ color:var(--err); font-size:12px; text-align:center; }
  .err:not(:empty){ margin-top:4px; }

  .status{ flex:1 1 180px; text-align:center; font-size:14px; font-weight:700; min-height:20px; margin:0; text-wrap:balance; }

<script>
/* ======================================================================
   사운드: Web Audio로 만든 음악과 효과음 (외부 파일 없음)
   A minor 계열 4마디 진행(Am - F - C - G), 112 BPM, 약한 스윙
   ====================================================================== */
// 수수료 등급: 20~30원 대박, 31~40원 초대박, 41~56원 잭팟, 57원 초잭팟
function feeTier(f){
  if(f >= 57) return { lv:4, word:'초잭팟' };
  if(f >= 41) return { lv:3, word:'잭팟' };
  if(f >= 31) return { lv:2, word:'초대박' };
  if(f >= 20) return { lv:1, word:'대박' };
  return { lv:0, word:'' };
}
const Sound = (function(){
  let ctx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, noiseBuf = null;
  let muted = false, timer = null, nextT = 0, step = 0, playing = false;
  let windGain = null, windFilt = null;
  // 경쾌한 장조 진행 C - G - Am - F, 138 BPM
  const BPM = 152, SIX = 60 / BPM / 4;
  const chords = [
    [261.63, 329.63, 392.00, 523.25],   // C
    [196.00, 246.94, 293.66, 392.00],   // G
    [220.00, 261.63, 329.63, 440.00],   // Am
    [174.61, 220.00, 261.63, 349.23]    // F
  ];
  const roots = [130.81, 98.00, 110.00, 87.31];
  let party = false;
  const arpPat = [0,2,1,3,2,1,3,2, 0,2,1,3,2,3,1,2];
  const pent = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

  function init(){
    try{
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return false;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 12;   // 소리가 겹쳐도 깨지지 않게
        comp.attack.value = 0.002; comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.8;
        master.connect(comp); comp.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.gain.value = 0.0001; musicBus.connect(master);
        sfxBus = ctx.createGain(); sfxBus.gain.value = 1.6; sfxBus.connect(master);
        // 점 8분음표 딜레이 (공간감)
        delayIn = ctx.createGain();
        const dl = ctx.createDelay(1.0); dl.delayTime.value = SIX * 3;
        const fb = ctx.createGain(); fb.gain.value = 0.38;
        const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2600;
        const wet = ctx.createGain(); wet.gain.value = 0.3;
        delayIn.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(wet); wet.connect(master);
        const len = ctx.sampleRate * 2;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      }
      if(ctx.state === 'suspended') ctx.resume();
      return true;
    }catch(e){ return false; }
  }

  function voice(o){
    const t = o.t;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.dur*0.7));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.peak, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g);
    let out = g;
    if(o.lp){
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if(o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + o.dur);
      g.connect(f); out = f;
    }
    out.connect(o.dest || sfxBus);
    if(o.send){ const s = ctx.createGain(); s.gain.value = o.send; out.connect(s); s.connect(delayIn); }
    osc.start(t); osc.stop(t + o.dur + 0.05);
  }

  function noiseHit(t, dur, peak, o){
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    // 긴 효과음도 버퍼 끝에서 조용히 끊기지 않도록 반복 재생한다.
    if(dur + 1.2 > noiseBuf.duration) s.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f, t);
    if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(o.dest || sfxBus);
    if(o.send){ const sg = ctx.createGain(); sg.gain.value = o.send; g.connect(sg); sg.connect(delayIn); }
    s.start(t, Math.random()*1.2, dur + 0.05);
  }

  function bell(f, t, peak, dur){
    voice({ type:'sine', f:f, t:t, dur:dur, peak:peak, send:0.5 });
    voice({ type:'sine', f:f*2.76, t:t, dur:dur*0.35, peak:peak*0.25, send:0.3 });
    voice({ type:'sine', f:f*5.4, t:t, dur:dur*0.15, peak:peak*0.08 });
  }

  function pad(f, t, dur){
    const o = ctx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = Math.random()*10 - 5;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.5);
    g.gain.setValueAtTime(0.028, t + dur - 0.5);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function scheduleStep(s, t){
    const bar = Math.floor(s/16) % 4, k = s % 16, ch = chords[bar];
    if(k % 4 === 0) voice({ type:'sine', f:150, f2:46, glide:0.12, t:t, dur:0.18, peak:0.55, dest:musicBus });
    if(k % 4 === 2) noiseHit(t, 0.05, 0.07, { type:'highpass', f:7000, dest:musicBus });
    if(k % 2 === 1) noiseHit(t, 0.03, 0.02, { type:'highpass', f:9000, dest:musicBus });
    if(k === 4 || k === 12) noiseHit(t, 0.13, 0.09, { type:'bandpass', f:1700, q:0.8, dest:musicBus, send:0.25 });
    if(k === 0 || k === 6 || k === 10){
      voice({ type:'triangle', f:roots[bar] * (k === 6 ? 2 : 1), t:t, dur:SIX * (k === 0 ? 5 : 3), peak:0.22, lp:420, dest:musicBus });
    }
    voice({ type:'sawtooth', f:ch[arpPat[k]] * 2, t:t, dur:0.22, peak:0.05, att:0.004, lp:2400, lp2:500, send:0.45, dest:musicBus });
    if(k === 0) ch.slice(0,3).forEach(function(f){ pad(f, t, SIX * 16); });
    if(k % 4 === 2) noiseHit(t, 0.09, 0.05, { type:'highpass', f:6000, dest:musicBus });          // 오픈 하이햇 (엇박)
    // 통통 튀는 베이스 (옥타브를 오르내림)
    if(k % 2 === 0) voice({ type:'square', f:roots[bar] * (k % 4 === 2 ? 2 : 1), t:t, dur:SIX * 0.9, peak:0.06, lp:700, dest:musicBus });
    // 늘 흐르는 경쾌한 멜로디 (밝은 장조 음계)
    const mel = [0, 2, 4, 2, 5, 4, 2, 0, 3, 4, 5, 4, 2, 4, 1, 0];
    if(k % 2 === 0 || k === 7 || k === 15){
      voice({ type:'triangle', f:pent[mel[k] % pent.length] * 2, t:t, dur:SIX * 1.2, peak:0.06, send:0.25, dest:musicBus });
    }
    if(k === 4 || k === 12) noiseHit(t, 0.08, 0.07, { type:'bandpass', f:1500, q:0.7, dest:musicBus });   // 손뼉 박자
    if(party){
      // 축제 리드: 밝은 멜로디가 춤추듯 튄다
      if(k % 2 === 0 && Math.random() < 0.8){
        const f = pent[Math.floor(Math.random() * pent.length)] * (Math.random() < 0.3 ? 2 : 1);
        voice({ type:'square', f:f, t:t, dur:SIX * 1.6, peak:0.045, lp:3200, send:0.35, dest:musicBus });
      }
      if(k === 4 || k === 12) noiseHit(t, 0.1, 0.12, { type:'bandpass', f:1400, q:0.6, dest:musicBus });   // 박수
    }
  }
  function setParty(on){ party = on; }

  // 사장님 반응: 낮으면 "뿌우우~" 실망 트롬본, 높으면 신나는 휘파람과 종소리
  function reaction(m){
    if(!ctx) return;
    const t = ctx.currentTime;
    if(m < 0.35){
      [659.25, 587.33, 523.25, 392.00].forEach(function(f, k){ bell(f, t + k * 0.16, 0.12, 0.6); });   // 내려가는 종소리
    }else if(m < 0.65){
      voice({ type:'triangle', f:330, f2:300, t:t, dur:0.3, peak:0.12 });
      voice({ type:'triangle', f:392, t:t + 0.32, dur:0.4, peak:0.12 });
    }else{
      voice({ type:'sine', f:1200, f2:2400, glide:0.25, t:t, dur:0.3, peak:0.12, send:0.3 });
      voice({ type:'sine', f:1400, f2:2800, glide:0.25, t:t + 0.35, dur:0.35, peak:0.12, send:0.3 });
      [784, 988, 1175, 1568].forEach(function(f, k){ bell(f, t + 0.7 + k * 0.08, 0.14, 1.2); });
    }
  }

  // 추첨기가 맹렬하게 돌 때: 점점 빨라지고 커지는 드럼롤
  function drumroll(dur){
    if(!ctx) return;
    const t0 = ctx.currentTime;
    let t = 0, nk = 0;
    while(t < dur){
      const u = t / dur;
      noiseHit(t0 + t, 0.06, 0.05 + u * 0.16, { type:'bandpass', f:1800 + u * 800, q:0.9 });
      if(t >= nk){ voice({ type:'sine', f:110, f2:60, t:t0 + t, dur:0.15, peak:0.15 + u * 0.2 }); nk += 0.25; }   // 둥둥 탐
      t += lerpN(0.1, 0.028, u);
    }
    voice({ type:'sine', f:55, t:t0, dur:dur, peak:0.12, att:dur * 0.9 });   // 낮게 깔리는 울림
  }
  function lerpN(a, b, u){ return a + (b - a) * u; }

  // 결정 순간: 크래시 심벌 + 일렉기타 파워코드 리프 + 관중 함성
  let shaper = null;
  function powerChord(root, t, dur, peak){
    if(!shaper){
      shaper = ctx.createWaveShaper();
      const n = 1024, cv = new Float32Array(n);
      for(let i=0;i<n;i++){ const x = i / (n - 1) * 2 - 1; cv[i] = Math.tanh(x * 6); }
      shaper.curve = cv;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
      shaper.connect(lp); lp.connect(hp); hp.connect(sfxBus);
      shaper.out = lp;
    }
    [1, 1.5, 2].forEach(function(m, k){
      [-7, 7].forEach(function(dt){
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = root * m; o.detune.value = dt;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak * (k ? 0.6 : 1), t + 0.01);
        g.gain.setValueAtTime(peak * (k ? 0.6 : 1) * 0.8, t + dur * 0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(shaper);
        o.start(t); o.stop(t + dur + 0.05);
      });
    });
  }
  function rockHit(){
    if(!ctx) return;
    const t = ctx.currentTime;
    noiseHit(t, 1.8, 0.28, { type:'highpass', f:4500, send:0.3 });                         // 크래시
    voice({ type:'sine', f:140, f2:40, glide:0.15, t:t, dur:0.4, peak:0.8 });               // 킥
    const E = 82.41, G = 98.00, A = 110.00, D = 146.83;
    [[E, 0, 0.5], [G, 0.5, 0.25], [A, 0.75, 0.25], [E, 1.0, 0.25], [D * 0.75, 1.25, 0.25], [E, 1.5, 1.4]].forEach(function(n){
      powerChord(n[0], t + n[1], n[2], 0.09);
    });
  }

  function schedule(){
    if(!ctx) return;
    while(nextT < ctx.currentTime + 0.15){
      scheduleStep(step, nextT);
      nextT += SIX * (step % 2 === 0 ? 1.08 : 0.92);
      step++;
    }
  }

  function startMusic(){
    if(!ctx || playing) return;
    playing = true;
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(0.0001, t);
    musicBus.gain.linearRampToValueAtTime(0.4, t + 0.4);
    nextT = t + 0.06; step = 0;
    timer = setInterval(schedule, 30);
  }

  function stopMusic(fade){
    if(!ctx || !playing) return;
    playing = false;
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, 0.0001), t);
    musicBus.gain.linearRampToValueAtTime(0.0001, t + fade);
    if(timer){ clearInterval(timer); timer = null; }
  }

  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function lerp(a, b, u){ return a + (b - a) * u; }

  /* ---- 공의 3D 방향: 번호가 인쇄된 면(d)과 글자의 위쪽(u)이 바람과 충돌에 따라 돌아간다 ---- */
  function orthonorm(o){
    let l = Math.hypot(o.dx, o.dy, o.dz) || 1;
    o.dx /= l; o.dy /= l; o.dz /= l;
    const p = o.ux*o.dx + o.uy*o.dy + o.uz*o.dz;
    o.ux -= o.dx*p; o.uy -= o.dy*p; o.uz -= o.dz*p;
    l = Math.hypot(o.ux, o.uy, o.uz);
    if(l < 1e-6){
      const ax = Math.abs(o.dx) < 0.9 ? 1 : 0, ay = 1 - ax;
      const q = ax*o.dx + ay*o.dy;
      o.ux = ax - o.dx*q; o.uy = ay - o.dy*q; o.uz = -o.dz*q;
      l = Math.hypot(o.ux, o.uy, o.uz) || 1;
    }
    o.ux /= l; o.uy /= l; o.uz /= l;
  }
  function randomOrient(o){
    const z = rand(-1, 1), ph = rand(0, TAU), s = Math.sqrt(1 - z*z);
    o.dx = s * Math.cos(ph); o.dy = s * Math.sin(ph); o.dz = z;
    o.ux = rand(-1, 1); o.uy = rand(-1, 1); o.uz = rand(-1, 1);
    orthonorm(o);
    o.wx = 0; o.wy = 0; o.wz = 0;
  }
  function copyOrient(src, dst){
    dst.dx = src.dx; dst.dy = src.dy; dst.dz = src.dz;
    dst.ux = src.ux; dst.uy = src.uy; dst.uz = src.uz;
    dst.wx = src.wx; dst.wy = src.wy; dst.wz = src.wz;
    return dst;
  }
  function rodr(vx, vy, vz, kx, ky, kz, c, s, oc){
    const dot = kx*vx + ky*vy + kz*vz;
    return [
      vx*c + (ky*vz - kz*vy)*s + kx*dot*oc,
      vy*c + (kz*vx - kx*vz)*s + ky*dot*oc,
      vz*c + (kx*vy - ky*vx)*s + kz*dot*oc
    ];
  }
  function spin(o, dt){
    const w = Math.hypot(o.wx, o.wy, o.wz);
    if(w < 1e-4) return;
    const kx = o.wx / w, ky = o.wy / w, kz = o.wz / w, th = w * dt;
    const c = Math.cos(th), s = Math.sin(th), oc = 1 - c;
    const d = rodr(o.dx, o.dy, o.dz, kx, ky, kz, c, s, oc);
    const u = rodr(o.ux, o.uy, o.uz, kx, ky, kz, c, s, oc);
    o.dx = d[0]; o.dy = d[1]; o.dz = d[2];
    o.ux = u[0]; o.uy = u[1]; o.uz = u[2];
    orthonorm(o);
  }

  /* ---- 공 그림: 색 공(번호 없음) + 양쪽에 인쇄된 번호 라벨 + 고정된 빛과 그림자 ---- */
  /* ---- 꼴뚜기: 번호가 적힌 몸통, 지느러미, 눈, 하늘거리는 다리. 바람에 뒤집히고 돌며 날린다 ---- */
  const SQW = 110, SQH = 150, SQX = 55, SQY = 74;   // 스프라이트 크기와 몸 중심(충돌 원의 중심)
  const SQS = 1.3;                                    // 스프라이트 해상도 배율
  function paintSquid(x, n, frame, front){
    const pal = PALS[palIdx(n)];
    x.save(); x.translate(SQX, SQY - 12);
    x.lineCap = 'round'; x.lineJoin = 'round';
    const wig = frame ? 1 : -1;
    // 짧은 다리 8개
    for(let k=0;k<8;k++){
      const sx = -21 + k * 6;
      const sway = Math.sin(k * 1.3) * 4 + wig * (k % 2 ? 4 : -4);
      x.strokeStyle = k % 2 ? pal[1] : pal[2]; x.lineWidth = 6.5;
      x.beginPath(); x.moveTo(sx, 26);
      x.quadraticCurveTo(sx * 1.1 + sway, 44, sx * 1.3 - sway * 0.6, 58 + (k % 3) * 3);
      x.stroke();
    }
    // 긴 다리 2개 (끝이 둥근 촉완)
    [-1, 1].forEach(function(s){
      x.strokeStyle = pal[2]; x.lineWidth = 4.5;
      const ex = s * 15 + wig * s * 3, ey = 78;
      x.beginPath(); x.moveTo(s * 8, 26);
      x.bezierCurveTo(s * 18 + wig * s * 4, 46, s * 4 - wig * 4, 62, ex, ey); x.stroke();
      x.fillStyle = pal[1]; x.beginPath(); x.ellipse(ex, ey + 2, 4.5, 6, s * 0.3, 0, TAU); x.fill();
    });
    // 지느러미 (몸통 뒤)
    x.fillStyle = pal[2];
    [-1, 1].forEach(function(s){
      x.beginPath(); x.moveTo(s * 8, -52); x.quadraticCurveTo(s * 36, -46, s * 30, -26); x.lineTo(s * 14, -30); x.closePath(); x.fill();
    });
    // 몸통
    let g = x.createRadialGradient(-9, -30, 3, 0, -12, 46);
    g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, pal[2]);
    if(!front){ g = x.createRadialGradient(9, -30, 3, 0, -12, 46); g.addColorStop(0, pal[1]); g.addColorStop(1, pal[2]); }
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, -62);
    x.bezierCurveTo(18, -52, 25, -22, 24, 6);
    x.quadraticCurveTo(23, 30, 0, 31);
    x.quadraticCurveTo(-23, 30, -24, 6);
    x.bezierCurveTo(-25, -22, -18, -52, 0, -62);
    x.closePath(); x.fill();
    x.strokeStyle = 'rgba(0,0,0,0.18)'; x.lineWidth = 1.5; x.stroke();
    // 점무늬
    x.fillStyle = 'rgba(0,0,0,0.13)';
    [[-14, -40, 2.6], [13, -36, 2.2], [-16, -2, 2], [16, 0, 2.4], [7, -50, 1.8]].forEach(function(p){ x.beginPath(); x.arc(p[0], p[1], p[2], 0, TAU); x.fill(); });
    if(front){
      // 번호
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(0, -22, 17, 0, TAU); x.fill();
      x.strokeStyle = pal[2]; x.lineWidth = 2.5; x.stroke();
      x.fillStyle = '#1c2036';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '900 ' + (n >= 10 ? 18 : 21) + 'px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      x.fillText(String(n), 0, -26);
      x.font = '800 10px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      x.fillText('원', 0, -12);
      // 눈
      [-1, 1].forEach(function(s){
        x.fillStyle = '#ffffff'; x.beginPath(); x.ellipse(s * 11, 13, 6.5, 7.5, 0, 0, TAU); x.fill();
        x.fillStyle = '#16182a'; x.beginPath(); x.arc(s * 10.5, 14, 4, 0, TAU); x.fill();
        x.fillStyle = '#ffffff'; x.beginPath(); x.arc(s * 10.5 - 1.5, 12.3, 1.5, 0, TAU); x.fill();
      });
      x.fillStyle = 'rgba(255,120,140,0.5)';
      x.beginPath(); x.arc(-17, 22, 3.5, 0, TAU); x.fill(); x.beginPath(); x.arc(17, 22, 3.5, 0, TAU); x.fill();
    }
    // 광택
    x.fillStyle = 'rgba(255,255,255,' + (front ? 0.45 : 0.25) + ')';
    x.beginPath(); x.ellipse(-10, -42, 4.5, 11, 0.25, 0, TAU); x.fill();
    x.restore();
  }
  function makeSquid(n, frame, front, sc){
    const c = document.createElement('canvas');
    c.width = Math.round(SQW * sc); c.height = Math.round(SQH * sc);
    const x = c.getContext('2d'); x.scale(sc, sc);
    paintSquid(x, n, frame, front);
    return c;
  }
  const fronts = {}, backs = {};
  for(let n=1;n<=20;n++) fronts[n] = [makeSquid(n, 0, true, SQS), makeSquid(n, 1, true, SQS)];
  for(let n=1;n<=20;n++)(function(n){ backs[palIdx(n)] = [makeSquid(n, 0, false, SQS), makeSquid(n, 1, false, SQS)]; })(n);
  const urlCache = {};
  function squidURL(n){
    if(!urlCache[n]) urlCache[n] = makeSquid(n, 0, true, 2.4).toDataURL();
    return urlCache[n];

  // 공의 3D 방향(d: 번호 면, u: 머리 쪽)을 꼴뚜기의 기울기와 뒤집힘으로 그린다
  function drawBall(c, b, x, y, r){
    const ang = Math.atan2(b.ux, -b.uy) + Math.sin(time * 9 + b.n) * 0.45 * partyAmt;   // 축제 때는 몸을 흔들며 춤춘다
    const front = b.dz > 0;
    const sx = clamp(0.45 + Math.abs(b.dz) * 0.8, 0.45, 1);   // 옆으로 돌아도 꼴뚜기 모양이 보이게
    const frame = (Math.floor(time * 5 + b.n * 0.37) % 2 + 2) % 2;
    const spr = front ? fronts[b.n][frame] : backs[palIdx(b.n)][frame];
    const k = r / 50 * 1.0;   // 꼴뚜기를 크게
    c.save();
    c.translate(x, y); c.rotate(ang); c.scale(sx, 1);
    c.drawImage(spr, -SQX * k, -SQY * k, SQW * k, SQH * k);
    c.restore();
  }

  /* ---- 만원권 지폐 그림 (장식용 일러스트) ---- */
  function makeBill(){

    x.strokeStyle = '#2f6b33'; x.lineWidth = 2.5; rrect(x, 7, 7, w - 14, h - 14, 4); x.stroke();

  /* ---- 동전 그림: 10원(구리빛), 50원·100원·500원(은빛) ---- */
  function makeCoin(label, metal){
    const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'), R = S / 2 - 2;
    const pal = metal === 'cu' ? ['#ffe2b0', '#d9913f', '#8a4f14', '#5e3108'] : ['#ffffff', '#cfd6e2', '#8a93a6', '#4f5768'];
    let g = x.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, pal[2]);
    x.fillStyle = g; x.beginPath(); x.arc(S / 2, S / 2, R, 0, TAU); x.fill();
    x.strokeStyle = pal[3]; x.lineWidth = 3; x.stroke();
    // 테두리 톱니
    x.strokeStyle = 'rgba(0,0,0,0.18)'; x.lineWidth = 1.2;
    for(let k=0;k<48;k++){ const a = k / 48 * TAU; x.beginPath(); x.moveTo(S / 2 + Math.cos(a) * (R - 1), S / 2 + Math.sin(a) * (R - 1)); x.lineTo(S / 2 + Math.cos(a) * (R - 6), S / 2 + Math.sin(a) * (R - 6)); x.stroke(); }
    g = x.createLinearGradient(S, S, 0, 0);
    g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, pal[2]);
    x.fillStyle = g; x.beginPath(); x.arc(S / 2, S / 2, R - 8, 0, TAU); x.fill();
    x.fillStyle = pal[3];
    x.font = '900 ' + (label.length > 2 ? 26 : 32) + 'px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(label, S / 2, S / 2 - 6);
    x.font = '800 14px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    x.fillText('원', S / 2, S / 2 + 20);
    x.fillStyle = 'rgba(255,255,255,0.5)'; x.beginPath(); x.ellipse(S * 0.34, S * 0.28, S * 0.14, S * 0.06, -0.7, 0, TAU); x.fill();
    return c;
  }
  const coinSprites = [makeCoin('10', 'cu'), makeCoin('10', 'cu'), makeCoin('50', 'ag'), makeCoin('100', 'ag'), makeCoin('500', 'ag')];

  function rrect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

    g.addColorStop(0, 'rgba(200,225,255,0.18)'); g.addColorStop(0.5, 'rgba(230,240,255,0.32)'); g.addColorStop(1, 'rgba(200,225,255,0.18)');

    for(let k=0;k<5;k++){ c.beginPath(); c.moveTo(CX - 22 + k * 11, 388); c.lineTo(CX - 22 + k * 11, 402); c.stroke(); }

    // 배출 관
    c.lineJoin = 'round'; c.lineCap = 'butt';
    c.strokeStyle = 'rgba(200,230,255,0.34)'; c.lineWidth = 42; tracePath(c, CHUTE); c.stroke();
